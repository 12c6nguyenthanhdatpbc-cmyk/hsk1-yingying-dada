name: Deploy Tieng Trung YingYing DaDa to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
      - name: Chuẩn bị gói web tĩnh
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r public/images dist/images
          if [ -d public/audio ]; then cp -r public/audio dist/audio; fi
      - name: Tải gói lên GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
