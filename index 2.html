          <span class="zh">${escHtml(opt)}</span>
        </button>`;
      }).join('') + `</div>`;
    } else if (ex.type === 'multiple_choice') {
      const cur = Array.isArray(val) ? val : [];
      bodyHtml += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">` + (ex.options || []).map(opt => {
        const chosen = cur.includes(opt);
        return `<button type="button" ${state.submitted ? 'disabled' : ''} onclick="toggleMultiAnswer('${ex.id}', ${'`' + opt.replace(/`/g, '') + '`'})" class="text-left px-3.5 py-2.5 rounded-xl border text-sm font-medium flex items-center gap-2.5 transition ${chosen ? 'bg-[#1D5B9B] text-white border-[#1D5B9B]' : 'bg-white text-[#0F2537] border-[#D6E2EE] hover:border-[#1D5B9B]'}">
          <span class="w-5 h-5 rounded border flex items-center justify-center text-xs ${chosen ? 'bg-white text-[#1D5B9B] border-white' : 'border-[#B9CCE0]'}">${chosen ? '✓' : ''}</span>
          <span class="zh">${escHtml(opt)}</span>
        </button>`;
      }).join('') + `</div>`;
    } else if (ex.type === 'true_false') {
      bodyHtml += `<div class="flex gap-3">` + [[true, '✓ Đúng'], [false, '✗ Sai']].map(([bv, lbl]) => `
        <button type="button" ${state.submitted ? 'disabled' : ''} onclick="setBoolAnswer('${ex.id}', ${bv})" class="flex-1 py-2.5 rounded-xl border font-bold text-sm transition ${val === bv ? 'bg-[#1D5B9B] text-white border-[#1D5B9B]' : 'bg-white border-[#D6E2EE] hover:border-[#1D5B9B]'}">${lbl}</button>
      `).join('') + `</div>`;
    } else if (['fill_blank', 'translate_vi_zh', 'translate_zh_vi'].includes(ex.type)) {
      bodyHtml += `<input type="text" ${state.submitted ? 'disabled' : ''} value="${escHtml(val || '')}" oninput="setTextAnswer('${ex.id}', this.value)" placeholder="${escHtml(ex.placeholder || 'Nhập câu trả lời của bạn...')}" class="w-full px-4 py-2.5 rounded-xl bg-white border border-[#B9CCE0] text-sm zh focus:outline-none focus:border-[#1D5B9B]" />`;
    } else if (ex.type === 'word_order') {
      const chosenTokens = Array.isArray(val) ? val : [];
      const remaining = (ex.tokens || []).filter((t, ti) => {
        const usedCount = chosenTokens.filter(x => x === t).length;
        const priorSame = (ex.tokens || []).slice(0, ti).filter(x => x === t).length;
        return priorSame >= usedCount;
      });
      bodyHtml += `
        <div class="space-y-2.5">
          <div class="min-h-[48px] p-2.5 rounded-xl border-2 border-dashed border-[#B9CCE0] bg-white flex flex-wrap gap-2 items-center">
            ${chosenTokens.length ? chosenTokens.map((t, idxT) => `
              <button type="button" ${state.submitted ? 'disabled' : ''} onclick="removeOrderToken('${ex.id}', ${idxT})" class="zh px-3 py-1.5 rounded-lg bg-[#1D5B9B] text-white text-sm font-bold">${escHtml(t)} ×</button>
            `).join('') : '<span class="text-xs text-[#6E8499]">Nhấn vào các thẻ từ bên dưới theo đúng thứ tự câu...</span>'}
          </div>
          <div class="flex flex-wrap gap-2">
            ${remaining.map(t => `
              <button type="button" ${state.submitted ? 'disabled' : ''} onclick="addOrderToken('${ex.id}', ${'`' + t.replace(/`/g, '') + '`'})" class="zh px-3.5 py-1.5 rounded-lg bg-white border border-[#B9CCE0] hover:border-[#1D5B9B] text-sm font-bold">${escHtml(t)}</button>
            `).join('')}
            ${chosenTokens.length && !state.submitted ? `<button type="button" onclick="clearOrderTokens('${ex.id}')" class="text-xs font-semibold text-[#475F75] underline ml-auto">Xóa xếp lại</button>` : ''}
          </div>
        </div>
      `;
    } else if (ex.type === 'matching') {
      const map = (val && typeof val === 'object') ? val : {};
      const selectedL = state.matchingSelectedLeft[ex.id] || null;
      const rightItems = [...(ex.pairs || []).map(p => p.right)].sort();
      bodyHtml += `
        <div class="text-xs text-[#475F75] mb-2">Bước 1: Chọn 1 từ tiếng Trung bên trái → Bước 2: Chọn nghĩa tiếng Việt bên phải để nối.</div>
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-2">
            ${(ex.pairs || []).map(p => {
              const isSel = selectedL === p.left;
              const matchedVal = map[p.left];
              return `<button type="button" ${state.submitted ? 'disabled' : ''} onclick="selectMatchLeft('${ex.id}', ${'`' + p.left + '`'})" class="w-full text-left px-3 py-2 rounded-xl border text-sm font-bold flex items-center justify-between ${isSel ? 'bg-[#1D5B9B] text-white border-[#1D5B9B]' : matchedVal ? 'bg-[#EAF6EF] border-[#1F7A53] text-[#1F7A53]' : 'bg-white border-[#D6E2EE]'}">
                <span class="zh">${escHtml(p.left)}</span>
                ${matchedVal ? `<span class="text-[11px] font-medium truncate ml-2">→ ${escHtml(matchedVal)}</span>` : ''}
              </button>`;
            }).join('')}
          </div>
          <div class="space-y-2">
            ${rightItems.map(r => `
              <button type="button" ${state.submitted ? 'disabled' : ''} onclick="selectMatchRight('${ex.id}', ${'`' + r + '`'})" class="w-full text-left px-3 py-2 rounded-xl border text-sm font-medium bg-white border-[#D6E2EE] hover:border-[#1D5B9B]">
                ${escHtml(r)}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    } else if (ex.type === 'pinyin_to_hanzi_write') {
      const arr = Array.isArray(val) ? val : [];
      bodyHtml += `
        <div class="text-xs text-[#475F75] mb-3">Gõ chữ Hán bằng bàn phím tiếng Trung (Pinyin) vào từng ô bên dưới.</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          ${(ex.items || []).map((it, ii) => {
            const curVal = arr[ii] || '';
            const itemOk = state.submitted && normText(curVal) === normText(it.answer);
            const itemBad = state.submitted && !itemOk;
            const rowCls = itemOk ? 'border-[#1F7A53] bg-[#EAF6EF]/50' : itemBad ? 'border-[#C43D4B] bg-[#FCECEE]/50' : 'border-[#D6E2EE] bg-white';
            return `
              <div class="p-3 rounded-xl border ${rowCls} space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-[#1D5B9B] text-white text-xs font-extrabold flex items-center justify-center shrink-0">${ii + 1}</span>
                    <span class="font-bold text-sm text-[#0F2537]">${escHtml(it.pinyin)}</span>
                  </div>
                  ${state.submitted ? (itemOk
                    ? `<span class="text-[11px] font-bold text-[#1F7A53]">✓ ${escHtml(it.answer)} (${escHtml(it.meaning)})</span>`
                    : `<span class="text-[11px] font-bold text-[#C43D4B]">✗ Đáp án: ${escHtml(it.answer)} (${escHtml(it.meaning)})</span>`
                  ) : ''}
                </div>
                <input type="text" ${state.submitted ? 'disabled' : ''} value="${escHtml(curVal)}" oninput="setBatchWriteAnswer('${ex.id}', ${ii}, this.value)" placeholder="Gõ chữ Hán vào đây..." class="w-full px-3.5 py-2 rounded-lg bg-[#F3F7FB] border border-[#B9CCE0] text-sm zh focus:outline-none focus:bg-white focus:border-[#1D5B9B]" />
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (ex.type === 'meaning_bank_select') {
      const arr = Array.isArray(val) ? val : [];
      const bank = ex.bank || [];
      const usedKeys = new Set(arr.filter(Boolean));
      const bankMap = Object.fromEntries(bank.map(b => [b.key, b.label]));
      bodyHtml += `
        <div class="text-xs text-[#475F75] mb-2.5">Mỗi nghĩa tiếng Việt dùng một lần. Chọn chữ cái tương ứng ở ô thả xuống bên dưới từng từ.</div>
        <div class="p-3 rounded-xl bg-white border border-[#D6E2EE] mb-3.5 flex flex-wrap gap-2">
          ${bank.map(b => {
            const used = usedKeys.has(b.key);
            return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs transition ${used ? 'bg-[#EAF1F8] border-[#D6E2EE] text-[#6E8499] line-through opacity-75' : 'bg-[#F3F7FB] border-[#B9CCE0] text-[#0F2537] font-medium'}">
              <strong class="text-[#1D5B9B]">${escHtml(b.key)}</strong>
              <span>${escHtml(b.label)}</span>
            </span>`;
          }).join('')}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          ${(ex.items || []).map((it, ii) => {
            const chosen = arr[ii] || '';
            const itemOk = state.submitted && chosen === it.answerKey;
            const itemBad = state.submitted && !itemOk;
            const rowCls = itemOk ? 'border-[#1F7A53] bg-[#EAF6EF]/50' : itemBad ? 'border-[#C43D4B] bg-[#FCECEE]/50' : 'border-[#D6E2EE] bg-white';
            return `
              <div class="p-3 rounded-xl border ${rowCls} space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5">
                    <span class="w-6 h-6 rounded-lg bg-[#1D5B9B] text-white text-xs font-extrabold flex items-center justify-center shrink-0">${ii + 1}</span>
                    <div class="leading-tight">
                      <div class="toggle-pinyin text-[11px] font-medium text-[#1D5B9B]">${escHtml(it.pinyin)}</div>
                      <div class="zh text-lg font-bold text-[#0F2537]">${escHtml(it.hanzi)}</div>
                    </div>
                  </div>
                  ${state.submitted ? (itemOk
                    ? `<span class="text-[11px] font-bold text-[#1F7A53]">✓ ${escHtml(it.answerKey)}</span>`
                    : `<span class="text-[11px] font-bold text-[#C43D4B]">✗ Đáp án: ${escHtml(it.answerKey)} (${escHtml(bankMap[it.answerKey] || '')})</span>`
                  ) : ''}
                </div>
                <select ${state.submitted ? 'disabled' : ''} onchange="setBankSelectAnswer('${ex.id}', ${ii}, this.value)" class="w-full px-3 py-2 rounded-lg bg-[#F3F7FB] border border-[#B9CCE0] text-xs font-medium text-[#0F2537] focus:outline-none focus:bg-white focus:border-[#1D5B9B]">
                  <option value="">— chọn —</option>
                  ${bank.map(b => `<option value="${escHtml(b.key)}" ${chosen === b.key ? 'selected' : ''}>${escHtml(b.key)}. ${escHtml(b.label)}</option>`).join('')}
                </select>
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (ex.type === 'translate_batch_vi_zh') {
      const arr = Array.isArray(val) ? val : [];
      bodyHtml += `
        <div class="mb-3 space-y-0.5">
          <div class="toggle-pinyin text-[11px] font-semibold text-[#1D5B9B]">fānyìchéng Zhōngwén</div>
          <div class="zh text-base font-extrabold text-[#0F2537]">翻译成中文。</div>
          <div class="text-xs text-[#475F75]">Dịch sang tiếng Trung (viết bằng chữ Hán).</div>
        </div>
        <div class="space-y-3">
          ${(ex.items || []).map((it, ii) => {
            const curVal = arr[ii] || '';
            const clean = normText(curVal);
            const acc = (it.acceptedAnswers || [it.sampleAnswer]).map(normText);
            const kws = (it.requiredKeywords || []).map(normText);
            const itemOk = state.submitted && Boolean(clean) && (acc.includes(clean) || (kws.length > 0 && kws.every(k => clean.includes(k))));
            const itemBad = state.submitted && !itemOk;
            const rowCls = itemOk ? 'border-[#1F7A53] bg-[#EAF6EF]/50' : itemBad ? 'border-[#C43D4B] bg-[#FCECEE]/50' : 'border-[#D6E2EE] bg-white';
            return `
              <div class="p-3.5 rounded-xl border ${rowCls} space-y-2">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-start gap-2.5">
                    <span class="w-6 h-6 rounded-lg bg-[#1D5B9B] text-white text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5">${ii + 1}</span>
                    <span class="font-semibold text-sm text-[#0F2537]">${escHtml(it.vi)}</span>
                  </div>
                  ${state.submitted ? (itemOk
                    ? `<span class="text-[11px] font-bold text-[#1F7A53] shrink-0">✓ Đúng</span>`
                    : `<span class="text-[11px] font-bold text-[#C43D4B] shrink-0">✗ Chưa đúng</span>`
                  ) : ''}
                </div>
                <input type="text" ${state.submitted ? 'disabled' : ''} value="${escHtml(curVal)}" oninput="setBatchWriteAnswer('${ex.id}', ${ii}, this.value)" placeholder="Gõ chữ Hán vào đây..." class="w-full px-3.5 py-2.5 rounded-lg bg-[#F3F7FB] border border-[#B9CCE0] text-sm zh focus:outline-none focus:bg-white focus:border-[#1D5B9B]" />
                ${state.submitted ? `
                  <div class="text-xs pt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                    <span class="font-bold text-[#475F75]">Đáp án mẫu:</span>
                    <span class="zh font-bold text-[#1F7A53]">${escHtml(it.sampleAnswer)}</span>
                    <span class="toggle-pinyin text-[#1D5B9B]">(${escHtml(it.pinyin || '')})</span>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    let feedbackHtml = '';
    if (res) {
      const statusBadge = res.status === 'correct'
        ? '<span class="text-[#1F7A53] font-extrabold">✓ Chính xác</span>'
        : res.status === 'incorrect'
          ? '<span class="text-[#C43D4B] font-extrabold">✗ Chưa chính xác</span>'
          : res.status === 'needs_teacher_review'
            ? '<span class="text-[#A16207] font-extrabold">⏳ Cần giáo viên chấm</span>'
            : '<span class="text-[#475F75] font-extrabold">• Chưa làm</span>';
      const correctDisplay = ex.type === 'pinyin_to_hanzi_write' ? (ex.items || []).map((it, i) => (i+1) + '. ' + it.answer).join(' · ') : ex.type === 'meaning_bank_select' ? (ex.items || []).map((it, i) => (i+1) + '. ' + it.hanzi + '→' + it.answerKey).join(' · ') : ex.type === 'translate_batch_vi_zh' ? (ex.items || []).map((it, i) => (i+1) + '. ' + it.sampleAnswer).join(' | ') : (ex.sampleAnswer || (Array.isArray(ex.answer) ? ex.answer.join(' ') : ex.acceptedAnswers ? ex.acceptedAnswers[0] : ex.pairs ? ex.pairs.map(p => p.left + '=' + p.right).join(', ') : (ex.answer === true ? 'Đúng' : ex.answer === false ? 'Sai' : ex.answer)));
      feedbackHtml = `
        <div class="mt-3 pt-3 border-t border-black/10 text-xs space-y-1">
          <div class="flex flex-wrap items-center justify-between gap-2">${statusBadge}<span class="text-[#475F75] font-semibold">Kiến thức: ${escHtml(ex.relatedKnowledge)}</span></div>
          ${res.note ? `<div class="text-[#A16207] font-medium">${escHtml(res.note)}</div>` : ''}
          <div><strong>Đáp án chuẩn:</strong> <span class="zh font-bold text-[#1F7A53]">${escHtml(correctDisplay)}</span></div>
          <div class="text-[#0F2537]"><strong>Giải thích:</strong> ${escHtml(ex.explanation)}</div>
        </div>
      `;
    }

    return `
      <div id="q-card-${ex.id}" class="rounded-2xl border p-4 sm:p-5 scroll-mt-36 ${borderCls}">
        <div class="flex items-start justify-between gap-2 mb-2.5">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2.5 py-0.5 rounded-lg bg-[#0F2537] text-white text-xs font-bold">Câu ${idx + 1}</span>
            <span class="px-2 py-0.5 rounded-lg bg-white border border-[#D6E2EE] text-[11px] font-semibold text-[#475F75]">${EX_TYPE_LABELS[ex.type] || ex.type}</span>${ex.reviewTag ? `<span class="px-2 py-0.5 rounded-lg bg-[#E0F2FE] border border-[#BAE6FD] text-[11px] font-bold text-[#0E7490]">↺ ${escHtml(ex.reviewTag)}</span>` : ''}
          </div>
          <button type="button" onclick="toggleFlagQuestion('${ex.id}')" class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${flagged ? 'bg-[#FEF5E5] text-[#A16207] border-[#D97706]' : 'bg-white text-[#475F75] border-[#D6E2EE]'}">
            ${flagged ? '★ Đã đánh dấu' : '☆ Xem lại'}
          </button>
        </div>
        <div class="font-bold text-sm sm:text-base text-[#0F2537] mb-3 zh">${escHtml(ex.prompt)}</div>
        ${bodyHtml}
        ${feedbackHtml}
      </div>
    `;
  }

  function renderLessonResultSummary(lesson) {
    const vals = Object.values(state.gradeResults);
    const correct = vals.filter(v => v.status === 'correct').length;
    const incorrect = vals.filter(v => v.status === 'incorrect').length;
    const unanswered = vals.filter(v => v.status === 'unanswered').length;
    const review = vals.filter(v => v.status === 'needs_teacher_review').length;
    const total = lesson.exercises.length;
    const scorePct = total ? Math.round((correct / total) * 100) : 0;
    const attempted = total - unanswered;
    const accPct = attempted ? Math.round((correct / attempted) * 100) : 0;

    return `
      <div class="rounded-2xl bg-[#F3F7FB] border-2 border-[#1D5B9B] p-5 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="text-lg font-extrabold text-[#0F2537]">Bảng tổng kết kết quả bài ${lesson.order}</h3>
          <span class="text-xs font-semibold text-[#475F75]">Độ chính xác trên câu đã làm: <strong>${accPct}%</strong></span>
        </div>
        ${state.lastSubmitSyncMsg ? `<div class="px-3 py-2 rounded-xl bg-white border border-[#BFD7EE] text-xs font-semibold text-[#1D5B9B]">${escHtml(state.lastSubmitSyncMsg)}</div>` : ''}
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="p-3.5 rounded-xl bg-[#EAF6EF] text-[#1F7A53]">
            <div class="text-xs font-semibold">Câu đúng</div>
            <div class="text-2xl font-extrabold">${correct}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-[#FCECEE] text-[#C43D4B]">
            <div class="text-xs font-semibold">Câu sai</div>
            <div class="text-2xl font-extrabold">${incorrect}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-[#E4EDF6] text-[#475F75]">
            <div class="text-xs font-semibold">Chưa làm ${review ? '/ Chờ chấm' : ''}</div>
            <div class="text-2xl font-extrabold">${unanswered}${review ? ' / ' + review : ''}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-[#E0EEFA] text-[#1D5B9B]">
            <div class="text-xs font-semibold">Điểm toàn bài</div>
            <div class="text-2xl font-extrabold">${scorePct}%</div>
          </div>
        </div>
        <!-- Thanh độ chính xác -->
        <div class="space-y-1.5">
          <div class="flex justify-between text-xs font-semibold text-[#475F75]">
            <span>Độ chính xác trên các câu đã làm (${attempted}/${total} câu)</span>
            <span class="text-[#1D5B9B] font-extrabold">${accPct}%</span>
          </div>
          <div class="w-full h-2.5 rounded-full bg-[#DCE7F2] overflow-hidden">
            <div class="h-full bg-[#0E7490] rounded-full transition-all" style="width:${accPct}%"></div>
          </div>
        </div>

        <!-- Phân tích chi tiết từng phần kỹ năng (5 phần như bthsk13.0) -->
        <div class="pt-3 border-t border-[#D6E2EE] space-y-2.5">
          <div class="text-xs font-extrabold uppercase tracking-wider text-[#0F2537]">Chi tiết điểm theo 5 phần kỹ năng</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
            ${EX_SECTIONS.map(sec => {
              const secQs = lesson.exercises.filter(e => (e.section || 'grammar') === sec.id);
              if (!secQs.length) return '';
              const secOk = secQs.filter(e => state.gradeResults[e.id]?.status === 'correct').length;
              const secUn = secQs.filter(e => state.gradeResults[e.id]?.status === 'unanswered').length;
              const secPct = Math.round((secOk / secQs.length) * 100);
              return `
                <div class="p-3 rounded-xl bg-white border border-[#D6E2EE] space-y-1.5">
                  <div class="flex items-center justify-between text-xs font-bold">
                    <span class="text-[#0F2537]"><span class="zh text-[#1D5B9B]">${sec.badge}</span> ${sec.title.split(':')[1].split('(')[0].trim()}</span>
                    <span class="text-[#1D5B9B]">${secOk}/${secQs.length}</span>
                  </div>
                  <div class="w-full h-1.5 rounded-full bg-[#EAF1F8] overflow-hidden">
                    <div class="h-full bg-[#1D5B9B] rounded-full" style="width:${secPct}%"></div>
                  </div>
                  <div class="text-[11px] text-[#6E8499]">${secUn ? 'Chưa làm: ' + secUn : 'Đã làm đủ'}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        ${review > 0 ? `<div class="text-xs text-[#A16207] bg-[#FEF5E5] p-3 rounded-xl border border-[#F59E0B]">Có <strong>${review}</strong> câu tự luận/dịch cần giáo viên chấm trực tiếp (không gộp vào câu sai).</div>` : ''}
        <div class="text-[11px] text-[#6E8499]">Lưu ý: Đáp án đã được khóa sau khi nộp bài. Bạn vẫn có thể đổi chế độ Ẩn/Pinyin hoặc nghe lại âm thanh để ôn tập mà không làm thay đổi điểm số.</div>
      </div>
    `;
  }

  // Exercise interaction handlers
  function setSingleAnswer(id, val) { state.answers[id] = val; state.pendingConfirmSubmit = false; render(); }
  function setBoolAnswer(id, val) { state.answers[id] = val; state.pendingConfirmSubmit = false; render(); }
  function setTextAnswer(id, val) { state.answers[id] = val; state.pendingConfirmSubmit = false; }
  function setBatchWriteAnswer(id, idx, val) {
    const arr = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
    arr[idx] = val;
    state.answers[id] = arr;
    state.pendingConfirmSubmit = false;
  }
  function setBankSelectAnswer(id, idx, val) {
    const arr = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
    arr[idx] = val;
    state.answers[id] = arr;
    state.pendingConfirmSubmit = false;
    render();
  }
  function toggleMultiAnswer(id, val) {
    const cur = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
    const idx = cur.indexOf(val);
    if (idx >= 0) cur.splice(idx, 1); else cur.push(val);
    state.answers[id] = cur;
    state.pendingConfirmSubmit = false;
    render();
  }
  function addOrderToken(id, token) {
    const cur = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
    cur.push(token);
    state.answers[id] = cur;
    render();
  }
  function removeOrderToken(id, idx) {
    const cur = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
    cur.splice(idx, 1);
    state.answers[id] = cur;
    render();
  }
  function clearOrderTokens(id) { state.answers[id] = []; render(); }
  function selectMatchLeft(id, left) { state.matchingSelectedLeft[id] = left; render(); }
  function selectMatchRight(id, right) {
    const left = state.matchingSelectedLeft[id];
    if (!left) { showToast('Hãy chọn 1 từ tiếng Trung ở cột bên trái trước.'); return; }
    const map = (state.answers[id] && typeof state.answers[id] === 'object') ? { ...state.answers[id] } : {};
    map[left] = right;
    state.answers[id] = map;
    state.matchingSelectedLeft[id] = null;
    render();
  }
  function toggleFlagQuestion(id) { state.flaggedQuestions[id] = !state.flaggedQuestions[id]; render(); }
  function toggleInstantMode(checked) { state.instantFeedbackMode = checked; render(); }
  function cancelPendingSubmit() { state.pendingConfirmSubmit = false; render(); }

  function handleLessonSubmit() {
    const lesson = getLessons().find(l => l.id === state.activeLessonId);
    const answered = lesson.exercises.filter(ex => isAnswered(ex, state.answers[ex.id])).length;
    if (answered < lesson.exercises.length && !state.pendingConfirmSubmit) {
      state.pendingConfirmSubmit = true;
      showToast('Bạn còn ' + (lesson.exercises.length - answered) + ' câu chưa trả lời. Nhấn Nộp bài lần nữa để xác nhận.');
      render();
      return;
    }
    confirmLessonSubmit();
  }

  function confirmLessonSubmit() {
    const lesson = getLessons().find(l => l.id === state.activeLessonId);
    const resMap = {};
    let correct = 0, incorrect = 0, unanswered = 0, review = 0;
    lesson.exercises.forEach(ex => {
      const r = gradeOne(ex, state.answers[ex.id]);
      resMap[ex.id] = r;
      if (r.status === 'correct') correct++;
      else if (r.status === 'incorrect') incorrect++;
      else if (r.status === 'needs_teacher_review') review++;
      else unanswered++;
    });
    const total = lesson.exercises.length;
    const scorePercent = total ? Math.round((correct / total) * 100) : 0;
    state.gradeResults = resMap;
    state.submitted = true;
    state.pendingConfirmSubmit = false;
    state.attempts.unshift({
      id: 'att-' + Date.now(),
      lessonId: lesson.id,
      lessonTitle: 'Bài ' + lesson.order + ': ' + lesson.zhTitle,
      courseId: lesson.courseId,
      timestamp: new Date().toISOString(),
      correctCount: correct,
      incorrectCount: incorrect,
      unansweredCount: unanswered,
      reviewCount: review,
      totalQuestions: total,
      scorePercent
    });
    safeSave(STORE_KEYS.attempts, state.attempts);
    const skillSummary = {};
    EX_SECTIONS.forEach(sec => {
      const qs = lesson.exercises.filter(ex => (ex.section || 'grammar') === sec.id);
      const okCount = qs.filter(ex => resMap[ex.id] && resMap[ex.id].status === 'correct').length;
      skillSummary[sec.id] = okCount + '/' + qs.length;
    });
    showToast('Đã nộp bài! Điểm của bạn: ' + correct + '/' + total + ' (' + scorePercent + '%).');
    pushScoreToSheets({
      studentName: (state.studentInfo && state.studentInfo.name) || 'Học viên ẩn danh',
      studentContact: (state.studentInfo && state.studentInfo.contact) || '',
      lessonId: lesson.id,
      lessonTitle: 'Bài ' + lesson.order + ': ' + lesson.zhTitle,
      scorePct: scorePercent,
      correctCount: correct,
      totalCount: total,
      skills: skillSummary
    });
    render();
  }

  function retryLesson() {
    state.answers = {};
    state.flaggedQuestions = {};
    state.submitted = false;
    state.gradeResults = null;
    state.pendingConfirmSubmit = false;
    showToast('Đã đặt lại bài tập. Chúc bạn làm bài thật tốt!');
    render();

          ` : '<p class="text-sm text-[#475F75]">Chưa có lịch sử nộp bài. Hãy làm thử Bài 1 HSK 1 để xem biểu đồ cập nhật tự động.</p>'}
        </div>
      </div>
    `;
  }

  function clearProgressHistory() {
    state.attempts = [];
    safeSave(STORE_KEYS.attempts, []);
    showToast('Đã xóa lịch sử làm bài cục bộ.');
    render();
  }

  function mountCharts() {
    if (state.view !== 'results' || typeof Chart === 'undefined') return;
    const c1 = document.getElementById('score-history-chart');
    const c2 = document.getElementById('course-progress-chart');
    if (scoreChartInstance) { scoreChartInstance.destroy(); scoreChartInstance = null; }
    if (courseChartInstance) { courseChartInstance.destroy(); courseChartInstance = null; }

    const recent = [...state.attempts].slice(0, 8).reverse();
    if (c1) {
      scoreChartInstance = new Chart(c1, {
        type: 'line',
        data: {
          labels: recent.length ? recent.map((a, i) => 'Lần ' + (i + 1)) : ['Chưa có dữ liệu'],
          datasets: [{
            label: 'Điểm số (%)',
            data: recent.length ? recent.map(a => a.scorePercent) : [0],
            borderColor: '#1D5B9B',
            backgroundColor: 'rgba(29, 91, 155, 0.14)',
            fill: true,
            tension: 0.35
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }

    if (c2) {
      const courses = getCourses();
      const lessons = getLessons();
      const doneSet = new Set(state.attempts.map(a => a.lessonId));
      courseChartInstance = new Chart(c2, {
        type: 'bar',
        data: {
          labels: courses.map(c => c.code),
          datasets: [{
            label: 'Tỷ lệ hoàn thành (%)',
            data: courses.map(c => {
              const ls = lessons.filter(l => l.courseId === c.id);
              if (!ls.length) return 0;
              return Math.round((ls.filter(l => doneSet.has(l.id)).length / ls.length) * 100);
            }),
            backgroundColor: '#0E7490',
            borderRadius: 8
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }
  }

  function setTeacherTab(tab) { state.teacherSubTab = tab; render(); }

  function handleTeacherFormSubmit(e) {
    e.preventDefault();
    const courseId = document.getElementById('tf-course').value;
    const zhTitle = document.getElementById('tf-zh').value.trim();
    const viTitle = document.getElementById('tf-vi').value.trim();
    const vocabParts = document.getElementById('tf-vocab').value.split('|').map(x => x.trim());
    const grammarTitle = document.getElementById('tf-grammar').value.trim();
    const audioFile = document.getElementById('tf-audio').value.trim();
    const qPrompt = document.getElementById('tf-q-prompt').value.trim();
    const qAns = document.getElementById('tf-q-ans').value.trim();

    const existing = getLessons().filter(l => l.courseId === courseId);
    const nextOrder = existing.length + 1;
    const newId = courseId + '-' + String(nextOrder).padStart(2, '0') + '-' + Date.now().toString().slice(-3);
    const newLesson = {
      id: newId,
      courseId,
      order: nextOrder,
      group: 'Bài tự soạn',
      zhTitle,
      pinyinTitle: '',
      viTitle,
      image: 'images/hsk1-lesson01.jpg',
      estimatedMinutes: 20,
      summary: 'Bài học do giáo viên biên soạn trong Khu vực Quản lý Nội dung.',
      vocabulary: [{
        id: 'v-' + Date.now(),
        hanzi: vocabParts[0] || '你好',
        pinyin: vocabParts[1] || 'nǐ hǎo',
        meaning: vocabParts[2] || 'Xin chào',
        pos: 'Từ vựng',
        exampleZh: zhTitle,
        examplePinyin: '',
        exampleVi: viTitle,
        explanation: 'Từ vựng do giáo viên thêm mới.',
        collocations: [],
        extraExample: zhTitle
      }],
      dialogues: [{
        id: 'd-' + Date.now(),
        title: 'Hội thoại bài ' + nextOrder,
        context: viTitle,
        audioFile,
        lines: [{ speaker: 'A', side: 'left', zh: zhTitle, pinyin: '', vi: viTitle }]
      }],
      grammar: [{
        id: 'g-' + Date.now(),
        title: grammarTitle || 'Ngữ pháp trọng tâm',
        formula: zhTitle,
        usage: 'Áp dụng trong giao tiếp theo chủ đề bài học.',
        explanation: viTitle,
        examples: [{ zh: zhTitle, pinyin: '', vi: viTitle }],
        commonMistake: 'Lưu ý trật tự từ tiếng Trung.',
        comparison: 'Đối chiếu với cấu trúc đã học.'
      }],
      patterns: [{ zh: zhTitle, pinyin: '', vi: viTitle }],
      exercises: [{
        id: 'q-' + Date.now(),
        type: 'single_choice',
        points: 1,
        prompt: qPrompt || 'Chọn đáp án đúng:',
        options: [qAns || zhTitle, '你好', '再见'],
        answer: qAns || zhTitle,
        explanation: 'Đáp án đúng do giáo viên thiết lập.',
        relatedKnowledge: grammarTitle || 'Kiến thức bài ' + nextOrder
      }]
    };
    state.customLessons.push(newLesson);
    safeSave(STORE_KEYS.customLessons, state.customLessons);
    state.teacherJsonDraft = JSON.stringify(newLesson, null, 2);
    showToast('Đã tạo bài học "' + zhTitle + '"! Bạn có thể vào Khóa học để xem ngay.');
    render();
  }

  function handleAddCourse(e) {
    e.preventDefault();
    const code = document.getElementById('tc-code').value.trim();
    const title = document.getElementById('tc-title').value.trim();
    const desc = document.getElementById('tc-desc').value.trim();
    const id = code.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString().slice(-3);
    state.customCourses.push({
      id, code, title, zhTitle: code, levelGroup: 'Tùy chỉnh', description: desc,
      targetVocab: 150, status: 'active', accentColor: '#0E7490', lessonIds: []
    });
    safeSave(STORE_KEYS.customCourses, state.customCourses);
    showToast('Đã thêm khóa học "' + title + '"!');
    render();
  }

  function moveLessonOrder(lessonId, dir) {
    const all = getLessons().map(l => ({ ...l }));
    const idx = all.findIndex(l => l.id === lessonId);
    const target = idx + dir;
    if (idx < 0 || target < 0 || target >= all.length) return;
    const tmp = all[idx].order;
    all[idx].order = all[target].order;
    all[target].order = tmp;
    state.customLessons = all;
    safeSave(STORE_KEYS.customLessons, state.customLessons);
    showToast('Đã cập nhật thứ tự bài học.');
    render();
  }

  function loadTemplateJson() {
    state.teacherJsonDraft = JSON.stringify(SEED.templateLesson, null, 2);
    render();
  }

  function importJsonFromEditor() {
    const raw = document.getElementById('teacher-json-editor').value;
    state.teacherJsonDraft = raw;
    try {
      const parsed = JSON.parse(raw);
      if (!parsed.id || !parsed.zhTitle || !Array.isArray(parsed.vocabulary)) {
        showToast('JSON thiếu trường bắt buộc (id, zhTitle hoặc vocabulary).');
        return;
      }
      state.customLessons = [...state.customLessons.filter(l => l.id !== parsed.id), parsed];
      safeSave(STORE_KEYS.customLessons, state.customLessons);
      showToast('Đã nhập thành công bài học "' + parsed.zhTitle + '"!');
      render();
    } catch (err) {
      showToast('Lỗi cú pháp JSON. Vui lòng kiểm tra lại ngoặc và dấu phẩy.');
    }
  }

  function triggerDownload(filename, text) {
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function downloadEditorJson() {
    const raw = document.getElementById('teacher-json-editor').value;
    triggerDownload('yingying-dada-lesson.json', raw);
    showToast('Đang tải xuống file yingying-dada-lesson.json');
  }

  function exportAllJson() {
    const bundle = { courses: getCourses(), lessons: getLessons(), listening: SEED.listening };
    triggerDownload('yingying-dada-curriculum-backup.json', JSON.stringify(bundle, null, 2));
    showToast('Đã xuất toàn bộ dữ liệu khóa học & bài học!');
  }

  // ==================== MASTER RENDER ====================
  function render() {
    renderNav();
    const root = document.getElementById('app-root');
    if (state.view === 'home') root.innerHTML = renderHome();
    else if (state.view === 'courses') root.innerHTML = renderCourses();
    else if (state.view === 'vocab') root.innerHTML = renderVocabBank();
    else if (state.view === 'lesson') root.innerHTML = renderLesson();
    else if (state.view === 'listening') root.innerHTML = renderListening();
    else if (state.view === 'results') root.innerHTML = renderResults();
    else if (state.view === 'teacher') root.innerHTML = renderTeacher();

    if (typeof lucide !== 'undefined' && lucide.createIcons) {
      lucide.createIcons();
    }
    mountCharts();
  }

  render();
    if (state.gasUrl) { syncFromGoogleSheets(true); }
</script>
