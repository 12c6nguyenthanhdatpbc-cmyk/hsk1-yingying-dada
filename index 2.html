của 6 từ vựng cốt lõi trong Bài 1.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 1"}, {"id": "q30-1-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Ngài, ông, bà, thầy, cô (kính ngữ)"}, {"key": "B", "label": "Bạn học"}, {"key": "C", "label": "Các bạn, các anh, các chị"}, {"key": "D", "label": "Đừng khách sáo, không cần khách khí"}, {"key": "E", "label": "Cảm ơn"}, {"key": "F", "label": "Thầy giáo, cô giáo, giáo viên"}], "items": [{"hanzi": "老师", "pinyin": "lǎoshī", "answerKey": "F"}, {"hanzi": "您", "pinyin": "nín", "answerKey": "A"}, {"hanzi": "你们", "pinyin": "nǐmen", "answerKey": "C"}, {"hanzi": "谢谢", "pinyin": "xièxie", "answerKey": "E"}, {"hanzi": "不客气", "pinyin": "bú kèqi", "answerKey": "D"}, {"hanzi": "同学", "pinyin": "tóngxué", "answerKey": "B"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 1.", "relatedKnowledge": "Từ mới Bài 1"}, {"id": "q30-1-01", "type": "single_choice", "points": 1, "prompt": "Khi có người nói 「谢谢！」, câu đáp lịch sự nhất là:", "options": ["再见！", "不客气！", "大家好！", "老师好！"], "answer": "不客气！", "explanation": "「谢谢！」 (Cảm ơn) đáp lại bằng 「不客气！」 (Đừng khách sáo).", "relatedKnowledge": "Bài khóa 3 – Cảm ơn", "section": "grammar"}, {"id": "q30-1-02", "type": "single_choice", "points": 1, "prompt": "Gặp cô Vương (王老师), học sinh chào lịch sự là:", "options": ["王老师，您好！", "王老师，你们好！", "王老师，不客气！", "王老师，大家好！"], "answer": "王老师，您好！", "explanation": "Dùng kính ngữ 「您」 với giáo viên.", "relatedKnowledge": "Kính ngữ 您", "section": "grammar"}, {"id": "q30-1-03", "type": "true_false", "points": 1, "prompt": "Hậu tố 「们」 dùng sau đại từ hoặc danh từ chỉ người để tạo số nhiều (ví dụ: 同学们, 你们).", "answer": true, "explanation": "Đúng. 同学们 = các bạn học, 你们 = các bạn.", "relatedKnowledge": "Hậu tố 们", "section": "grammar"}, {"id": "q30-1-04", "type": "fill_blank", "points": 1, "prompt": "Điền 1 chữ Hán: 老师，___ 好！(Em chào cô ạ!)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["您"], "explanation": "「您」 là đại từ ngôi thứ hai trang trọng.", "relatedKnowledge": "Kính ngữ 您", "section": "writing"}, {"id": "q30-1-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu chào tạm biệt cả lớp của cô giáo:", "tokens": ["再见", "们", "同学"], "answer": ["同学", "们", "再见"], "acceptedSequences": [["同学", "们", "再见"]], "explanation": "同学们，再见！ (Tạm biệt các em!)", "relatedKnowledge": "Bài khóa 3", "section": "grammar"}, {"id": "q30-1-06", "type": "matching", "points": 1, "prompt": "Nối từ mới Bài 1 (HSK 3.0) với nghĩa tiếng Việt:", "pairs": [{"left": "大家", "right": "Mọi người"}, {"left": "谢谢", "right": "Cảm ơn"}, {"left": "不客气", "right": "Đừng khách sáo"}, {"left": "再见", "right": "Tạm biệt"}], "explanation": "Khớp bảng từ mới Bài 1 trang 2–3.", "relatedKnowledge": "Từ mới Bài 1", "section": "vocab"}, {"id": "q30-1-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「不客气」:", "options": ["bú kèqi", "bù kēqi", "bǔ kèqì", "bú gèqi"], "answer": "bú kèqi", "explanation": "不 trước thanh 4 biến điệu thành bú -> bú kèqi.", "relatedKnowledge": "Phát âm Bài 1", "section": "vocab"}, {"id": "q30-1-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「tóngxué」:", "options": ["同学", "老师", "大家", "谢谢"], "answer": "同学", "explanation": "同学 (tóngxué) = bạn học.", "relatedKnowledge": "Mặt chữ Bài 1", "section": "vocab"}, {"id": "q30-1-09", "type": "listening_choice", "points": 1, "prompt": "Nghe câu sau và chọn tình huống phù hợp:", "audioText": "同学们，再见！老师，再见！", "options": ["Bắt đầu buổi học", "Chào tạm biệt cuối buổi học", "Cảm ơn khi nhận quà", "Xin lỗi vì nhận nhầm người"], "answer": "Chào tạm biệt cuối buổi học", "explanation": "再见 dùng khi chào tạm biệt.", "relatedKnowledge": "Nghe hiểu Bài 1", "section": "listening"}, {"id": "q30-1-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Chào mọi người!\"", "sampleAnswer": "大家好！", "acceptedAnswers": ["大家好", "大家好！", "大家好!"], "requiredKeywords": ["大家", "好"], "explanation": "大家好！ (Dàjiā hǎo!)", "relatedKnowledge": "Chào hỏi tập thể", "section": "writing"}, {"id": "hsk1-01-bk-01", "section": "reading", "type": "single_choice", "points": 1, "prompt": "Theo Bài khóa 1: Chào hỏi trợ giảng AI Tiểu Ngữ, câu 「AI小语，你好！」 có nghĩa tiếng Việt là gì?", "options": ["Xin chào AI Tiểu Ngữ!", "Hôm nay trời rất lạnh.", "Tôi muốn đi siêu thị mua táo."], "answer": "Xin chào AI Tiểu Ngữ!", "explanation": "Trong Bài khóa 1: Chào hỏi trợ giảng AI Tiểu Ngữ: 「AI小语，你好！」 (AI Xiǎoyǔ, nǐ hǎo!) = Xin chào AI Tiểu Ngữ!.", "relatedKnowledge": "Bài khóa 1: Chào hỏi trợ giảng AI Tiểu Ngữ"}, {"id": "q30-1-12", "section": "vocab", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn phiên âm Pinyin đúng (chú ý biến điệu chữ 不) cho từ 「不客气」:", "options": ["bù kèqì", "bú kèqi", "bǔ kèqi", "bú kēqi"], "answer": "bú kèqi", "explanation": "「不」 đứng trước thanh 4 「客 (kè)」 biến điệu thành thanh 2 「bú」; 「气」 đọc thanh nhẹ → 「bú kèqi」.", "relatedKnowledge": "Từ mới Bài 1 – Biến điệu 不"}, {"id": "q30-1-13", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Từ nào sau đây dùng để gọi chung các bạn cùng lớp với mình?", "options": ["老师", "同学", "大家", "您"], "answer": "同学", "explanation": "「同学 (tóngxué)」 là bạn học cùng lớp; 「老师」 là giáo viên; 「大家」 là mọi người.", "relatedKnowledge": "Từ mới Bài 1"}, {"id": "q30-1-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Khi bước vào lớp học, cô giáo Vương chào cả lớp bằng câu nào tự nhiên nhất?", "options": ["同学们，再见！", "大家好！", "老师，您好！", "不客气！"], "answer": "大家好！", "explanation": "Theo Bài khóa 2, cô Vương Nhất Phi chào cả lớp: 「大家好！」 (Chào mọi người!).", "relatedKnowledge": "Bài khóa 2 – Chào hỏi lớp học"}, {"id": "q30-1-15", "section": "grammar", "type": "true_false", "points": 1, "prompt": "Có thể nói 「您们好！」 để chào nhiều thầy cô giáo cùng lúc.", "answer": false, "explanation": "Sai. Tron d": "q30-2-11", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 1", "prompt": "[Ôn Bài 1] Khi muốn hỏi lịch sự tên của một thầy/cô giáo mới gặp, câu mở đầu phù hợp nhất là:", "options": ["请问，您叫什么名字？", "不客气，你叫什么？", "再见，老师好！", "对不起，同学们好！"], "answer": "请问，您叫什么名字？", "explanation": "Kết hợp 「请问」 (Xin hỏi – Bài 2) với kính ngữ 「您」 (Bài 1) tạo thành câu hỏi lịch sự với giáo viên.", "relatedKnowledge": "Ôn Bài 1 (您) + Bài 2 (请问)"}, {"id": "q30-2-12", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Trong khẩu ngữ thân mật, ngoài 「没关系」, từ nào dưới đây cũng dùng để đáp lại 「对不起」?", "options": ["不客气", "没事", "很高兴", "请问"], "answer": "没事", "explanation": "「没事 (méishì)」 nghĩa là 'Không sao đâu' (khẩu ngữ), dùng tương đương 「没关系」 khi đáp lời xin lỗi; còn 「不客气」 dùng đáp lời cảm ơn.", "relatedKnowledge": "Từ mới Bài 2 – Phân biệt 没关系/没事 và 不客气"}, {"id": "q30-2-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Phó từ 「也 (cũng)」 phải đặt ở vị trí nào trong câu 「认识你我___很高兴」?", "options": ["Trước chủ ngữ 我", "Sau chủ ngữ 我, trước 很高兴", "Ở cuối câu sau 高兴", "Đầu câu trước 认识"], "answer": "Sau chủ ngữ 我, trước 很高兴", "explanation": "Phó từ 「也」 luôn đứng sau chủ ngữ và trước vị ngữ/động từ: 「认识你我也很高兴」.", "relatedKnowledge": "Trật tự từ cơ bản – Phó từ 也"}, {"id": "q30-2-14", "section": "grammar", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 1", "prompt": "[Ôn Bài 1] Khi có người nói 「对不起！」 (Xin lỗi!), ta nên đáp lại là 「不客气！」.", "answer": false, "explanation": "Sai! 「不客气！」 (Bài 1) dùng để đáp lại 「谢谢！」; còn khi đáp lại 「对不起！」 (Bài 2) phải dùng 「没关系！」 hoặc 「没事！」.", "relatedKnowledge": "Phân biệt phản xạ giao tiếp Bài 1 & Bài 2"}, {"id": "q30-2-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "陈天中：你好，安妮！\n白家月：你好，陈天中！我不是安妮，我是白家月。\n陈天中：对不起！\n白家月：没关系！", "passagePinyin": "Chén Tiānzhōng: Nǐ hǎo, Ānnī! Bái Jiāyuè: Nǐ hǎo, Chén Tiānzhōng! Wǒ bú shì Ānnī, wǒ shì Bái Jiāyuè. Chén Tiānzh rmula": "Năm (年) → Tháng (月) → Ngày (日/号) → Thứ (星期)", "usage": "Trật tự từ lớn đến nhỏ; câu vị ngữ danh từ không cần động từ 是 (今天5月1号 / 我妹妹12岁).", "explanation": "Ví dụ: 2024年10月22日，星期二.", "examples": [{"zh": "今天9月8号。", "pinyin": "Jīntiān jiǔ yuè bā hào.", "vi": "Hôm nay ngày 8 tháng 9."}, {"zh": "今天星期日。", "pinyin": "Jīntiān Xīngqīrì.", "vi": "Hôm nay là Chủ nhật."}], "commonMistake": "Nói ngược '8号9月' (SAI).", "comparison": "Chủ nhật nói 星期日 hoặc 星期天 (không nói 星期七)."}, {"id": "g30-05-2", "title": "2. Động từ năng nguyện 会 & Biến điệu 不 / 一", "formula": "Chủ ngữ + 会 / 不会 + Động từ", "usage": "Biểu thị biết hoặc có khả năng làm việc gì qua học tập. Sổ tay tr.22–23: 不 + thanh 4 → bú (不是, 不会); 一 + thanh 1/2/3 → yì (一些, 一年), 一 + thanh 4 → yí (一个, 一岁).", "explanation": "Ví dụ: 我会做面条儿。/ 我不会做菜。", "examples": [{"zh": "我会做饭。", "pinyin": "Wǒ huì zuò fàn.", "vi": "Em biết nấu ăn."}, {"zh": "我不会做菜。", "pinyin": "Wǒ bú huì zuò cài.", "vi": "Em không biết nấu món ăn."}], "commonMistake": "Quên biến điệu 「不会」 thành bú huì.", "comparison": "不 và 一 chỉ biến điệu khi ghép với âm tiết khác."}], "patterns": [{"zh": "今天几号？— 今天9月8号。", "pinyin": "Jīntiān jǐ hào? — Jīntiān jiǔ yuè bā hào.", "vi": "Hôm nay ngày mấy? — Hôm nay ngày 8 tháng 9."}, {"zh": "今天星期日，我休息。", "pinyin": "Jīntiān Xīngqīrì, wǒ xiūxi.", "vi": "Hôm nay Chủ nhật, mình được nghỉ."}, {"zh": "你会做饭吗？— 我会做面条儿和饺子。", "pinyin": "Nǐ huì zuò fàn ma? — Wǒ huì zuò miàntiáor hé jiǎozi.", "vi": "Bạn biết nấu ăn không? — Mình biết nấu mì và sủi cảo."}, {"zh": "这是你的新电脑吗？— 真好看！", "pinyin": "Zhè shì nǐ de xīn diànnǎo ma? — Zhēn hǎokàn!", "vi": "Đây là máy tính mới của bạn à? — Đẹp thật đấy!"}, {"zh": "我也很喜欢它。", "pinyin": "Wǒ yě hěn xǐhuan tā.", "vi": "Mình cũng rất thích nó."}], "exercises": [{"id": "q30-5-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "jīntiān", "answer": "今天", "meaning": "Hôm nay"}, {"pinyin": lanation": "Người nói hỏi 「你几号休息？」 -> muốn biết ngày nào nghỉ.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-5-04", "type": "single_choice", "points": 1, "prompt": "Theo quy tắc biến điệu của 「一」 (Sổ tay tr.23), 「一个」 đọc là:", "options": ["yī gè", "yí gè", "yì gè", "yǐ gè"], "answer": "yí gè", "explanation": "一 trước thanh 4 (gè) biến điệu thành thanh 2 (yí).", "relatedKnowledge": "Biến điệu của 一", "section": "grammar"}, {"id": "q30-5-05", "type": "true_false", "points": 1, "prompt": "Trong tiếng Trung, câu vị ngữ danh từ chỉ ngày tháng/tuổi tác như 「今天5月1号。」 không cần dùng động từ 「是」.", "answer": true, "explanation": "Đúng (Lớp học của Tiểu Ngữ tr.29).", "relatedKnowledge": "Câu vị ngữ danh từ", "section": "grammar"}, {"id": "q30-5-06", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Tôi biết làm sủi cảo):", "tokens": ["饺子", "做", "会", "我"], "answer": ["我", "会", "做", "饺子"], "acceptedSequences": [["我", "会", "做", "饺子"]], "explanation": "我会做饺子。", "relatedKnowledge": "Động từ năng nguyện 会", "section": "grammar"}, {"id": "q30-5-07", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.29] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "你会做饭吗？", "right": "我不会。"}, {"left": "今天几号？", "right": "5月6号。"}, {"left": "你去超市买什么？", "right": "面条儿。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 5.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-5-08", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「饺子」:", "options": ["jiǎozi", "jiāozi", "qiǎozi", "jiàozǐ"], "answer": "jiǎozi", "explanation": "饺 thanh 3 (jiǎo) + 子 thanh nhẹ (zi).", "relatedKnowledge": "Phát âm Bài 5", "section": "vocab"}, {"id": "q30-5-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết Dương Đồng Lạc biết nấu món gì:", "audioText": "我会做面条儿、饺子，也会做一些菜。", "options": ["Chỉ biết nấu mì", "Biết nấu mì, sủi cảo và một số món ăn", "Không biết nấu ăn"], "answer": "Biết nấu mì, sủi cảo và một số món ăn", "explanation": "Khớp Bài khóa 2 trang 30.", "relatedKnowledge": "Nghe hiểu Bài 5", "section": "listening"}, {"id": "q30-5-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Hôm nay tôi được nghỉ.\"", "sampleAnswer": "今天我休息。", "acceptedAnswers": ["今天我休息", "今天我休息。", "我今天休息", "我今天休息。"], "requiredKeywords": ["今天", "我", "休息"], "explanation": "今天我休息。", "relatedKnowledge": "Tiêu đề Bài 5", "section": "writing"}, {"id": "q30-5-11", "section": "vocab", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho phiên âm 「diànnǎo」 (Máy tính):", "options": ["电脑", "手机", "面条儿", "饺子"], "answer": "电脑", "explanation": "「电脑 (diànnǎo)」 = máy tính; 「面条儿」 = mì sợi; 「饺子」 = sủi cảo.", "relatedKnowledge": "Từ mới Bài 5"}, {"id": "q30-5-12", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Để nói 'Chủ nhật' trong tiếng Trung, hai cách nói đúng là:", "options": ["星期七 và 星期日", "星期日 và 星期天", "星期一 và 星期天", "七星期 và 星期日"], "answer": "星期日 và 星期天", "explanation": "Chủ nhật KHÔNG nói 「星期七」 mà dùng 「星期日」 (trang trọng/văn viết) hoặc 「星期天」 (khẩu ngữ).", "relatedKnowledge": "Cách nói thứ trong tuần"}, {"id": "q30-5-13", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 3–4", "prompt": "[Ôn Bài 3–5] Phân biệt đúng 3 đại từ cùng phát âm là 「tā」:", "options": ["他 (nam) – 她 (nữ) – 它 (đồ vật/động vật)", "她 (nam) – 他 (đồ vật) – 它 (nữ)", "它 (người lớn) – 他 (trẻ em) – 她 (đồ vật)", "他 (số nhiều) – 她 (số ít) – 它 (chỉ thời gian)"], "answer": "他 (nam) – 她 (nữ) – 它 (đồ vật/động vật)", "explanation": "「她」 (Bài 3) chỉ nữ, 「他」 (Bài 4) chỉ nam/chung, 「它」 (Bài 5) chỉ đồ vật hoặc động vật (như 「我很喜欢它」 chỉ chiếc máy tính mới).", "relatedKnowledge": "Tổng hợp bộ đại từ 他/她/它 (Bài 3–5)"}, {"id": "q30-5-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Trong tiếng Trung, ngày 8 tháng 9 được viết và đọc theo trật tự nào?", "options": ["8号9月", "9月8号", "9日8月", "8月9号"], "answer": "9月8号", "explanation": "Thời gian tiếng Trung đi từ đơn vị LỚN đến NHỎ: Năm → Tháng (月) → Ngày (号/日) → Thứ (星期). Nên ngày 8/9 là 「9月8号」.", "relatedKnowledge": "Diễn đạt thời gian (1)"}, {"id": "q30-5-15", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 4", "prompt": "[Ôn Bài 4 + 5] Điền đúng lượng từ/từ chỉ số lượng: 我会做___菜，也会做___个饺子。(Tôi biết nấu một vài món ăn, cũng biết làm hai cái sủi cảo.)", "options": ["一些 / 两", "两 / 一些", "一些 / 二", "口 / 两"], "answer": "一些 / 两", "explanation": "「一些」 (Bài 5) = một vài/một số; trước lượng từ 「个」 dùng 「两」 (Bài 4), không dùng 「二」.", "relatedKnowledge": "Ôn Bài 4 (两+个) + Bài 5 (一些)"}, {"id": "q30-5-16", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "王一雪：同乐，下班吗？这是你的新电脑吗？\n杨同乐：下班。是的，是我的新电脑。\n王一雪：真好看！\n杨同乐：我也很喜欢它。", "passagePinyin": "Wáng Yīxuě: Tónglè, xiàbān ma? Zhè shì nǐ de xīn diànnǎo ma? Yáng Tónglè: Xiàbān. Shì de, shì wǒ de xīn diànnǎo. Wáng Yīxuě: Zhēn hǎokàn! Yáng Tónglè: Wǒ yě hěn xǐhuan tā.", "prompt": "Chữ 「它」 trong câu 「我也很喜欢它」 chỉ vật gì?", "options": ["Món sủi cảo", "Chiếc máy tính mới của Dương Đồng Lạc", "Ngày Chủ nhật", "Bữa cơm tối"], "answer": "Chiếc máy tính mới của Dương Đồng Lạc", "explanation": "Trước đó hai người đang nói về 「我的新电脑」 (chiếc máy tính mới của tôi), nên 「它」 thay thế cho chiếc máy tính đó.", "relatedKnowledge": "Bài khóa 3 – Đại từ 它"}, {"id": "q30-5-17", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 3", "prompt": "[Ôn Bài 3 + 5] Trong câu vị ngữ danh từ nói ngày tháng như 「今天9月8号，星期日。」, có thể bỏ động từ 「是」 mà vẫn đúng ngữ pháp.", "answer": true, "explanation": "Đúng! Câu nói ngày tháng, thứ, tuổi tác (Bài 4–5) thường là câu vị ngữ danh từ, không bắt buộc dùng 「是」 (trừ khi phủ định phải dùng 「不是」).", "relatedKnowledge": "Câu vị ngữ danh từ (Bài 4–5)"}, {"id": "q30-5-18", "section": "writing", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu nói về việc làm ngày Chủ nhật:", "tokens": ["做饭", "也", "星期天", "我"], "answer": ["星期天", "我", "也", "做饭"], "acceptedSequences": [["星期天", "我", "也", "做饭"], ["我", "星期天", "也", "做饭"]], "explanation": "「星期天我也做饭。」 (Chủ nhật tôi cũng nấu cơm.) — từ chỉ thời gian có thể đứng đầu câu hoặc ngay sau chủ ngữ.", "relatedKnowledge": "Trật tự trạng ngữ thời gian"}, {"id": "q30-5-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "今天9月8号，星期日。今天我休息，我会做面条儿和饺子。", "prompt": "Nghe đoạn âm thanh và chọn thông tin ĐÚNG:", "options": ["Hôm nay người nói đi làm rất bận", "Hôm nay là Chủ nhật ngày 8/9, người nói được nghỉ và biết nấu mì, sủi cảo", "Hôm nay là thứ Bảy ngày 9/8", "Người nói không biết nấu ăn"], "answer": "Hôm nay là Chủ nhật ngày 8/9, người nói được nghỉ và biết nấu mì, sủi cảo", "explanation": "Lời nghe: 「今天9月8号，星期日。今天我休息，我会做面条儿和饺子。」.", "relatedKnowledge": "Nghe hiểu Bài 5"}, {"id": "q30-5-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 4", "audioText": "A：你妈妈会做中国菜吗？ B：会，我妈妈很喜欢做饭，她会做饺子，也会做很多菜。", "prompt": "[Ôn Bài 4 + 5] Nghe hội thoại và chọn ý đúng:", "options": ["Mẹ của B không biết nấu món Trung Quốc", "Mẹ của B rất thích nấu ăn, biết làm sủi cảo và nhiều món ăn", "Mẹ của B chỉ biết nấu mì sợi", "B có hai anh trai biết nấu ăn"], "answer": "Mẹ của B rất thích nấu ăn, biết làm sủi cảo và nhiều món ăn", "explanation": "Kết hợp từ vựng 「妈妈」 (Bài 4) với 「会 / 喜欢 / 做饭 / 饺子 / 菜」 (Bài 5).", "relatedKnowledge": "Nghe tổng hợp Bài 4–5"}, {"id": "q30-5-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Hôm nay mùng mấy, thứ mấy?", "sampleAnswer": "今天几号？星期几？", "pinyin": "Jīntiān jǐ hào? Xīngqī jǐ?", "acceptedAnswers": ["今天几号星期几", "今天几号，星期几"], "requiredKeywords": ["今天", "几号", "星期几"]}, {"vi": "Hôm nay là Chủ nhật, hôm nay tôi được nghỉ.", "sampleAnswer": "今天星期日，今天我休息。", "pinyin": "Jīntiān Xīngqīrì, jīntiān wǒ xiūxi.", "acceptedAnswers": ["今天星期日今天我休息", "今天星期天今天我休息", .", "relatedKnowledge": "Phân biệt đa nghĩa động từ 想 (Bài 3 & 6)"}, {"id": "q30-6-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Để hỏi phương thức di chuyển ('Chúng ta đi nhà hàng Tây An bằng cách nào?'), ta chọn đại từ nghi vấn nào?", "options": ["我们哪儿去西安饭店？", "我们怎么去西安饭店？", "我们多少去西安饭店？", "我们谁去西安饭店？"], "answer": "我们怎么去西安饭店？", "explanation": "「怎么 + Động từ」 dùng để hỏi cách thức/phương tiện: 「怎么去？」 → 「坐出租车去。」 (Đi bằng taxi).", "relatedKnowledge": "Đại từ nghi vấn 怎么"}, {"id": "q30-6-14", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 5", "prompt": "[Ôn Bài 5 + 6] Câu liên động nào sau đây diễn đạt đúng 'Chủ nhật tôi muốn đi siêu thị mua sữa'?", "options": ["星期天我想买牛奶去超市。", "星期天我想去超市买牛奶。", "我想去星期天超市买牛奶。", "星期天我会超市去买牛奶。"], "answer": "星期天我想去超市买牛奶。", "explanation": "Câu liên động đặt hành động xảy ra trước (「去超市」) lên trước mục đích (「买牛奶」); thời gian 「星期天」 (Bài 5) đứng đầu câu.", "relatedKnowledge": "Ôn Bài 5 (星期天) + Bài 6 (Câu liên động)"}, {"id": "q30-6-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "王一雪：星期天我们去哪儿吃晚饭？\n刘明：我还想去西安饭店。\n刘小雪：那边的包子非常好吃，我想吃包子。\n刘小明：妈妈，我想吃米饭，不想吃包子。", "passagePinyin": "Wáng Yīxuě: Xīngqītiān wǒmen qù nǎr chī wǎnfàn? Liú Míng: Wǒ hái xiǎng qù Xī'ān Fàndiàn. Liú Xiǎoxuě: Nàbiān de bāozi fēicháng hǎochī, wǒ xiǎng chī bāozi. Liú Xiǎomíng: Māma, wǒ xiǎng chī mǐfàn, bù xiǎng chī bāozi.", "prompt": "Hai bạn nhỏ Lưu Tiểu Tuyết và Lưu Tiểu Minh muốn ăn món gì?", "options": ["Cả hai đều muốn ăn bánh bao", "Tiểu Tuyết muốn ăn bánh bao, Tiểu Minh muốn ăn cơm", "Tiểu Tuyết muốn ăn cơm, Tiểu Minh muốn ăn bánh bao", "Cả hai đều muốn ăn mì sợi"], "answer": "Tiểu Tuyết muốn ăn bánh bao, Tiểu Minh muốn ăn cơm", "explanation": "Tiểu Tuyết nói 「我想吃包子」, còn Tiểu Minh nói 「我想吃米饭，不想吃包子」.", "relatedKnowledge": "Bài khóa 3 – Ăn tối cuối tuần"}, {"id": "q30-6-16", "section": "reading", "type": "true_false", "points": 1, "prompt": "Trong tiếng Trung, câu 「我想去超市买些牛奶。」 có thể lược âu thế? Em tan làm lúc 6 rưỡi tối."}, {"speaker": "Lưu Minh", "side": "right", "zh": "我在家里呢。我八点去医院上班。", "pinyin": "Wǒ zài jiā li ne. Wǒ bā diǎn qù yīyuàn shàngbān.", "vi": "Anh đang ở nhà. 8 giờ anh đến bệnh viện làm việc."}, {"speaker": "Vương Nhất Tuyết", "side": "left", "zh": "好的，你去店里买些菜吧。", "pinyin": "Hǎo de, nǐ qù diàn li mǎi xiē cài ba.", "vi": "Vâng, anh ra cửa hàng mua ít thức ăn nhé."}, {"speaker": "Lưu Minh", "side": "right", "zh": "好，我十分钟后去。", "pinyin": "Hǎo, wǒ shí fēnzhōng hòu qù.", "vi": "Ừ, 10 phút nữa anh đi."}]}], "grammar": [{"id": "g30-07-1", "title": "1. Cách diễn đạt thời gian (2): 点 / 分 / 半", "formula": "Buổi (上午/中午/下午/晚上) + Giờ + 点 + Phút + 分 / 半", "usage": "Khi số phút là 十分 (10 phút) không lược 分; dưới 10 phút đọc thêm 零 (22:05 = 二十二点零五).", "explanation": "Ví dụ: 晚上九点十分 / 下午两点半.", "examples": [{"zh": "二十一点十分 (21:10)", "pinyin": "èrshíyī diǎn shí fēn", "vi": "21 giờ 10 phút"}, {"zh": "二十二点零五 (22:05)", "pinyin": "èrshí'èr diǎn líng wǔ", "vi": "22 giờ 05 phút"}], "commonMistake": "Bỏ 零 khi số phút dưới 10 hoặc nói 二点 thay vì 两点.", "comparison": "分 (mốc giờ trên đồng hồ) ↔ 分钟 (khoảng thời gian: 十分钟后)."}, {"id": "g30-07-2", "title": "2. Trợ từ 吧 (1) & 呢 (2) & Vị trí trạng ngữ", "formula": "Đề nghị: ……吧。 | Xác nhận sự thực: ……呢。 | Phó từ & Thời gian luôn đứng TRƯỚC động từ/tính từ", "usage": "吧 đọc thanh nhẹ biểu thị đề nghị; 呢 cuối câu trần thuật xác nhận sự thực (我明天下午两点还上课呢).", "explanation": "Ví dụ: 我们下午三点见吧。/ 李文晚上还有事呢。", "examples": [{"zh": "我们下午两点见吧。", "pinyin": "Wǒmen xiàwǔ liǎng diǎn jiàn ba.", "vi": "Chiều 2 giờ chúng mình gặp nhau nhé."}, {"zh": "妹妹会做两个菜呢。", "pinyin": "Mèimei huì zuò liǎng gè cài ne.", "vi": "Em gái biết nấu hai món đấy nhé."}], "commonMistake": "Đặt thời gian ở cuối câu (SAI).", "comparison": "呢 (1) hỏi tỉnh lược ↔ 呢 (2) xác nhận sự thực."}], "patterns": [{"zh": "现在几点？— 早上八点四十。", "pinyin": "Xiànzài jǐ diǎn? — Zǎoshang bā diǎn sìshí.", "vi": "Bây giờ mấy giờ? — 8 giờ 40 sáng."}, {"zh": "我们下午两点见吧。", "pinyin": "Wǒmen xiàwǔ liǎng diǎn jiàn ba.", "vi": "Chiều 2 giờ gặp nhau nhé."}, {"zh": "我明天下午两点还上课呢，四点半下课。", "pinyin": "Wǒ míngtiān xiàwǔ liǎng diǎn hái shàngkè ne, sì diǎn bàn xiàkè.", "vi": "2 giờ chiều mai mình vẫn lên lớp, 4 rưỡi tan học."}, {"zh": "我晚上六点半下班。", "pinyin": "Wǒ wǎnshang liù diǎn bàn xiàbān.", "vi": "Em tan làm lúc 6 rưỡi tối."}, {"zh": "好，我十分钟后去。", "pinyin": "Hǎo, wǒ shí fēnzhōng hòu qù.", "vi": "Ừ, 10 phút nữa anh đi."}], "exercises": [{"id": "q30-7-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "xiànzài", "answer": "现在", "meaning": "Bây giờ, hiện tại"}, {"pinyin": "diǎn", "answer": "点", "meaning": "Giờ"}, {"pinyin": "zǎoshang", "answer": "早上", "meaning": "Buổi sáng, sáng sớm"}, {"pinyin": "shàngwǔ", "answer": "上午", "meaning": "Buổi sáng"}, {"pinyin": "fēn", "answer": "分", "meaning": "Phút"}, {"pinyin": "kè", "answer": "课", "meaning": "Tiết học, giờ học"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 7.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 7"}, {"id": "q30-7-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Nhé (đề nghị, thương lượng)"}, {"key": "B", "label": "Xem, nhìn, đọc"}, {"key": "C", "label": "Buổi chiều"}, {"key": "D", "label": "Phim, điện ảnh"}, {"key": "E", "label": "Gặp, gặp mặt"}, {"key": "F", "label": "Rạp chiếu phim"}], "items": [{"hanzi": "下午", "pinyin": "xiàwǔ", "answerKey": "C"}, {"hanzi": "见", "pinyin": "jiàn", "answerKey": "E"}, {"hanzi": "吧", "pinyin": "ba", "answerKey": "A"}, {"hanzi": "电影院", "pinyin": "diànyǐngyuàn", "answerKey": "F"}, {"hanzi": "看", "pinyin": "kàn", "answerKey": "B"}, {"hanzi": "电影", "pinyin": "diànyǐng", "answerKey": "D"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 7.", "relatedKnowledge": "Từ mới Bài 7"}, {"id": "q30-7-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.52] 她星期天没有 ___ 。(医院 / 十二点半 / 课 / 现在 / 见)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["课"], "explanation": "没有课 = không có tiết học.", "relatedKnowledge": "Từ mới Bài 7", "section": "writing"}, {"id": "q30-7-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.52] 王一雪：你今天晚上几点去 ___ 上班？ 刘明：晚上八点。", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["医院"], "explanation": "Lưu Minh là bác sĩ làm việc ở 「医院」.", "relatedKnowledge": "Bài khóa 3", "section": "writing"}, {"id": "q30-7-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.47] 我今天早上八点半上课，十点十分下课。★ 说话人今天几点下课？", "options": ["8:30", "10:10", "10:20"], "answer": "10:10", "explanation": "「十点十分下课」 = 10 giờ 10 phút tan học.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-7-04", "type": "true_false", "points": 1, "prompt": "Trong câu 「我明天下午两点还上课呢。」, trợ từ 「呢」 đứng cuối câu biểu thị một sự thực được xác nhận.", "answer": true, "explanation": "Đúng (Lớp học của Tiểu Ngữ tr.50).", "relatedKnowledge": "Trợ từ 呢 (2)", "section": "grammar"}, {"id": "q30-7-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Em tan làm lúc 6 rưỡi tối):", "tokens": ["下班", "六点半", "晚上", "我"], "answer": ["我", "晚上", "六点半", "下班"], "acceptedSequences": [["我", "晚上", "六点半", "下班"]], "explanation": "我晚上六点半下班。", "relatedKnowledge": "Vị trí từ chỉ thời gian", "section": "grammar"}, {"id": "q30-7-06", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.46] Nối câu hỏi với câu trả lời tương ứng:", "pairs": [{"left": "我们在哪儿见？", "right": "电影院。"}, {"left": "现在几点？", "right": "早上七点半。"}, {"left": "我们下午去超市吧。", "right": "对不起，我有课。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 7.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-7-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「电影院」:", "options": ["diànyǐngyuàn", "diányǐngyuàn", "diànyīngyuàn", "tiànyǐngyuàn"], "answer": "diànyǐngyuàn", "explanation": "电 (diàn) + 影 (yǐng) + 院 (yuàn).", "relatedKnowledge": "Phát âm Bài 7", "section": "vocab"}, {"id": "q30-7-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「fēnzhōng」:", "options": ["分钟", "现在", "上午", "上班"], "answer": "分钟", "explanation": "分钟 (fēnzhōng) = phút (khoảng thời gian).", "relatedKnowledge": "Mặt chữ Bài 7", "section": "vocab"}, {"id": "q30-7-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết Lưu Minh sẽ ra cửa hàng mua thức ăn sau bao lâu:", "audioText": "好的，我十分钟后去店里买些菜。", "options": ["5 phút nữa", "10 phút nữa", "30 phút nữa"], "answer": "10 phút nữa", "explanation": "「十分钟后」 = 10 phút sau.", "relatedKnowledge": "Nghe hiểu Bài 7", "section": "listening"}, {"id": "q30-7-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Chúng ta gặp nhau lúc 2 giờ chiều nhé.\"", "sampleAnswer": "我们下午两点见吧。", "acceptedAnswers": ["我们下午两点见吧", "我们下午两点见吧。"], "requiredKeywords": ["我们", "下午", "两点", "见"], "explanation": "我们下午两点见吧。", "relatedKnowledge": "Trợ từ 吧", "section": "writing"}, {"id": "q30-7-11", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Để nói '10 phút sau tôi đi', ta chọn danh từ chỉ khoảng thời gian nào?", "options": ["十分后我去", "十分钟后我去", "十点后我去", "十半后我去"], "answer": "十分钟后我去", "explanation": "「分」 dùng để nói giờ đồng hồ (như 十点十分 = 10:10); còn 「分钟」 dùng để đếm khoảng thời gian (十分钟 = 10 phút).", "relatedKnowledge": "Phân biệt 分 và 分钟"}, {"id": "q30-7-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 5", "prompt": "[Ôn Bài 5 + 7] Cặp từ trái nghĩa nào sau đây ghép ĐÚNG theo kiến thức Bài 5 và Bài 7?", "options": ["上班 (đi làm) ↔ 下班 (tan làm); 上课 (lên lớp) ↔ 下课 (tan học)", "上班 (lên lớp) ↔ 下课 (tan làm); 早上 (tối) ↔ 晚上 (sáng)", "休息 (đi làm) ↔ 上班 (nghỉ); 电影 (phim) ↔ 医院 (rạp phim)", "上午 (tối) ↔ 下午 (sáng); 在 (đi) ↔ 见 (ở)"], "answer": "上班 (đi làm) ↔ 下班 (tan làm); 上课 (lên lớp) ↔ 下课 (tan học)", "explanation": "「下班」 học ở Bài 5; Bài 7 mở rộng đối xứng 「上班 ↔ 下班」 và 「上课 ↔ 下课」.", "relatedKnowledge": "Hệ thống từ trái nghĩa 上/下 (Bài 5 & 7)"}, {"id": "q30-7-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Cách nói giờ '2 giờ 30 phút chiều' chuẩn nhất trong tiếng Trung là:", "options": ["下午二点半", "下午两点半", "两点半下午", "下午两点三十分钟"], "answer": "下午两点半", "explanation": "Buổi (下午) đặt trước giờ; 2 giờ phải dùng 「两点」 (không dùng 二点); 30 phút dùng 「半」 → 「下午两点半」.", "relatedKnowledge": "Cách nói giờ 点 / 半 & 两 (Bài 4 & 7)"}, {"id": "q30-7-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Trợ từ ngữ khí 「吧」 ở cuối câu 「我们下午两点见吧。」 biểu thị sắc thái gì?", "options": ["Câu hỏi Có/Không", "Lời đề nghị, thương lượng nhẹ nhàng ('...nhé')", "Sự ngạc nhiên cực độ", "Sự phủ định hoàn toàn"], "answer": "Lời đề nghị, thương lượng nhẹ nhàng ('...nhé')", "explanation": "「吧」 đặt cuối câu cầu khiến/trần thuật mang nghĩa đề nghị, gợi ý thân thiện ('chúng ta gặp nhau lúc 2 giờ chiều nhé').", "relatedKnowledge": "Trợ từ ngữ khí 吧"}, {"id": "q30-7-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "王一雪：喂，你在哪儿呢？我晚上六点半下班。\n刘明：我在家里呢。我八点去医院上班。\n王一雪：好的，你去店里买些菜吧。\n刘明：好，我十分钟后去。", "passagePinyin": "Wáng Yīxuě: Wèi, nǐ zài nǎr ne? Wǒ wǎnshang liù diǎn bàn xiàbān. Liú Míng: Wǒ zài jiālǐ ne. Wǒ bā diǎn qù yīyuàn shàngbān. Wáng Yīxuě: Hǎo de, nǐ qù diànlǐ mǎi xiē cài ba. Liú Míng: Hǎo, wǒ shí fēnzhōng hòu qù.", "prompt": "Lưu Minh hiện đang ở đâu và mấy giờ anh ấy đi làm ở bệnh viện?", "options": ["Đang ở bệnh viện, 6 giờ 30 tan làm", "Đang ở nhà, 8 giờ tối đi làm ở bệnh viện", "Đang ở cửa hàng mua rau, 8 giờ về nhà", "Đang ở rạp chiếu phim, 10 phút nữa đi làm"], "answer": "Đang ở nhà, 8 giờ tối đi làm ở bệnh viện", "explanation": "Lưu Minh nói 「我在家里呢。我八点去医院上班。」 (Anh đang ở nhà. 8 giờ anh đến bệnh viện làm ca tối).", "relatedKnowledge": "Bài khóa 3 – Lịch làm việc"}, {"id": "q30-7-16", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 6", "prompt": "[Ôn Bài 6 + 7] Trong câu 「下午我想去电影院看电影。」, vừa có động từ năng nguyện 「想」 (Bài 6) vừa có cấu trúc câu liên động 「去 + địa điểm + làm gì」.", "answer": true, "explanation": "Đúng! 「想去电影院看电影」 (muốn đi rạp chiếu phim xem phim) là mẫu câu liên động mở rộng từ Bài 6.", "relatedKnowledge": "Ôn Bài 6 (想 + Câu liên động) trong Bài 7"}, {"id": "q30-7-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 1 chữ Hán: 我上午十点十___有课。(Tôi có tiết học lúc 10 giờ 10 phút sáng.)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["分"], "explanation": "Nói thời điểm (giờ : phút) dùng 「点 + 分」: 「十点十分」.", "relatedKnowledge": "Diễn đạt thời gian (2)"}, {"id": "q30-7-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 6", "prompt": "[Ôn Bài 6 + 7] Sắp xếp thành câu kể thời gian đi làm:", "tokens": ["去", "八点", "医院", "晚上", "我", "上班"], "answer": ["我", "晚上", "八点", "去", "医院", "上班"], "acceptedSequences": [["我", "晚上", "八点", "去", "医院", "上班"], ["晚上", "八点", "我", "去", "医院", "上班"]], "explanation": "Thời gian (「晚上八点」) đặt trước cụm động từ liên động (「去医院上班」).", "relatedKnowledge": "Trật tự thời gian + Câu liên động"}, {"id": "q30-7-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "我明天下午两点上课，四点半下课，晚上六点半吃晚饭。", "prompt": "Nghe lịch trình ngày mai và cho biết mấy giờ người nói tan học?", "options": ["2 giờ chiều", "4 giờ 30 chiều", "6 giờ 30 tối", "8 giờ sáng"], "answer": "4 giờ 30 chiều", "explanation": "Lời nghe: 「四点半下课」 (4 giờ rưỡi tan học).", "relatedKnowledge": "Nghe hiểu Bài 7"}, {"id": "q30-7-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 6", "audioText": "A：你现在在哪儿呢？ B：我在超市呢，我想买些牛奶和菜。十分钟后我们见吧！", "prompt": "[Ôn Bài 6 + 7] Nghe hội thoại và chọn thông tin đúng:", "options": ["B đang ở nhà xem phim", "B đang ở siêu thị mua sữa và rau, 10 phút nữa sẽ gặp A", "B đã tan học lúc 10 giờ", "B đi taxi đến bệnh viện"], "answer ", "side": "right", "zh": "这只小猫真漂亮！", "pinyin": "Zhè zhī xiǎo māo zhēn piàoliang!", "vi": "Con mèo nhỏ này xinh thật!"}]}, {"id": "d30-08-2", "title": "Bài khóa 2: Hẹn gặp trước hiệu sách", "context": "Bạch Gia Nguyệt gọi điện hẹn gặp Lý Văn.", "audioFile": "", "lines": [{"speaker": "Bạch Gia Nguyệt", "side": "left", "zh": "我们在哪儿见呢？下午两点你能到吗？", "pinyin": "Wǒmen zài nǎr jiàn ne? Xiàwǔ liǎng diǎn nǐ néng dào ma?", "vi": "Chúng mình gặp ở đâu nhỉ? 2 giờ chiều bạn đến được không?"}, {"speaker": "Lý Văn", "side": "right", "zh": "在学校书店前见吧。我能到。我在学校吃午饭。", "pinyin": "Zài xuéxiào shūdiàn qián jiàn ba. Wǒ néng dào. Wǒ zài xuéxiào chī wǔfàn.", "vi": "Trước hiệu sách trường nhé. Mình đến được. Mình ăn trưa ở trường."}]}, {"id": "d30-08-3", "title": "Bài khóa 3: Hai bác sĩ trong nhà", "context": "Lưu Minh trò chuyện với đồng nghiệp bác sĩ Hồ ở bệnh viện.", "audioFile": "", "lines": [{"speaker": "Lưu Minh", "side": "left", "zh": "小胡，还没吃饭呢？大医院病人多，医生非常忙。", "pinyin": "Xiǎo Hú, hái méi chī fàn ne? Dà yīyuàn bìngrén duō, yīshēng fēicháng máng.", "vi": "Tiểu Hồ, chưa ăn cơm à? Bệnh viện lớn bệnh nhân đông, bác sĩ cực kỳ bận."}, {"speaker": "Bác sĩ Hồ", "side": "right", "zh": "是的。我爸爸也在医院工作，他也非常忙。", "pinyin": "Shì de. Wǒ bàba yě zài yīyuàn gōngzuò, tā yě fēicháng máng.", "vi": "Vâng. Bố em cũng làm việc ở bệnh viện, bố cũng rất bận."}, {"speaker": "Lưu Minh", "side": "left", "zh": "你家有两个医生？", "pinyin": "Nǐ jiā yǒu liǎng gè yīshēng?", "vi": "Nhà em có hai bác sĩ cơ à?"}, {"speaker": "Bác sĩ Hồ", "side": "right", "zh": "对。", "pinyin": "Duì.", "vi": "Vâng."}]}], "grammar": [{"id": "g30-08-1", "title": "1. Phương vị từ & Giới từ 在 + Vị trí + Động từ", "formula": "Danh từ + 上/下/里/外/前/后 | Chủ ngữ + 在 + Nơi chốn + Động từ", "usage": "Cụm giới từ 在 + nơi chốn luôn đặt TRƯỚC động từ.", "explanation": "Ví dụ: 我在学校吃午饭。/ 他爸爸在医院工作。", "examples": [{"zh": "我在学校吃午饭。", "pinyin": "Wǒ zài xuéxiào chī wǔfàn.", "vi": "Mình ăn trưa ở trường."}, {"zh": "小雪的手机在桌子上呢。", "pinyin": "Xiǎoxuě de shǒujī zài zhuōzi shang ne.", "vi": "Điện thoại của Tiểu Tuyết ở trên bàn kia."}], "commonMistake": "Dịch xuôi '我吃午饭在学校' (SAI).", "comparison": "Lượng từ kết hợp trực tiếp với 这: 这只小猫."}, {"id": "g30-08-2", "title": "2. Động từ năng nguyện 能 (néng)", "formula": "Chủ ngữ + 能 / 不能 + Động từ", "usage": "Biểu thị năng lực, điều kiện hoặc khả năng thực hiện việc gì.", "explanation": "Ví dụ: 下午两点你能到吗？/ 我不能去学校吃午饭。", "examples": [{"zh": "下午两点你能到吗？— 我能到。", "pinyin": "Xiàwǔ liǎng diǎn nǐ néng dào ma? — Wǒ néng dào.", "vi": "2 giờ chiều bạn đến được không? — Mình đến được."}], "commonMistake": "Dùng nhầm 会 thay 能 khi hỏi có đến kịp hay không.", "comparison": "会 (kỹ năng) ↔ 能 (điều kiện, khả năng)."}], "patterns": [{"zh": "房间外有一只小猫，它在桌子下呢。", "pinyin": "Fángjiān wài yǒu yì zhī xiǎo māo, tā zài zhuōzi xià ne.", "vi": "Ngoài phòng có một con mèo nhỏ, nó ở dưới bàn kia."}, {"zh": "我们在学校书店前见吧。", "pinyin": "Wǒmen zài xuéxiào shūdiàn qián jiàn ba.", "vi": "Chúng mình gặp ở trước hiệu sách trường nhé."}, {"zh": "下午两点你能到吗？— 我能到。", "pinyin": "Xiàwǔ liǎng diǎn nǐ néng dào ma? — Wǒ néng dào.", "vi": "2 giờ chiều bạn đến được không? — Mình đến được."}, {"zh": "我在学校吃午饭。", "pinyin": "Wǒ zài xuéxiào chī wǔfàn.", "vi": "Mình ăn trưa ở trường."}, {"zh": "我爸爸也在医院工作。", "pinyin": "Wǒ bàba yě zài yīyuàn gōngzuò.", "vi": "Bố em cũng làm việc ở bệnh viện."}], "exercises": [{"id": "q30-8-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "fángjiān", "answer": "房间", "meaning": "Căn phòng"}, {"pinyin": "wài", "answer": "外", "meaning": "Ngoài, bên ngoài"}, {"pinyin": "zhī", "answer": "只", "meaning": "Con (mèo, chó, chim...)"}, {"pinyin": "xiǎo", "answer": "小", "meaning": "Nhỏ, bé"}, {"pinyin": "māo", "answer": "猫", "meaning": "Mèo"}, {"pinyin": "méi", "answer": "没", "meaning": "Không, chưa"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 8.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 8"}, {"id": "q30-8-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Trường học"}, {"key": "B", "label": "Bàn, cái bàn"}, {"key": "C", "label": "Hiệu sách, nhà sách"}, {"key": "D", "label": "Nhìn thấy, trông thấy"}, {"key": "E", "label": "Dưới, bên dưới"}, {"key": "F", "label": "Đẹp, xinh đẹp"}], "items": [{"hanzi": "看见", "pinyin": "kànjiàn", "answerKey": "D"}, {"hanzi": "桌子", "pinyin": "zhuōzi", "answerKey": "B"}, {"hanzi": "下", "pinyin": "xià", "answerKey": "E"}, {"hanzi": "漂亮", "pinyin": "piàoliang", "answerKey": "F"}, {"hanzi": "学校", "pinyin": "xuéxiào", "answerKey": "A"}, {"hanzi": "书店", "pinyin": "shūdiàn", "answerKey": "C"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 8.", "relatedKnowledge": "Từ mới Bài 8"}, {"id": "q30-8-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.59] 胡医生的爸爸 ___ 医院工作。(哪儿 / 在 / 桌子 / 书店 / 能)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["在"], "explanation": "Giới từ 「在」 + Địa điểm + Động từ.", "relatedKnowledge": "Giới từ 在", "section": "writing"}, {"id": "q30-8-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.60] 我下午两点 ___ 到学校。(哪儿 / 在 / 桌子 / 书店 / 能)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["能"], "explanation": "Động từ năng nguyện 「能」 biểu thị khả năng đến kịp.", "relatedKnowledge": "Động từ năng nguyện 能", "section": "writing"}, {"id": "q30-8-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.56] 昨天爸爸在医院工作，哥哥在家里休息，没去书店。★ 说话人的哥哥昨天：", "options": ["在家里", "在书店", "在医院工作"], "answer": "在家里", "explanation": "Câu nêu rõ 「哥哥在家里休息」.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-8-04", "type": "true_false", "points": 1, "prompt": "Trong tiếng Trung, gọi 「小 + Họ」 (ví dụ 小胡) là cách xưng hô thân mật với người ít tuổi hơn mình.", "answer": true, "explanation": "Đúng (mục Tiểu Ngữ giúp sức tr.59).", "relatedKnowledge": "Văn hóa xưng hô", "section": "grammar"}, {"id": "q30-8-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Bố em cũng làm việc ở bệnh viện):", "tokens": ["工作", "在医院", "也", "我爸爸"], "answer": ["我爸爸", "也", "在医院", "工作"], "acceptedSequences": [["我爸爸", "也", "在医院", "工作"]], "explanation": "我爸爸也在医院工作。", "relatedKnowledge": "Giới từ 在", "section": "grammar"}, {"id": "q30-8-06", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.54–55] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "桌子上有什么？", "right": "饺子和面条儿。"}, {"left": "她是谁？", "right": "我老师。"}, {"left": "你爸爸在哪儿工作？", "right": "医院。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 8.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-8-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「房间」:", "options": ["fángjiān", "fǎngjiān", "fángjiàn", "wángjiān"], "answer": "fángjiān", "explanation": "房 thanh 2 (fáng) + 间 thanh 1 (jiān).", "relatedKnowledge": "Phát âm Bài 8", "section": "vocab"}, {"id": "q30-8-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「shūdiàn」:", "options": ["书店", "商店", "饭店", "医院"], "answer": "书店", "explanation": "书店 (shūdiàn) = hiệu sách.", "relatedKnowledge": "Mặt chữ Bài 8", "section": "vocab"}, {"id": "q30-8-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết nhà bác sĩ Hồ có mấy bác sĩ:", "audioText": "我爸爸也在医院工作，我家有两个医生。", "options": ["1 bác sĩ", "2 bác sĩ", "3 bác sĩ"], "answer": "2 bác sĩ", "explanation": "「我家有两个医生」 = 2 bác sĩ.", "relatedKnowledge": "Nghe hiểu Bài 8", "section": "listening"}, {"id": "q30-8-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Con mèo nhỏ ở dưới bàn.\"", "sampleAnswer": "小猫在桌子下。", "acceptedAnswers": ["小猫在桌子下", "小猫在桌子下。", "小猫在桌子下呢", "小猫在桌子下呢。", "小猫在桌子下面", "小猫在桌子下面。"], "requiredKeywords": ["小猫", "在", "桌子", "下"], "explanation": "小猫在桌子下(呢)。", "relatedKnowledge": "Phương vị từ 下", "section": "writing"}, {"id": "q30-8-11", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Lượng từ nào dùng đúng cho 「小猫」 (con mèo nhỏ)?", "options": ["一个", "一只", "一口", "一些"], "answer": "一只", "explanation": "「只 (zhī)」 là lượng từ chuyên dùng cho các động vật nhỏ như mèo, chó, chim: 「一只小猫」.", "relatedKnowledge": "Từ mới Bài 8 – Lượng từ 只"}, {"id": "q30-8-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 4 & 7", "prompt": "[Ôn Bài 4, 7, 8] Nhóm danh từ chỉ địa điểm nào sau đây đều có nghĩa đúng?", "options": ["医院 (bệnh viện) – 学校 (trường học) – 书店 (hiệu sách)", "书店 (siêu thị) – 电影院 (bệnh viện) – 房间 (trường học)", "学校 (nhà hàng) – 房间 (cái bàn) – 超市 (hiệu sách)", "桌子 (phòng) – 医院 (nhà) – 书店 (rạp phim)"], "answer": "医院 (bệnh viện) – 学校 (trường học) – 书店 (hiệu sách)", "explanation": "Hệ thống địa điểm đã học: 「超市/饭店」 (Bài 6), 「电影院/医院」 (Bài 7), 「学校/书店/房间」 (Bài 8).", "relatedKnowledge": "Tổng hợp từ vựng địa điểm Bài 6–8"}, {"id": "q30-8-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Câu nào đặt ĐÚNG vị trí cụm giới từ chỉ nơi chốn 「在 + Địa điểm」?", "options": ["我爸爸工作在医院。", "我爸爸也在医院工作。", "在医院也我爸爸工作。", "我爸爸也在工作医院。"], "answer": "我爸爸也在医院工作。", "explanation": "Trong tiếng Trung, trạng ngữ nơi chốn 「在 + Địa điểm」 PHẢI đứng TRƯỚC động từ (khác tiếng Việt): 「在医院工作」.", "relatedKnowledge": "Giới từ 在 + Địa điểm + Động từ"}, {"id": "q30-8-14", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 5–6", "prompt": "[Ôn Bài 5, 6, 8] Chọn động từ năng nguyện phù hợp ngữ cảnh: 'Chiều 2 giờ bạn có thể (đủ điều kiện/kịp) đến không?' — 下午两点你___到吗？", "options": ["能", "想", "叫", "在"], "answer": "能", "explanation": "「能 (néng)」 (Bài 8) chỉ khả năng/điều kiện khách quan ('có thể đến kịp không'); 「会」 (Bài 5) chỉ kỹ năng qua học tập; 「想」 (Bài 6) chỉ mong muốn.", "relatedKnowledge": "Phân biệt 会 (B5) – 想 (B6) – 能 (B8)"}, {"id": "q30-8-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "刘明：小胡，还没吃饭呢？大医院病人多，医生非常忙。\n胡医生：是的。我爸爸也在医院工作，他也非常忙。\n刘明：你家有两个医生？\n胡医生：对。", "passagePinyin": "Liú Míng: Xiǎo Hú, hái méi chīfàn ne? Dà yīyuàn bìngrén duō, yīshēng fēicháng máng. Hú yīshēng: Shì de. Wǒ bàba yě zài yīyuàn gōngzuò, tā yě fēicháng máng. Liú Míng: Nǐ jiā yǒu liǎng gè yīshēng? Hú yīshēng: Duì.", "prompt": "Vì sao bác sĩ Hồ và bố anh ấy đều rất bận?", "options": ["Vì họ có hai con mèo nhỏ", "Vì bệnh viện lớn có rất nhiều bệnh nhân", "Vì họ phải đi học buổi chiều", "Vì họ ở rất xa hiệu sách"], "answer": "Vì bệnh viện lớn có rất nhiều bệnh nhân", "explanation": "Lưu Minh nói 「大医院病人多，医生非常忙。」 và bác sĩ Hồ xác nhận 「是的。」.", "relatedKnowledge": "Bài khóa 3 – Hai bác sĩ trong nhà"}, {"id": "q30-8-16", "section": "reading", "type": "true_false", "points": 1, "prompt": "Trong Bài khóa 1, Trần Thiên Trung lúc đầu chưa nhìn thấy con mèo nhỏ vì nó đang ở dưới gầm bàn (「桌子下」).", "answer": true, "explanation": "Đúng! Bạch Gia Nguyệt nói 「它在桌子下呢。」 và Trần Thiên Trung khen 「这只小猫真漂亮！」.", "relatedKnowledge": "Bài khóa 1 – Phương vị từ 下"}, {"id": "q30-8-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 2 chữ Hán: 我没___，小猫在哪儿呢？(Tôi không nhìn thấy, con mèo nhỏ ở đâu vậy?)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["看见"], "explanation": "「看见 (kànjiàn)」 là nhìn thấy; phủ định dùng 「没看见」.", "relatedKnowledge": "Động từ kết quả 看见"}, {"id": "q30-8-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 7", "prompt": "[Ôn Bài 7 + 8] Sắp xếp thành câu hẹn gặp trước hiệu sách:", "tokens": ["见吧", "书店前", "我们", "学校", "在"], "answer": ["我们", "在", "学校", "书店前", "见吧"], "acceptedSequences": [["我们", "在", "学校", "书店前", "见吧"]], "explanation": "Kết hợp trạng ngữ nơi chốn 「在学校书店前」 (Bài 8) với 「见吧」 (Bài 7).", "relatedKnowledge": "Ôn Bài 7 (见吧) + Bài 8 (在...前)"}, {"id": "q30-8-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "房间外有一只小猫，它在桌子下呢，非常漂亮！", "prompt": "Nghe câu trên và chọn vị trí của con mèo nhỏ:", "options": ["Trên bàn trong phòng", "Ở ngoài phòng, phía dưới cái bàn", "Trước hiệu sách trường học", "Ở bệnh viện"], "answer": "Ở ngoài phòng, phía dưới cái bàn", "explanation": "Lời nghe: 「房间外有一只小猫，它在桌子下呢」.", "relatedKnowledge": "Nghe hiểu Bài 8"}, {"id": "q30-8-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 7", "audioText": "A：下午两点你能到学校书店前吗？ B：我能到。我中午在学校吃午饭。", "prompt": "[Ôn Bài 7 + 8] Nghe hội thoại và chọn thông tin ĐÚNG về người B:", "options": ["B không thể đến lúc 2 giờ chiều", "B có thể đến trước hiệu sách trường lúc 2 giờ chiều và ăn trưa ở trường", "B ăn tối ở nhà hàng Tây An", "B làm bác sĩ ở bệnh viện"], "answer": "B có thể đến trước hiệu sách trường lúc 2 giờ chiều và ăn trưa ở trường", "explanation": "B nói 「我能到。我中午在学校吃午饭。」 — kết hợp giờ giấc Bài 7 và nơi chốn Bài 8.", "relatedKnowledge": "Nghe tổng hợp Bài 7–8"}, {"id": "q30-8-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Ngoài phòng có một con mèo nhỏ.", "sampleAnswer": "房间外有一只小猫。", "pinyin": "Fángjiān wài yǒu yì zhī xiǎomāo.", "acceptedAnswers": ["房间外有一只小猫"], "requiredKeywords": ["房间外", "有", "小猫"]}, {"vi": "Tôi không nhìn thấy, nó đang ở dưới bàn à?", "sampleAnswer": "我没看见，它在桌子下吗？", "pinyin": "Wǒ méi kànjiàn, tā zài zhuōzi xià ma?", "acceptedAnswers": ["我没看见它在桌子下吗"], "requiredKeywords": ["没看见", "桌子下"]}, {"vi": "Bố tôi cũng làm việc ở bệnh viện.", "sampleAnswer": "我爸爸也在医院工作。", "pinyin": "Wǒ bàba yě zài yīyuàn gōngzuò.", "acceptedAnswers": ["我爸爸也在医院工作"], "requiredKeywords": ["爸爸", "也", "医院", "工作"]}, {"vi": "Chúng ta gặp nhau trước hiệu sách trường nhé.", "sampleAnswer": "我们在学校书店前见吧。", "pinyin": "Wǒmen zài xuéxiào shūdiàn qián jiàn ba.", "acceptedAnswers": ["我们在学校书店前见吧"], "requiredKeywords": ["学校", "书店", "前", "见"]}, {"vi": "[Ôn Bài 7] Chiều 2 giờ bạn có thể đến không? Tôi ăn trưa ở trường.", "sampleAnswer": "下午两点你 : "g30-09-1", "title": "1. Câu tồn hiện (1) & Trật tự Thời gian trước Nơi chốn", "formula": "Địa điểm + 有/是 + Người/Vật | Chủ ngữ + Thời gian + Nơi chốn + Động từ", "usage": "Khi trạng ngữ thời gian và nơi chốn cùng xuất hiện, THỜI GIAN luôn đứng TRƯỚC NƠI CHỐN.", "explanation": "Ví dụ: 安妮下午在家里学中文。/ 我们七点在电影院外边见。", "examples": [{"zh": "学校前边有一家电影院。", "pinyin": "Xuéxiào qiánbian yǒu yì jiā diànyǐngyuàn.", "vi": "Trước trường có một rạp chiếu phim."}, {"zh": "陈天中明天中午在学校吃午饭。", "pinyin": "Chén Tiānzhōng míngtiān zhōngwǔ zài xuéxiào chī wǔfàn.", "vi": "Trưa mai Trần Thiên Trung ăn trưa ở trường."}], "commonMistake": "Đặt nơi chốn trước thời gian: '我在学校明天上午学习' (SAI).", "comparison": "Phủ định câu tồn hiện không dùng số lượng từ: 桌子上没有小猫."}, {"id": "g30-09-2", "title": "2. Tiền tố 第 biểu thị số thứ tự", "formula": "第 + Số nguyên (+ Lượng từ + Danh từ)", "usage": "Dùng để tạo số thứ tự: 第一, 第二, 第三, 第一个学生, 第一本书.", "explanation": "Lưu ý: Trong số thứ tự luôn dùng 二 (第二), không dùng 两.", "examples": [{"zh": "这是我的第二本中文书。", "pinyin": "Zhè shì wǒ de dì-èr běn Zhōngwén shū.", "vi": "Đây là quyển sách tiếng Trung thứ hai của mình."}], "commonMistake": "Viết '第两本' (SAI). Đúng phải là '第二本'.", "comparison": "两个 (số lượng 2) ↔ 第二个 (thứ hai)."}], "patterns": [{"zh": "学校前边有一家电影院。", "pinyin": "Xuéxiào qiánbian yǒu yì jiā diànyǐngyuàn.", "vi": "Phía trước trường học có một rạp chiếu phim."}, {"zh": "我们七点在电影院外边见。", "pinyin": "Wǒmen qī diǎn zài diànyǐngyuàn wàibian jiàn.", "vi": "Chúng mình 7 giờ gặp nhau ở ngoài rạp chiếu phim."}, {"zh": "这是我的第二本中文书。", "pinyin": "Zhè shì wǒ de dì-èr běn Zhōngwén shū.", "vi": "Đây là quyển sách tiếng Trung thứ hai của mình."}, {"zh": "我明天上午在学校学习。", "pinyin": "Wǒ míngtiān shàngwǔ zài xuéxiào xuéxí.", "vi": "Sáng mai mình học ở trường."}, {"zh": "你唱歌很好听！", "pinyin": "Nǐ chàng gē hěn hǎotīng!", "vi": "Bạn hát nghe hay lắm!"}], "exercises": [{"id": "q30-9-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "qiánbian", "answer": "前边", "meaning": "Phía trước"}, {"pinyin": "jiā", "answer": "家", "meaning": "Cái, chiếc (cho cửa hàng, rạp, cơ quan)"}, {"pinyin": "nàge", "answer": "那个", "meaning": "Đó, cái đó"}, {"pinyin": "wàibian", "answer": "外边", "meaning": "Phía ngoài, bên ngoài"}, {"pinyin": "yǐzi", "answer": "椅子", "meaning": "Ghế"}, {"pinyin": "shang / shàng", "answer": "上", "meaning": "Trên (sau danh từ đọc thanh nhẹ)"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 9.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 9"}, {"id": "q30-9-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Ban ngày"}, {"key": "B", "label": "Sách"}, {"key": "C", "label": "Đọc sách, học bài"}, {"key": "D", "label": "Quyển, cuốn"}, {"key": "E", "label": "Thứ (biểu thị số thứ tự)"}, {"key": "F", "label": "Học, học tập"}], "items": [{"hanzi": "本", "pinyin": "běn", "answerKey": "D"}, {"hanzi": "书", "pinyin": "shū", "answerKey": "B"}, {"hanzi": "第", "pinyin": "dì", "answerKey": "E"}, {"hanzi": "学习", "pinyin": "xuéxí", "answerKey": "F"}, {"hanzi": "白天", "pinyin": "báitiān", "answerKey": "A"}, {"hanzi": "读书", "pinyin": "dúshū", "answerKey": "C"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 9.", "relatedKnowledge": "Từ mới Bài 9"}, {"id": "q30-9-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.67] 王一雪：你唱歌很 ___ 。(是 / 好听 / 在学校 / 今天上午 / 椅子)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["好听"], "explanation": "唱歌很好听 = hát rất hay.", "relatedKnowledge": "Bài khóa 3", "section": "writing"}, {"id": "q30-9-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.67] 她 ___ 在家里学习。(是 / 好听 / 在学校 / 今天上午 / 椅子)", "placeholder": "Nhập cụm thời gian...", "acceptedAnswers": ["今天上午"], "explanation": "Thời gian (今天上午) đứng trước nơi chốn (在家里).", "relatedKnowledge": "Trật tự thời gian & nơi chốn", "section": "writing"}, {"id": "q30-9-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.65] 星期天中午妈妈在做饭，我和妹妹在房间里玩。★ 说话人和妹妹在哪儿？", "options": ["外边", "房间里", "超市里"], "answer": "房间里", "explanation": "Câu nêu rõ 「我和妹妹在房间里玩」.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-9-04", "type": "single_choice", "points": 1, "prompt": "「Quyển sách thứ hai」 viết đúng là:", "options": ["第两本书", "第二本书", "二第本书", "两本书第"], "answer": "第二本书", "explanation": "Số thứ tự dùng 「第二」.", "relatedKnowledge": "Tiền tố 第", "section": "grammar"}, {"id": "q30-9-05", "type": "true_false", "points": 1, "prompt": "Khi thời gian và nơi chốn cùng làm trạng ngữ, từ ngữ chỉ thời gian luôn đứng trước từ ngữ chỉ nơi chốn.", "answer": true, "explanation": "Đúng (Lớp học của Tiểu Ngữ tr.63).", "relatedKnowledge": "Trật tự trạng ngữ", "section": "grammar"}, {"id": "q30-9-06", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Sáng mai mình học ở trường):", "tokens": ["学习", "在学校", "明天上午", "我"], "answer": ["我", "明天上午", "在学校", "学习"], "acceptedSequences": [["我", "明天上午", "在学校", "学习"], ["明天上午", "我", "在学校", "学习"]], "explanation": "Thời gian (明天上午) đứng trước nơi chốn (在学校).", "relatedKnowledge": "Tiêu đề Bài 9", "section": "grammar"}, {"id": "q30-9-07", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.64] Nối câu hỏi với câu trả lời tương ứng:", "pairs": [{"left": "桌子上有什么？", "right": "一只小猫。"}, {"left": "你今天下午在哪儿？", "right": "在家里。"}, {"left": "你和谁在超市呢？", "right": "我女朋友。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 9.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-9-08", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「好听」:", "options": ["hǎotīng", "hǎodīng", "hàotīng", "hǎotíng"], "answer": "hǎotīng", "explanation": "好 thanh 3 (hǎo) + 听 thanh 1 (tīng).", "relatedKnowledge": "Phát âm Bài 9", "section": "vocab"}, {"id": "q30-9-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết tối thứ Bảy Dương Đồng Lạc làm gì:", "audioText": "我白天在家里读书，晚上和朋友们去外边唱歌。", "options": ["Ở nhà nấu ăn", "Đi hát cùng bạn bè", "Đi xem phim"], "answer": "Đi hát cùng bạn bè", "explanation": "「晚上和朋友们去外边唱歌」.", "relatedKnowledge": "Nghe hiểu Bài 9", "section": "listening"}, {"id": "q30-9-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Phía trước trường có một rạp chiếu phim.\"", "sampleAnswer": "学校前边有一家电影院。", "acceptedAnswers": ["学校前边有一家电影院", "学校前边有一家电影院。", "学校前面有一家电影院", "学校前面有一家电影院。"], "requiredKeywords": ["学校", "有", "电影院"], "explanation": "学校前边有一家电影院。", "relatedKnowledge": "Câu tồn hiện", "section": "writing"}, {"id": "q30-9-11", "section": "vocab", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho từ 「hǎotīng」 (Hay, nghe hay – dùng cho giọng hát, âm nhạc):", "options": ["好看", "好吃", "好听", "好玩儿"], "answer": "好听", "explanation": "「好听 (hǎotīng)」 = nghe hay (Bài 9); 「好看」 = đẹp mắt (Bài 5); 「好吃」 = ăn ngon (Bài 6).", "relatedKnowledge": "Phân biệt nhóm tính từ 好 + Động từ (Bài 5, 6, 9)"}, {"id": "q30-9-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 4 & 8", "prompt": "[Ôn Bài 4, 8, 9] Chọn đúng bộ lượng từ tương ứng cho: 「一___电影院 · 一___中文书 · 一___小狗」:", "options": ["家 · 本 · 只", "本 · 家 · 只", "个 · 口 · 家", "只 · 本 · 个"], "answer": "家 · 本 · 只", "explanation": "「家」 dùng cho rạp phim/cửa hàng/công ty (Bài 9), 「本」 dùng cho sách (Bài 9), 「只」 dùng cho động vật nhỏ như chó/mèo (Bài 8).", "relatedKnowledge": "Tổng hợp lượng từ Bài 4, 8, 9"}, {"id": "q30-9-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Khi trong cùng một câu có cả trạng ngữ THỜI GIAN và NƠI CHỐN, trật tự nào ĐÚNG chuẩn tiếng Trung?", "options": ["我在学校明天上午学习。", "我明天上午在学校学习。", "我学习明天上午在学校。", "在学校我明天上午学习。"], "answer": "我明天上午在学校学习。", "explanation": "Quy tắc vàng: Chủ ngữ + Thời gian (明天上午) + Nơi chốn (在学校) + Động từ (学习) — thời gian luôn đứng trước nơi chốn.", "relatedKnowledge": "Trật tự Thời gian trước Nơi chốn"}, {"id": "q30-9-14", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 4", "prompt": "[Ôn Bài 4 + 9] Phân biệt số đếm 「两本中文书」 và số thứ tự 「第二本中文书」:", "options": ["Số thứ tự dùng 「第 + 二」 (第二本), còn số lượng dùng 「两」 (两本)", "Số thứ tự dùng 「第两本」, còn số lượng dùng 「二本」", "Cả hai đều bắt buộc dùng 「二」", "Cả hai đều bắt buộc dùng 「两」"], "answer": "Số thứ tự dùng 「第 + 二」 (第二本), còn số lượng dùng 「两」 (两本)", "explanation": "Trong số thứ tự luôn dùng 「二」 sau 「第」 → 「第二本」 (quyển thứ hai); còn đếm số lượng 2 quyển dùng 「两本」 (Bài 4).", "relatedKnowledge": "Ôn Bài 4 (二/两) + Bài 9 (Tiền tố 第)"}, {"id": "q30-9-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "杨同乐：我白天在家里读书，晚上和朋友们去外边唱歌。\n王一雪：你唱歌很好听。我在家里做饭、看电视，和孩子们、小狗玩。", "passagePinyin": "Yáng Tónglè: Wǒ báitiān zài jiālǐ dúshū, wǎnshang hé péngyoumen qù wàibian chànggē. Wáng Yīxuě: Nǐ chànggē hěn hǎotīng. Wǒ zài jiālǐ zuòfàn, kàn diànshì, hé háizimen, xiǎogǒu wán.", "prompt": "Buổi tối Dương Đồng Lạc làm gì?", "options": ["Ở nhà nấu ăn và xem tivi", "Đi ra ngoài hát cùng bạn bè", "Ở trường học tiếng Trung", "Chơi cùng các con và chú chó nhỏ"], "answer": "Đi ra ngoài hát cùng bạn bè", "explanation": "Dương Đồng Lạc nói 「晚上和朋友们去外边唱歌。」; còn ở nhà nấu ăn, xem tivi, chơi với con và chó nhỏ là Vương Nhất Tuyết.", "relatedKnowledge": "Bài khóa 3 – Kế hoạch cuối tuần"}, {"id": "q30-9-16", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 8", "prompt": "[Ôn Bài 8 + 9] Trong câu tồn hiện 「椅子上有一本中文书。」, nơi chốn 「椅子上」 đứng đầu câu làm chủ ngữ, tiếp theo là 「有」 rồi đến vật tồn tại.", "answer": true, "explanation": "Đúng! Mẫu câu tồn hiện chuẩn: 「Nơi chốn + 有 + Số lượng + Danh từ」 (giống 「房间外有一只小猫」 ở Bài 8 và 「学校前边有一家电影院」 ở Bài 9).", "relatedKnowledge": "Câu tồn hiện với 有 (Bài 8–9)"}, {"id": "q30-9-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 1 chữ Hán tạo số thứ tự: 这是我的___二本中文书。(Đây là quyển sách tiếng Trung thứ hai của tôi.)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["第"], "explanation": "Tiền tố 「第 (dì)」 đứng trước số từ tạo số thứ tự: 「第二本」.", "relatedKnowledge": "Số thứ tự với 第"}, {"id": "q30-9-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 7", "prompt": "[Ôn Bài 7 + 9] Sắp xếp thành câu hẹn gặp lúc 7 giờ ngoài rạp chiếu phim:", "tokens": ["七点", "电影院外边", "我们", "见", "在"], "answer": ["我们", "七点", "在", "电影院外边", "见"], "acceptedSequences": [["我们", "七点", "在", "电影院外边", "见"], ["七点", "我们", "在", "电影院外边", "见"]], "explanation": "Thời gian 「七点」 (Bài 7) đặt trước nơi chốn 「在电影院外边」 (Bài 9).", "relatedKnowledge": "Ôn Bài 7 + Bài 9 (Thời gian trước Nơi chốn)"}, {"id": "q30-9-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "椅子上有一本中文书，那是陈天中的第二本中文书。", "prompt": "Nghe câu trên và chọn đáp án ĐÚNG:", "options": ["Trên bàn có hai quyển sách tiếng Pháp", "Trên ghế có quyển sách tiếng Trung thứ hai của Trần Thiên Trung", "Dưới ghế có một chú chó nhỏ", "Trần Thiên Trung không có sách tiếng Trung"], "answer": "Trên ghế có quyển sách tiếng Trung thứ hai của Trần Thiên Trung", "explanation": "Lời nghe: 「椅子上有一本中文书，那是陈天中的第二本中文书。」.", "relatedKnowledge": "Nghe hiểu Bài 9"}, {"id": "q30-9-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 5 & 7", "audioText": "A：你星期天白天做什么？ B：我白天在家读书，晚上七点在学校前边的电影院看电影。", "prompt": "[Ôn Bài 5, 7, 9] Nghe hội thoại và cho biết Chủ nhật lúc 7 giờ tối B làm gì?", "options": ["Đọc sách ở nhà", "Đi hát với bạn bè", "Xem phim ở rạp chiếu phim phía trước trường học", "Đi siêu thị mua đồ"], "answer": "Xem phim ở rạp chiếu phim phía trước trường học", "explanation": "B nói 「晚上七点在学校前边的电影院看电影。」 — kết hợp kiến thức Bài 5, 7 và 9.", "relatedKnowledge": "Nghe tổng hợp Bài 5, 7, 9"}, {"id": "q30-9-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng "points": 1, "prompt": "Ở Trung Quốc, 「两斤苹果」 tương đương với bao nhiêu kilôgam (kg) táo?", "options": ["0,5 kg", "1 kg", "2 kg", "4 kg"], "answer": "1 kg", "explanation": "1 cân Trung Quốc (1 斤) = 0,5 kg, nên 「两斤苹果」 = 1 kg táo.", "relatedKnowledge": "Đơn vị đo lường 斤 (Bài 10)"}, {"id": "q30-10-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Cách nói giá tiền 「3,5 tệ」 tự nhiên nhất trong khẩu ngữ tiếng Trung là:", "options": ["三块五", "三元五块", "三个五钱", "五块三"], "answer": "三块五", "explanation": "Trong khẩu ngữ dùng 「块」 (tệ) và 「毛」 (hào), có thể lược 「毛」 ở cuối khi đứng sau 「块」: 「三块五」 (= 3,5 tệ).", "relatedKnowledge": "Cách diễn đạt tiền Nhân dân tệ"}, {"id": "q30-10-14", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 6", "prompt": "[Ôn Bài 6 + 10] Phân biệt đại từ nghi vấn 「怎么」 (Bài 6) và 「怎么样」 (Bài 10):", "options": ["「怎么 + Động từ」 hỏi cách làm; 「Danh từ + 怎么样」 hỏi chất lượng/ý kiến ('thế nào?')", "「怎么样」 đứng trước động từ hỏi phương tiện; 「怎么」 đứng cuối câu hỏi giá", "Hai từ hoàn toàn giống nhau và đổi chỗ mọi vị trí", "Cả hai đều chỉ dùng để hỏi giá tiền"], "answer": "「怎么 + Động từ」 hỏi cách làm; 「Danh từ + 怎么样」 hỏi chất lượng/ý kiến ('thế nào?')", "explanation": "Ví dụ: 「怎么去？」 (Đi bằng cách nào? – Bài 6) vs 「这件衣服怎么样？」 (Chiếc áo này thế nào? – Bài 10).", "relatedKnowledge": "Phân biệt 怎么 (B6) và 怎么样 (B10)"}, {"id": "q30-10-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "王一雪：这家商店衣服真多！这件一百元，怎么样？\n刘明：好看，也不贵。小明能穿吗？\n王一雪：不能。这些是女孩子穿的衣服，男孩子的衣服在那儿。", "passagePinyin": "Wáng Yīxuě: Zhè jiā shāngdiàn yīfu zhēn duō! Zhè jiàn yìbǎi yuán, zěnmeyàng? Liú Míng: Hǎokàn, yě bú guì. Xiǎomíng néng chuān ma? Wáng Yīxuě: Bù néng. Zhèxiē shì nǚháizi chuān de yīfu, nánháizi de yīfu zài nàr.", "prompt": "Vì sao Lưu Tiểu Minh không thể mặc chiếc áo giá 100 tệ đó?", "options": ["Vì chiếc áo quá đắt", "Vì chiếc áo không đẹp", "Vì đó là quần áo dành cho bé gái, còn quần áo bé trai ở đằng kia", "Vì cửa hàng ", "pinyin": "Wèi, Lǐ Wén, nǐ shénme shíhou néng dào fàndiàn? Nǐ kāichē méi kāichē?", "vi": "A lô Lý Văn, khi nào em đến nhà hàng? Em có lái xe không?"}, {"speaker": "Lý Văn", "side": "right", "zh": "还不知道，正在找呢。我没开车，坐车呢。", "pinyin": "Hái bù zhīdào, zhèngzài zhǎo ne. Wǒ méi kāichē, zuò chē ne.", "vi": "Em chưa biết ạ, đang tìm đây. Em không lái xe, đang ngồi xe đây."}]}, {"id": "d30-11-2", "title": "Bài khóa 2: Chuyện học đại học", "context": "Vương Nhất Phi và Lý Văn trò chuyện tại nhà hàng.", "audioFile": "", "lines": [{"speaker": "Vương Nhất Phi", "side": "left", "zh": "你还在读大学吗？你们学习忙不忙？", "pinyin": "Nǐ hái zài dú dàxué ma? Nǐmen xuéxí máng bu máng?", "vi": "Em vẫn đang học đại học à? Các em học có bận không?"}, {"speaker": "Lý Văn", "side": "right", "zh": "对，我读大学呢，还是大学生。非常忙，我学医，我们的课很多。", "pinyin": "Duì, wǒ dú dàxué ne, hái shì dàxuéshēng. Fēicháng máng, wǒ xué yī, wǒmen de kè hěn duō.", "vi": "Vâng, em đang học đại học. Bận lắm ạ, em học y, môn học rất nhiều."}]}, {"id": "d30-11-3", "title": "Bài khóa 3: Em trai chưa dậy", "context": "Sáng thứ Bảy, Lưu Minh trò chuyện với con gái Lưu Tiểu Tuyết trước khi đi làm.", "audioFile": "", "lines": [{"speaker": "Lưu Minh", "side": "left", "zh": "弟弟起床没起床呢？他今天去不去那里？", "pinyin": "Dìdi qǐchuáng méi qǐchuáng ne? Tā jīntiān qù bu qù nàlǐ?", "vi": "Em đã dậy chưa con? Hôm nay em có đi siêu thị không?"}, {"speaker": "Lưu Tiểu Tuyết", "side": "right", "zh": "没起床呢，还在睡觉。我昨天问他，他对我说，他不去，他今天要和小朋友玩。", "pinyin": "Méi qǐchuáng ne, hái zài shuìjiào. Wǒ zuótiān wèn tā, tā duì wǒ shuō, tā bú qù, tā jīntiān yào hé xiǎopéngyǒu wán.", "vi": "Chưa dậy ạ, vẫn đang ngủ. Hôm qua em bảo không đi, hôm nay em muốn chơi với các bạn nhỏ."}]}], "grammar": [{"id": "g30-11-1", "title": "1. Câu hỏi chính phản (正反问)", "formula": "Động từ / Tính từ + 不 / 没 + Động từ / Tính từ", "usage": "Dùng 不/没 với động từ và 不 với tính từ. Không thêm 吗 vào cuối câu hỏi chính phản.", "explanation": "Ví dụ: 它是不是在超市后边？/ 你去没去学校？/ 这件衣服好看不好看？", "examples": [{"zh": "你们学习忙不忙？", "pinyin": "Nǐmen xuéxí máng bu máng?", "vi": "Các em học có bận không?"}, {"zh": "昨天你去没去书店？— 我没去。", "pinyin": "Zuótiān nǐ qù méi qù shūdiàn? — Wǒ méi qù.", "vi": "Hôm qua bạn có đi hiệu sách không? — Mình không đi."}], "commonMistake": "Thêm thừa 吗 cuối câu: '你忙不忙吗？' (SAI).", "comparison": "Câu hỏi dùng 吗 ↔ Câu hỏi chính phản (忙不忙)."}, {"id": "g30-11-2", "title": "2. Ba dạng tiếp diễn (在/正在……呢) & Động từ năng nguyện 要", "formula": "(1) 在/正在 + V | (2) 在/正在 + V + 呢 | (3) V + 呢 | Chủ ngữ + 要 + V", "usage": "Phủ định hành động đang diễn ra dùng 没(有). Động từ năng nguyện 要 đặt trước động từ biểu thị mong muốn/dự định.", "explanation": "Ví dụ: 学生们在/正在上课呢。/ 我读大学呢。/ 妈妈要去超市。", "examples": [{"zh": "我正在看电视。", "pinyin": "Wǒ zhèngzài kàn diànshì.", "vi": "Tôi đang xem tivi."}, {"zh": "他今天要和小朋友玩。", "pinyin": "Tā jīntiān yào hé xiǎopéngyǒu wán.", "vi": "Hôm nay cậu ấy muốn chơi với các bạn nhỏ."}], "commonMistake": "Phủ định đang làm dùng 不 thay vì 没 (SAI: 我不在买菜).", "comparison": "要 (dự định, quyết tâm mạnh hơn 想)."}], "patterns": [{"zh": "你什么时候能到饭店？— 正在找呢。", "pinyin": "Nǐ shénme shíhou néng dào fàndiàn? — Zhèngzài zhǎo ne.", "vi": "Khi nào em đến nhà hàng? — Đang tìm đây ạ."}, {"zh": "你们学习忙不忙？— 非常忙。", "pinyin": "Nǐmen xuéxí máng bu máng? — Fēicháng máng.", "vi": "Các em học có bận không? — Bận lắm ạ."}, {"zh": "我读大学呢，我学医。", "pinyin": "Wǒ dú dàxué ne, wǒ xué yī.", "vi": "Em đang học đại học, em học ngành y."}, {"zh": "弟弟没起床呢，还在睡觉。", "pinyin": "Dìdi méi qǐchuáng ne, hái zài shuìjiào.", "vi": "Em trai chưa dậy, vẫn đang ngủ."}, {"zh": "妈妈要去超市。", "pinyin": "Māma yào qù chāoshì.", "vi": "Mẹ dự định đi siêu thị."}], "exercises": [{"id": "q30-11-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "shíhou", "answer": "时候", "meaning": "Lúc, khi"}, {"pinyin": "fàndiàn", "answer": "饭店", "meaning": "Nhà hàng, khách sạn"}, {"pinyin": "zhīdào", "answer": "知道", "meaning": "Biết, nhận ra"}, {"pinyin": "zhèngzài", "answer": "正在", "meaning": "Đang (làm gì)"}, {"pinyin": "zhǎo", "answer": "找", "meaning": "Tìm, kiếm"}, {"pinyin": "kāichē", "answer": "开车", "meaning": "Lái xe (ô tô)"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 11.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 11"}, {"id": "q30-11-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Học, đọc"}, {"key": "B", "label": "Học"}, {"key": "C", "label": "Đại học"}, {"key": "D", "label": "Em trai"}, {"key": "E", "label": "Sinh viên"}, {"key": "F", "label": "Xe"}], "items": [{"hanzi": "车", "pinyin": "chē", "answerKey": "F"}, {"hanzi": "读", "pinyin": "dú", "answerKey": "A"}, {"hanzi": "大学", "pinyin": "dàxué", "answerKey": "C"}, {"hanzi": "大学生", "pinyin": "dàxuéshēng", "answerKey": "E"}, {"hanzi": "学", "pinyin": "xué", "answerKey": "B"}, {"hanzi": "弟弟", "pinyin": "dìdi", "answerKey": "D"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 11.", "relatedKnowledge": "Từ mới Bài 11"}, {"id": "q30-11-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.84] 你 ___ 超市？(那里 / 睡觉 / 去不去 / 要 / 正在)", "placeholder": "Nhập 3 chữ Hán...", "acceptedAnswers": ["去不去"], "explanation": "Câu hỏi chính phản 「去不去」.", "relatedKnowledge": "Câu hỏi chính phản", "section": "writing"}, {"id": "q30-11-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.84] 她没在看电视，___ 学习呢。(那里 / 睡觉 / 去不去 / 要 / 正在)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["正在"], "explanation": "Phó từ tiếp diễn 「正在 + Động từ + 呢」.", "relatedKnowledge": "Phó từ 在/正在", "section": "writing"}, {"id": "q30-11-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.83] 我姐姐今年20岁，正在读大学呢，她学医。★ 说话人的姐姐是：", "options": ["老师", "医生", "大学生"], "answer": "大学生", "explanation": "Chị gái đang học đại học ngành y nên hiện là 「大学生」.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-11-04", "type": "true_false", "points": 1, "prompt": "Trong câu hỏi chính phản 「你去不去超市吗？」, phải thêm 「吗」 ở cuối câu.", "answer": false, "explanation": "Sai. Câu hỏi chính phản tuyệt đối không thêm 「吗」.", "relatedKnowledge": "Câu hỏi chính phản", "section": "grammar"}, {"id": "q30-11-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Hôm nay em ấy muốn chơi với các bạn nhỏ):", "tokens": ["玩", "和小朋友", "要", "他今天"], "answer": ["他今天", "要", "和小朋友", "玩"], "acceptedSequences": [["他今天", "要", "和小朋友", "玩"]], "explanation": "他今天要和小朋友玩。", "relatedKnowledge": "Động từ năng nguyện 要", "section": "grammar"}, {"id": "q30-11-06", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.82] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "你开车去吗？", "right": "不，我坐出租车。"}, {"left": "你们学习忙不忙？", "right": "非常忙。"}, {"left": "你在吃午饭吗？", "right": "没有，我在开车呢。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 11.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-11-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「起床」:", "options": ["qǐchuáng", "qīchuáng", "jǐchuáng", "qǐzhuáng"], "answer": "qǐchuáng", "explanation": "起 thanh 3 (qǐ) + 床 thanh 2 (chuáng).", "relatedKnowledge": "Phát âm Bài 11", "section": "vocab"}, {"id": "q30-11-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「zhīdào」:", "options": ["知道", "正在", "起床", "睡觉"], "answer": "知道", "explanation": "知道 (zhīdào) = biết.", "relatedKnowledge": "Mặt chữ Bài 11", "section": "vocab"}, {"id": "q30-11-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết Lý Văn học ngành gì ở đại học:", "audioText": "我读大学呢，还是大学生。我学医，我们的课很多。", "options": ["Học tiếng Pháp", "Học ngành y (学医)", "Học nấu ăn"], "answer": "Học ngành y (学医)", "explanation": "Lý Văn nói 「我学医」.", "relatedKnowledge": "Nghe hiểu Bài 11", "section": "listening"}, {"id": "q30-11-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Em trai vẫn đang ngủ.\"", "sampleAnswer": "弟弟还在睡觉。", "acceptedAnswers": ["弟弟还在睡觉", "弟弟还在睡觉。", "弟弟还在睡觉呢", "弟弟还在睡觉呢。"], "requiredKeywords": ["弟弟", "在", "睡觉"], "explanation": "弟弟还在睡觉。", "relatedKnowledge": "Bài khóa 3", "section": "writing"}, {"id": "q30-11-11", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Cụm từ 「起床 (qǐchuáng)」 và 「睡觉 (shuìjiào)」 có quan hệ nghĩa như thế nào?", "options": ["Đồng nghĩa (đều là đi ngủ)", "Trái nghĩa (thức dậy ↔ đi ngủ)", "Cùng chỉ việc lái xe", "Cùng chỉ việc học đại học"], "answer": "Trái nghĩa (thức dậy ↔ đi ngủ)", "explanation": "「起床」 = thức dậy, rời giường; 「睡觉」 = đi ngủ.", "relatedKnowledge": "Từ mới Bài 11"}, {"id": "q30-11-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 6 & 10", "prompt": "[Ôn Bài 6, 10, 11] Chọn cặp tương đương giữa khẩu ngữ miền Bắc (âm cuốn lưỡi 儿) và cách nói phổ thông:", "options": ["哪儿 = 哪里; 那儿 = 那里", "哪儿 = 那里; 这儿 = 哪里", "谁 = 哪里; 多少 = 那里", "哪儿 = 什么; 那儿 = 怎么"], "answer": "哪儿 = 哪里; 那儿 = 那里", "explanation": "「哪儿」 (Bài 6) = 「哪里」 (Bài 11, ở đâu); 「那儿」 (Bài 10) = 「那里」 (Bài 11, ở kia).", "relatedKnowledge": "Hệ thống đại từ chỉ nơi chốn Bài 6, 10, 11"}, {"id": "q30-11-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Câu hỏi chính phản (正反问) nào dưới đây viết ĐÚNG ngữ pháp?", "options": ["你们学习忙不忙吗？", "你们学习忙不忙？", "你们学习很忙不忙？", "你们学习不忙忙？"], "answer": "你们学习忙不忙？", "explanation": "Câu hỏi chính phản (A不A / A没A) KHÔNG được thêm 「吗」 ở cuối và KHÔNG thêm phó từ mức độ 「很」 phía trước.", "relatedKnowledge": "Quy tắc câu hỏi chính phản (正反问)"}, {"id": "q30-11-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Cấu trúc nào biểu thị hành động ĐANG diễn ra ('Tôi đang tìm nhà hàng đây')?", "options": ["我正在找饭店呢。", "我昨天找饭店。", "我找不找饭店？", "我明天要找饭店。"], "answer": "我正在找饭店呢。", "explanation": "Thể tiếp diễn dùng 「在 / 正在 + Động từ (+ 呢)」 hoặc 「Động từ + 呢」 (như 「我读大学呢」).", "relatedKnowledge": "Thể tiếp diễn 在 / 正在……呢"}, {"id": "q30-11-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "刘明：弟弟起床没起床呢？他今天去不去那里？\n刘小雪：没起床呢，还在睡觉。我昨天问他，他对我说，他不去，他今天要和小朋友玩。", "passagePinyin": "Liú Míng: Dìdi qǐchuáng méi qǐchuáng ne? Tā jīntiān qù bu qù nàlǐ? Liú Xiǎoxuě: Méi qǐchuáng ne, hái zài shuìjiào. Wǒ zuótiān wèn tā, tā duì wǒ shuō, tā bú qù, tā jīntiān yào hé xiǎopéngyǒu wán.", "prompt": "Hôm nay em trai (Lưu Tiểu Minh) có kế hoạch làm gì?", "options": ["Đi cùng bố đến nhà hàng", "Đi chơi với các bạn nhỏ", "Ở nhà học tiếng Trung", "Lái xe đi siêu thị"], "answer": "Đi chơi với các bạn nhỏ", "explanation": "Lưu Tiểu Tuyết nói 「他不去，他今天要和小朋友玩。」 (Em ấy không đi, hôm nay em ấy định chơi với các bạn nhỏ).", "relatedKnowledge": "Bài khóa 3 – Động từ năng nguyện 要"}, {"id": "q30-11-16", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 3 & 8", "prompt": "[Ôn Bài 3, 8, 11] Lý Văn là sinh viên đại học ngành Y (「学医」), nên lịch học của bạn ấy rất bận và có nhiều tiết học (「我们的课很多」).", "answer": true, "explanation": "Đúng theo Bài khóa 2: 「对，我读大学呢，还是大学生。非常忙，我学医，我们的课很多。」.", "relatedKnowledge": "Bài khóa 2 – Tổng hợp từ vựng học tập"}, {"id": "q30-11-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 2 chữ Hán chỉ thời gian quá khứ: 我___问他了。(Hôm qua tôi đã hỏi em ấy.)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["昨天"], "explanation": "Bộ 3 ngày liên tiếp đã học đủ: 「昨天」 (hôm qua – Bài 11), 「今天」 (hôm nay – Bài 5), 「明天」 (ngày mai – Bài 6).", "relatedKnowledge": "Hệ thống từ thời gian 昨天/今天/明天"}, {"id": "q30-11-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 8", "prompt": "[Ôn Bài 8 + 11] Sắp xếp thành câu hỏi thời điểm có thể đến nhà hàng:", "tokens": ["能到", "你", "饭店", "什么时候"], "answer": ["你", "什么时候", "能到", "饭店"], "acceptedSequences": [["你", "什么时候", "能到", "饭店"]], "explanation": "Cụm hỏi thời gian 「什么时候」 đứng sau chủ ngữ, trước 「能到饭店」 (Bài 8 + Bài 11).", "relatedKnowledge": "Ôn Bài 8 (能到) + Bài 11 (什么时候)"}, {"id": "q30-11-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "喂，李文，你开车没开车？我没开车，坐车呢，正在找饭店。", "prompt": "Nghe đoạn âm thanh và cho biết Lý Văn đang đến nhà hàng bằng cách nào?", "options": ["Tự lái xe ô tô", "Không lái xe mà đang ngồi xe (đi xe) và tìm nhà hàng", "Đang ngủ ở nhà", "Đang ở trường học y"], "answer": "Không lái xe mà đang ngồi xe (đi xe) và tìm nhà hàng", "explanation": "Lời nghe: 「我没开车，坐车呢，正在找饭店。」.", "relatedKnowledge": "Nghe hiểu Bài 11"}, {"id": "q30-11-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 6 & 9", "audioText": "A：你昨天去不去学校读书？ B：去了，我昨天上午在学校读书，晚上和朋友去饭店吃饭。", "prompt": "[Ôn Bài 6, 9, 11] Nghe hội thoại và chọn thông tin ĐÚNG:", "options": ["Hôm qua B không đi học", "Sáng hôm qua B đọc sách ở trường, tối đi nhà hàng ăn cơm cùng bạn", "Hôm qua B đi xem phim một mình", "Hôm qua B ở nhà ngủ cả ngày"], "answer": "Sáng hôm qua B đọc sách ở trường, tối đi nhà hàng ăn cơm cùng bạn", "explanation": "Kết hợp 「昨天」 (Bài 11), 「上午在学校读书 / 和朋友」 (Bài 9) và 「饭店」 (Bài 11).", "relatedKnowledge": "Nghe tổng hợp Bài 6, 9, 11"}, {"id": "q30-11-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Khi nào bạn có thể đến nhà hàng?", "sampleAnswer": "你什么时候能到饭店？", "pinyin": "Nǐ shénme shíhou néng dào fàndiàn?", "acceptedAnswers": ["你什么时候能到饭店"], "requiredKeywords": ["什么时候", "能到", "饭店"]}, {"vi": "Tôi không lái xe, tôi đang ngồi xe.", "sampleAnswer": "我没开车，坐车呢。", "pinyin": "Wǒ méi kāichē, zuòchē ne.", "acceptedAnswers": ["我没开车坐车呢", "我没有开车坐车呢"], "requiredKeywords": ["没开车", "坐车"]}, {"vi": "Tôi đang học đại học, tôi học ngành Y.", "sampleAnswer": "我读大学呢，我学医。", "pinyin": "Wǒ dú dàxué ne, wǒ xué yī.", "acceptedAnswers": ["我读大学呢我学医", "我在读大学我学医"], "requiredKeywords": ["大学", "学医"]}, {"vi": "Em trai đã thức dậy chưa? — Chưa, vẫn đang ngủ.", "s  了 (1)", "formula": "下雨了。/ 下雪了。/ 上课了。 | Phủ định dùng 没 và bỏ 了", "usage": "Câu phi chủ vị không phân chia chủ ngữ – vị ngữ, rất thông dụng trong khẩu ngữ. 了 (1) đứng cuối câu báo hiệu tình huống mới xuất hiện.", "explanation": "Ví dụ: 十二点了，吃午饭吧。/ A: 弟弟起床了吗？ B: 没起床呢。", "examples": [{"zh": "下雨了。/ 下雪了。", "pinyin": "Xià yǔ le. / Xià xuě le.", "vi": "Trời mưa rồi. / Tuyết rơi rồi."}], "commonMistake": "Phủ định vẫn giữ 了 (SAI: 没起床了).", "comparison": "Lặp động từ 「看看」 biểu thị hành động diễn ra ngắn, nhẹ nhàng."}, {"id": "g30-12-2", "title": "2. Cấu trúc cảm thán 太……了！", "formula": "太 + Tính từ + 了！", "usage": "Dùng để cảm thán mức độ rất cao.", "explanation": "Ví dụ: 太冷了！/ 这个杯子太小了。/ 我们今天太高兴了！", "examples": [{"zh": "太冷了！", "pinyin": "Tài lěng le!", "vi": "Lạnh quá!"}, {"zh": "我们今天太高兴了！", "pinyin": "Wǒmen jīntiān tài gāoxìng le!", "vi": "Hôm nay chúng ta vui quá!"}], "commonMistake": "Quên chữ 了 cuối câu cảm thán khẳng định.", "comparison": "Văn hóa Trung Quốc: Hay khuyên uống nước ấm (喝热水) khi bị ốm."}], "patterns": [{"zh": "今天天气怎么样？— 下雨了，我觉得很冷。", "pinyin": "Jīntiān tiānqì zěnmeyàng? — Xià yǔ le, wǒ juéde hěn lěng.", "vi": "Hôm nay thời tiết thế nào? — Mưa rồi, mình thấy rất lạnh."}, {"zh": "昨天下雪了，太冷了！", "pinyin": "Zuótiān xià xuě le, tài lěng le!", "vi": "Hôm qua tuyết rơi rồi, lạnh quá!"}, {"zh": "我昨天去医院看病了。", "pinyin": "Wǒ zuótiān qù yīyuàn kànbìng le.", "vi": "Hôm qua em đi bệnh viện khám bệnh."}, {"zh": "吃一点儿药，今天休息半天吧。", "pinyin": "Chī yìdiǎnr yào, jīntiān xiūxi bàn tiān ba.", "vi": "Uống một ít thuốc, hôm nay nghỉ nửa ngày nhé."}, {"zh": "回家后再喝些热水。", "pinyin": "Huí jiā hòu zài hē xiē rè shuǐ.", "vi": "Sau khi về nhà nhớ uống thêm nước ấm nhé."}], "exercises": [{"id": "q30-12-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "tiānqì", "answer": "天气", "meaning": "Thời tiết"}, {"pinyin": "zhèlǐ", "answer": "这里", "meaning": "Ở đây, chỗ này"}, {"
