 "section": "reading"}, {"id": "q30-12-04", "type": "true_false", "points": 1, "prompt": "Trong tiếng Trung, 「uống thuốc」 nói là 「吃药」 (không nói 喝药).", "answer": true, "explanation": "Đúng (Bài khóa 3 tr.91: 吃一点儿药).", "relatedKnowledge": "Kết hợp từ 吃药", "section": "grammar"}, {"id": "q30-12-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Hôm qua tôi đã đi bệnh viện khám bệnh):", "tokens": ["看病了", "去医院", "昨天", "我"], "answer": ["我", "昨天", "去医院", "看病了"], "acceptedSequences": [["我", "昨天", "去医院", "看病了"], ["昨天", "我", "去医院", "看病了"]], "explanation": "我昨天去医院看病了。", "relatedKnowledge": "Bài khóa 2", "section": "grammar"}, {"id": "q30-12-06", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.90–91] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "你怎么了？", "right": "我病了。"}, {"left": "你想喝点儿什么？", "right": "热水。"}, {"left": "你开车了？", "right": "对。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 12.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-12-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「生病」:", "options": ["shēngbìng", "shéngbìng", "sēngbìng", "shēngpìng"], "answer": "shēngbìng", "explanation": "生 thanh 1 (shēng) + 病 thanh 4 (bìng).", "relatedKnowledge": "Phát âm Bài 12", "section": "vocab"}, {"id": "q30-12-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「yǒudiǎnr」:", "options": ["有点儿", "一点儿", "天气", "看病"], "answer": "有点儿", "explanation": "有点儿 (hơi...) đứng trước tính từ.", "relatedKnowledge": "Mặt chữ Bài 12", "section": "vocab"}, {"id": "q30-12-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết bác sĩ khuyên Dương Đồng Lạc nghỉ bao lâu:", "audioText": "吃一点儿药，今天休息半天吧。回家后再喝些热水。", "options": ["Nghỉ nửa ngày (半天)", "Nghỉ 3 ngày", "Vẫn đi làm bình thường"], "answer": "Nghỉ nửa ngày (半天)", "explanation": "「今天休息半天吧」.", "relatedKnowledge": "Nghe hiểu Bài 12", "section": "listening"}, {"id": "q30-12-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Hôm qua tuyết rơi rồi, lạnh quá!\"", "sampleAnswer": "昨天下雪了，太冷了！", "acceptedAnswers": ["昨天下雪了太冷了", "昨天下雪了，太冷了", "昨天下雪了，太冷了！"], "requiredKeywords": ["昨天", "下雪", "太冷"], "explanation": "昨天下雪了，太冷了！", "relatedKnowledge": "Cấu trúc 太……了", "section": "writing"}, {"id": "q30-12-11", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Phân biệt đúng hai cụm từ dễ nhầm 「有点儿」 và 「一点儿」:", "options": ["「有点儿 + Tính từ」 (hơi...); 「Động từ + 一点儿 + Danh từ」 (một chút...)", "「一点儿 + Tính từ」 (hơi...); 「Động từ + 有点儿 + Danh từ」 (một chút...)", "Hai cụm từ dùng thay thế hoàn toàn cho nhau", "Cả hai đều chỉ đứng cuối câu"], "answer": "「有点儿 + Tính từ」 (hơi...); 「Động từ + 一点儿 + Danh từ」 (một chút...)", "explanation": "Ví dụ chuẩn Bài 12: 「雨有点儿大」 (Mưa hơi to) vs 「吃一点儿药」 (Uống một chút thuốc).", "relatedKnowledge": "Phân biệt 有点儿 và 一点儿 (Bài 12)"}, {"id": "q30-12-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 8", "prompt": "[Ôn Bài 8 + 12] Trong tiếng Trung, đi bệnh viện khám bệnh nói là 「去医院___」, uống thuốc nói là 「___药」, uống nước nóng nói là 「___热水」:", "options": ["看病 · 吃 · 喝", "看病 · 喝 · 吃", "生病 · 喝 · 喝", "医生 · 吃 · 吃"], "answer": "看病 · 吃 · 喝", "explanation": "Lưu ý cực quan trọng: Tiếng Trung dùng 「吃药」 (uống thuốc viên/thuốc nói chung), 「喝热水」 (uống nước nóng), và 「看病」 (khám bệnh).", "relatedKnowledge": "Kết hợp động từ chuẩn (Bài 8 & 12)"}, {"id": "q30-12-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Trong câu cảm thán 「太冷了！」, trợ từ 「了」 có vai trò gì?", "options": ["Chỉ hành động đã kết thúc trong quá khứ", "Đi kèm cấu trúc 「太 + Tính từ + 了！」 để nhấn mạnh cảm thán", "Dùng để đặt câu hỏi", "Thay thế cho chủ ngữ"], "answer": "Đi kèm cấu trúc 「太 + Tính từ + 了！」 để nhấn mạnh cảm thán", "explanation": "Cấu trúc khẳng định cảm thán luôn đi cặp 「太……了！」 (Lạnh quá đi mất!), còn phủ định 「不太冷」 thì KHÔNG có 「了」.", "relatedKnowledge": "Cấu trúc cảm thán 太……了！"}, {"id": "q30-12-14", "section": "grammar", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 10", "prompt": "[Ôn Bài 10 + 12] Khi muốn hỏi thời tiết hôm nay thế nào, câu nào ĐÚNG chuẩn Bài khóa 1?", "options": ["今天天气怎么？", "今天天气怎么样？", "今天天气多少？", "今天天气几？"], "answer": "今天天气怎么样？", "explanation": "Ôn đại từ 「怎么样」 (Bài 10) hỏi trạng thái/chất lượng: 「今天天气怎么样？」.", "relatedKnowledge": "Ôn Bài 10 (怎么样) + Bài 12 (天气)"}, {"id": "q30-12-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "杨同乐：医生，我病了。我很冷。\n胡医生：我看看。好的，吃一点儿药，今天休息半天吧。回家后再喝些热水。", "passagePinyin": "Yáng Tónglè: Yīshēng, wǒ bìng le. Wǒ hěn lěng. Hú yīshēng: Wǒ kànkan. Hǎo de, chī yìdiǎnr yào, jīntiān xiūxi bàntiān ba. Huíjiā hòu zài hē xiē rèshuǐ.", "prompt": "Bác sĩ Hồ dặn Dương Đồng Lạc làm những gì sau khi khám?", "options": ["Đi làm ngay lập tức ở công ty", "Uống một chút thuốc, nghỉ nửa ngày hôm nay, về nhà rồi uống thêm ít nước ấm", "Đi siêu thị mua táo", "Uống nước lạnh và ngủ nửa tiếng"], "answer": "Uống một chút thuốc, nghỉ nửa ngày hôm nay, về nhà rồi uống thêm ít nước ấm", "explanation": "Bác sĩ Hồ dặn: 「吃一点儿药，今天休息半天吧。回家后再喝些热水。」.", "relatedKnowledge": "Bài khóa 3 – Đi khám bác sĩ"}, {"id": "q30-12-16", "section": "reading", "type": "true_false", "points": 1, "prompt": "Câu 「昨天下雪了。」 là câu phi chủ vị (không cần chủ ngữ chỉ người/vật) để miêu tả hiện tượng thời tiết tự nhiên.", "answer": true, "explanation": "Đúng! Miêu tả mưa tuyết trong tiếng Trung dùng câu phi chủ vị: 「下雨了。」 / 「昨天下雪了。」.", "relatedKnowledge": "Câu phi chủ vị thời tiết"}, {"id": "q30-12-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 1 chữ Hán chỉ trình tự 'sau đó rồi mới': 回家后___喝些热水。(Về nhà rồi hãy uống ít nước nóng.)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["再"], "explanation": "「……后再 + Động từ」 biểu thị làm xong việc 1 rồi mới làm việc 2.", "relatedKnowledge": "Phó từ 再 chỉ trình tự"}, {"id": "q30-12-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 11", "prompt": "[Ôn Bài 11 + 12] Sắp xếp thành câu kể hôm qua đi bệnh viện khám bệnh:", "tokens": ["去医院", "我", "看病了", "昨天"], "answer": ["我", "昨天", "去医院", "看病了"], "acceptedSequences": [["我", "昨天", "去医院", "看病了"], ["昨天", "我", "去医院", "看病了"]], "explanation": "Kết hợp 「昨天」 (Bài 11) + câu liên động 「去医院看病」 + 「了」 (Bài 12).", "relatedKnowledge": "Ôn Bài 11 (昨天) + Bài 12 (了)"}, {"id": "q30-12-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "这里的天气不太好，下雨了，雨有点儿大，我觉得很冷。", "prompt": "Nghe đoạn âm thanh và chọn mô tả ĐÚNG về thời tiết:", "options": ["Trời nắng đẹp và ấm áp", "Trời mưa hơi to và người nói cảm thấy rất lạnh", "Hôm qua có tuyết rơi nhưng hôm nay trời nóng", "Mưa rất nhỏ"], "answer": "Trời mưa hơi to và người nói cảm thấy rất lạnh", "explanation": "Lời nghe: 「这里的天气不太好，下雨了，雨有点儿大，我觉得很冷。」.", "relatedKnowledge": "Nghe hiểu Bài 12"}, {"id": "q30-12-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 5 & 8", "audioText": "A：你昨天没来公司，生病了吗？ B：对，昨天下雪太冷了。我去医院看胡医生，今天在家休息半天。", "prompt": "[Ôn Bài 5, 8, 12] Nghe hội thoại và chọn thông tin ĐÚNG:", "options": ["Hôm qua B vẫn đến công ty làm việc", "Hôm qua trời có tuyết rất lạnh, B bị ốm đi khám bác sĩ Hồ và hôm nay nghỉ ở nhà nửa ngày", "B không bị ốm mà đi du lịch", "B đang làm việc ở bệnh viện"], "answer": "Hôm qua trời có tuyết rất lạnh, B bị ốm đi khám bác sĩ Hồ và hôm nay nghỉ ở nhà nửa ngày", "explanation": "Kết hợp 「休息」 (Bài 5), 「医院/胡医生」 (Bài 8), và 「公司/生病/下雪/半天」 (Bài 12).", "relatedKnowledge": "Nghe tổng hợp Bài 5, 8, 12"}, {"id": "q30-12-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Thời tiết hôm nay thế nào?", "sampleAnswer": "今天天气怎么样？", "pinyin": "Jīntiān tiānqì zěnmeyàng?", "acceptedAnswers": ["今天天气怎么样"], "requiredKeywords": ["今天", "天气", "怎么样"]}, {"vi": "Trời mưa rồi, tôi cảm thấy rất lạnh.", "sampleAnswer": "下雨了 chữ 十 trên đầu)."}, {"id": "g30-13-2", "title": "2. Câu có hai tân ngữ (双宾语句 1)", "formula": "Chủ ngữ + 给 / 问 + Tân ngữ 1 (Người) + Tân ngữ 2 (Vật/Nội dung)", "usage": "Động từ 给 và 问 nhận trực tiếp 2 tân ngữ: người nhận đứng trước, sự vật đứng sau.", "explanation": "Ví dụ: 请给我一杯牛奶。/ 我问老师两个问题。", "examples": [{"zh": "请给我一杯茶。", "pinyin": "Qǐng gěi wǒ yì bēi chá.", "vi": "Cho tôi một cốc trà."}, {"zh": "白家月给安妮一个苹果。", "pinyin": "Bái Jiāyuè gěi Ānnī yí gè píngguǒ.", "vi": "Bạch Gia Nguyệt đưa cho Annie một quả táo."}], "commonMistake": "Đảo vật lên trước người: '给我一杯茶' đúng, không nói '给一杯茶我'.", "comparison": "Nhớ công thức: 给/问 + Ai + Cái gì."}], "patterns": [{"zh": "我可以再问您一个问题吗？— 可以。", "pinyin": "Wǒ kěyǐ zài wèn nín yí gè wèntí ma? — Kěyǐ.", "vi": "Em có thể hỏi thêm cô một câu không ạ? — Được chứ."}, {"zh": "你可以打电话问一下。", "pinyin": "Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "vi": "Bạn có thể gọi điện hỏi thử xem."}, {"zh": "请给我一杯茶 / 一杯牛奶。", "pinyin": "Qǐng gěi wǒ yì bēi chá / yì bēi niúnǎi.", "vi": "Cho tôi một cốc trà / một cốc sữa."}, {"zh": "再要这个面包和鸡蛋吧。", "pinyin": "Zài yào zhège miànbāo hé jīdàn ba.", "vi": "Cho thêm cái bánh mì này và trứng gà nhé."}, {"zh": "40个太多了，我要一半吧。", "pinyin": "Sìshí gè tài duō le, wǒ yào yíbàn ba.", "vi": "40 cái nhiều quá, tôi lấy một nửa thôi."}], "exercises": [{"id": "q30-13-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "kěyǐ", "answer": "可以", "meaning": "Có thể, được (cho phép)"}, {"pinyin": "zài", "answer": "再", "meaning": "Lại, thêm lần nữa"}, {"pinyin": "wèntí", "answer": "问题", "meaning": "Câu hỏi, vấn đề"}, {"pinyin": "mài", "answer": "卖", "meaning": "Bán"}, {"pinyin": "dǎ diànhuà", "answer": "打电话", "meaning": "Gọi điện thoại"}, {"pinyin": "yíxià", "answer": "一下", "meaning": "Một chút, thử (sau động từ)"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 13.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 13"}, {"id": "q30-13-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Mời, xin, hãy"}, {"key": "B", "label": "Bữa sáng"}, {"key": "C", "label": "Ly, cốc, tách"}, {"key": "D", "label": "Bà, cô, quý cô"}, {"key": "E", "label": "Đưa cho, cho"}, {"key": "F", "label": "Nhân viên phục vụ"}], "items": [{"hanzi": "服务员", "pinyin": "fúwùyuán", "answerKey": "F"}, {"hanzi": "女士", "pinyin": "nǚshì", "answerKey": "D"}, {"hanzi": "请", "pinyin": "qǐng", "answerKey": "A"}, {"hanzi": "给", "pinyin": "gěi", "answerKey": "E"}, {"hanzi": "杯", "pinyin": "bēi", "answerKey": "C"}, {"hanzi": "早饭", "pinyin": "zǎofàn", "answerKey": "B"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 13.", "relatedKnowledge": "Từ mới Bài 13"}, {"id": "q30-13-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.101] 请 ___ 我一杯热水。(一下 / 可以 / 给 / 问题 / 要)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["给"], "explanation": "Câu hai tân ngữ: 请给我一杯热水。", "relatedKnowledge": "Câu hai tân ngữ 给", "section": "writing"}, {"id": "q30-13-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.101] A: 我 ___ 坐这儿吗？ B: 没问题，请坐。", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["可以"], "explanation": "Dùng 「可以」 để xin phép.", "relatedKnowledge": "Động từ năng nguyện 可以", "section": "writing"}, {"id": "q30-13-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.101] 爸爸今天在家里工作，我们不要去他的房间。★ 爸爸今天：", "options": ["在家里工作", "做了面条儿", "不能去公司"], "answer": "在家里工作", "explanation": "Câu nêu rõ 「爸爸今天在家里工作」.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-13-04", "type": "true_false", "points": 1, "prompt": "Trong tiếng Trung, chữ 「卖」 (mài – bán) khác chữ 「买」 (mǎi – mua) ở nét chữ 「十」 phía trên.", "answer": true, "explanation": "Đúng. 买 = mua, 卖 = bán.", "relatedKnowledge": "Phân biệt mặt chữ 买/卖", "section": "grammar"}, {"id": "q30-13-05", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu hai tân ngữ đúng (Cho tôi một cốc trà):", "tokens": ["一杯茶", "我", "请给"], "answer": ["请给", "我", "一杯茶"], "acceptedSequences": [["请给", "我", "一杯茶"]], "explanation": "请给我一杯茶。", "relatedKnowledge": "Câu hai tân ngữ", "section": "grammar"}, {"id": "q30-13-06", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.100] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "那里卖不卖手机？", "right": "不知道。"}, {"left": "我会写了，谢谢老师。", "right": "不客气。"}, {"left": "你要什么？", "right": "一个面包。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 13.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-13-07", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「服务员」:", "options": ["fúwùyuán", "fǔwùyuán", "fúwūyuán", "húwùyuán"], "answer": "fúwùyuán", "explanation": "服 (fú) + 务 (wù) + 员 (yuán).", "relatedKnowledge": "Phát âm Bài 13", "section": "vocab"}, {"id": "q30-13-08", "type": "hanzi_for_pinyin", "points": 1, "prompt": "Chọn chữ Hán đúng cho 「jīdàn」:", "options": ["鸡蛋", "面包", "早饭", "问题"], "answer": "鸡蛋", "explanation": "鸡蛋 (jīdàn) = trứng gà.", "relatedKnowledge": "Mặt chữ Bài 13", "section": "vocab"}, {"id": "q30-13-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết Lưu Minh cuối cùng gọi bao nhiêu chiếc sủi cảo:", "audioText": "一斤饺子40个。40个太多了，我要一半吧。", "options": ["40 cái", "20 cái (nửa cân)", "10 cái"], "answer": "20 cái (nửa cân)", "explanation": "Một nửa của 40 cái là 20 cái (半斤20个).", "relatedKnowledge": "Nghe hiểu Bài 13", "section": "listening"}, {"id": "q30-13-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Để tôi xem một chút.\"", "sampleAnswer": "我看一下。", "acceptedAnswers": ["我看一下", "我看一下。"], "requiredKeywords": ["我", "看", "一下"], "explanation": "我看一下。", "relatedKnowledge": "Cấu trúc V + 一下", "section": "writing"}, {"id": "q30-13-11", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 6", "prompt": "[Ôn Bài 6 + 13] Phân biệt cặp chữ Hán gần giống nhau 「买 (mǎi)」 và 「卖 (mài)」:", "options": ["买 = Mua (thanh 3); 卖 = Bán (thanh 4)", "买 = Bán (thanh 4); 卖 = Mua (thanh 3)", "Cả hai đều có nghĩa là Mua", "买 = Uống; 卖 = Ăn"], "answer": "买 = Mua (thanh 3); 卖 = Bán (thanh 4)", "explanation": "「买 (mǎi)」 (Bài 6) = mua; 「卖 (mài)」 (Bài 13, thêm bộ thập 十 ở trên) = bán (như 「那个小店卖不卖手机？」).", "relatedKnowledge": "Phân biệt cặp từ 买 (B6) – 卖 (B13)"}, {"id": "q30-13-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 6 & 8", "prompt": "[Ôn Bài 6, 8, 13] Hệ thống đủ 3 bữa ăn trong ngày bằng tiếng Trung là:", "options": ["早饭 (sáng) – 午饭 (trưa) – 晚饭 (tối)", "晚饭 (sáng) – 早饭 (trưa) – 午饭 (tối)", "午饭 (sáng) – 晚饭 (trưa) – 早饭 (tối)", "早饭 (tối) – 午饭 (chiều) – 晚饭 (sáng)"], "answer": "早饭 (sáng) – 午饭 (trưa) – 晚饭 (tối)", "explanation": "「晚饭」 (Bài 6), 「午饭」 (Bài 8), 「早饭」 (Bài 13) ghép thành đủ 3 bữa ăn trong ngày.", "relatedKnowledge": "Tổng hợp từ vựng 3 bữa ăn (Bài 6, 8, 13)"}, {"id": "q30-13-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Cấu trúc câu có hai tân ngữ (双宾语句) với động từ 「给」 nào sau đây viết ĐÚNG trật tự?", "options": ["请给一杯茶我。", "请给我一杯茶。", "我一杯茶请给。", "请一杯茶给我。"], "answer": "请给我一杯茶。", "explanation": "Động từ 「给」 nhận tân ngữ chỉ NGƯỜI (我) trước, tân ngữ chỉ VẬT (一杯茶) sau: 「请给我一杯茶。」.", "relatedKnowledge": "Câu hai tân ngữ (双宾语句)"}, {"id": "q30-13-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Trong câu 「你可以打电话问一下。」, thêm 「一下」 sau động từ 「问」 mang tác dụng gì?", "options": ["Chỉ hành động kéo dài nhiều giờ", "Làm cho ngữ khí nhẹ nhàng, tự nhiên, mang nghĩa 'một chút / thử xem'", "Biến câu thành câu phủ định", "Biểu thị hành động xảy ra hôm qua"], "answer": "Làm cho ngữ khí nhẹ nhàng, tự nhiên, mang nghĩa 'một chút / thử xem'", "explanation": "「Động từ + 一下」 (我看一下, 问一下) giúp lời nói lịch sự, mềm mại hơn, diễn tả động tác ngắn.", "relatedKnowledge": "Cấu trúc Động từ + 一下"}, {"id": "q30-13-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "刘明：我要一斤饺子。\n服务员：好的。一斤饺子40个。\n刘明：40个太多了，我要一半吧。请给我一杯茶吧。", "passagePinyin": "Liú Míng: Wǒ yào yì jīn jiǎozi. Fúwùyuán: Hǎo de. Yì jīn jiǎozi sìshí gè. Liú Míng: Sìshí gè tài duō le, wǒ yào yíbàn ba. Qǐng gěi wǒ yì bēi chá ba.", "prompt": "Cuối cùng Lưu Minh gọi bao nhiêu chiếc sủi cảo và đồ uống gì?", "options": ["40 chiếc sủi cảo và 1 cốc sữa", "20 chiếc sủi cảo (một nửa cân) và 1 cốc trà", "10 chiếc sủi cảo và 1 cốc nước nóng", "40 chiếc sủi cảo và 1 cốc trà"], "answer": "20 chiếc sủi cảo (một nửa cân) và 1 cốc trà", "explanation": "1 cân là 40 chiếc, Lưu Minh nói 「40个太多了，我要一半吧」 (một nửa = 20 chiếc) và 「请给我一杯茶吧」.", "relatedKnowledge": "Bài khóa 3 – Gọi món tại quán ăn"}, {"id": "q30-13-16", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 11", "prompt": "[Ôn Bài 11 + 13] Trong câu 「那个小店卖不卖手机？」, người nói đã sử dụng câu hỏi chính phản (Bài 11) với động từ 「卖」 (Bài 13).", "answer": true, "explanation": "Đúng! 「卖不卖」 là dạng câu hỏi chính phản (V不V) đã học ở Bài 11, kết hợp với 「手机」 (Bài 6) và 「小店」 (Bài 7).", "relatedKnowledge": "Ôn Bài 11 (正反问) trong Bài 13"}, {"id": "q30-13-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 2 chữ Hán xin phép lịch sự: 王老师，我___再问您一个问题吗？(Thưa cô Vương, em có thể hỏi cô thêm một câu nữa không?)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["可以"], "explanation": "「可以 (kěyǐ)」 dùng để xin phép hoặc cho phép ('có thể / được phép').", "relatedKnowledge": "Động từ năng nguyện 可以"}, {"id": "q30-13-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 6", "prompt": "[Ôn Bài 6 + 13] Sắp xếp thành câu gọi bữa sáng tại quán:", "tokens": ["牛奶", "请", "一杯", "给我"], "answer": ["请", "给我", "一杯", "牛奶"], "acceptedSequences": [["请", "给我", "一杯", "牛奶"]], "explanation": "「请给我一杯牛奶。」 (Làm ơn cho tôi một cốc sữa.) — ôn từ 「牛奶」 (Bài 6) với câu hai tân ngữ Bài 13.", "relatedKnowledge": "Ôn Bài 6 (牛奶) + Bài 13 (请给我...)"}, {"id": "q30-13-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "女士，请坐！您喝什么？请给我一杯牛奶，再要这个面包和鸡蛋吧。", "prompt": "Nghe đoạn gọi món và chọn những thứ vị khách nữ gọi:", "options": ["Trà và sủi cảo", "Một cốc sữa, bánh mì và trứng gà", "Nước nóng và cơm trắng", "Bánh bao và mì sợi"], "answer": "Một cốc sữa, bánh mì và trứng gà", "explanation": "Lời nghe: 「请给我一杯牛奶，再要这个面包和鸡蛋吧。」.", "relatedKnowledge": "Nghe hiểu Bài 13"}, {"id": "q30-13-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 10 & 12", "audioText": "A：先生，您还没吃早饭吧？天气太冷了，喝一杯热茶吧！ B：谢谢！请再给我一半饺子。", "prompt": "[Ôn Bài 10, 12, 13] Nghe hội thoại và chọn thông tin ĐÚNG:", "options": ["Vị khách đã ăn sáng rồi", "Trời rất lạnh, nhân viên mời trà nóng và vị khách gọi thêm nửa suất sủi cảo", "Vị khách muốn mua táo và quần áo", "Vị khách bị ốm cần uống thuốc"], "answer": "Trời rất lạnh, nhân viên mời trà nóng và vị khách gọi thêm nửa suất sủi cảo", "explanation": "Kết hợp 「天气太冷了 / 热」 (Bài 12), 「饺子」 (Bài 5) và 「先生 / 早饭 / 一杯茶 / 一半」 (Bài 13).", "relatedKnowledge": "Nghe tổng hợp Bài 10, 12, 13"}, {"id": "q30-13-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Thưa cô Vương, em có thể hỏi cô thêm một câu hỏi nữa không?", "sampleAnswer": "王老师，我可以再问您一个问题吗？", "pinyin": "Wáng lǎoshī, wǒ kěyǐ zài wèn nín yí gè wèntí ma?", "acceptedAnswers": ["王老师我可以再问您一个问题吗", "王老师我可以再问你一个问题吗"], "requiredKeywords": ["可以", "问", "问题"]}, {"vi": "Bạn có thể gọi điện thoại hỏi thử một chút.", "sampleAnswer": "你可以打电话问一下。", "pinyin": "Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "acceptedAnswers": ["你可以打电话问一下"], "requiredKeywords": ["可以", "打电话", "问一下"]}, {"vi": "Làm ơn cho tôi một cốc trà.", "sampleAnswer": "请给我一杯茶。", "pinyin": "Qǐng gěi wǒ yì bēi chá.", "acceptedAnswers": ["请给我一杯茶", "请给我一杯茶吧"], "requiredKeywords": ["请", "给我", " men jiā yǒule yí gè zhōngxuéshēng.", "vi": "Sang năm con gái lên trung học. Nhà mình có một học sinh trung học rồi."}, {"speaker": "Vương Nhất Tuyết", "side": "right", "zh": "对。儿子也上小学了。太晚了，睡觉吧。", "pinyin": "Duì. Érzi yě shàng xiǎoxué le. Tài wǎn le, shuìjiào ba.", "vi": "Đúng vậy. Con trai cũng lên tiểu học. Muộn quá rồi, đi ngủ thôi."}]}], "grammar": [{"id": "g30-14-1", "title": "1. Trợ từ động thái 了 (2) & Từ li hợp (离合词)", "formula": "V + 了 + Tân ngữ (Phủ định dùng 没 và bỏ 了) | Từ li hợp: 睡觉 → 睡了一觉, 上课 → 上了课, 说话 → 说了话", "usage": "Khi từ li hợp (上课, 下班, 睡觉, 生病, 说话) kết hợp với 了 hoặc số lượng, các thành phần đó chen VÀO GIỮA hai chữ.", "explanation": "Ví dụ tr.106: 睡了一觉 / 上中文课 / 生了大病 / 说了很多话.", "examples": [{"zh": "我看了一个电影。", "pinyin": "Wǒ kànle yí gè diànyǐng.", "vi": "Mình đã xem một bộ phim."}, {"zh": "我昨天没去商店买东西。", "pinyin": "Wǒ zuótiān méi qù shāngdiàn mǎi dōngxi.", "vi": "Hôm qua mình đã không đi cửa hàng mua đồ."}], "commonMistake": "Viết '睡觉了一觉' (SAI). Phải tách thành '睡了一觉'.", "comparison": "Phủ định quá khứ với 没 thì KHÔNG dùng 了."}, {"id": "g30-14-2", "title": "2. Phó từ phạm vi 都 (dōu) & Phân biệt 他们 / 她们 / 它们", "formula": "Đối tượng bao quát + 都 + (Không/Chưa) + Vị ngữ", "usage": "Đối tượng bao quát đứng TRƯỚC 都; từ phủ định đứng SAU 都 (同学们都没听见).", "explanation": "Ba đại từ cùng đọc tāmen: 他们 (nam/hỗn hợp), 她们 (nữ), 它们 (đồ vật/động vật).", "examples": [{"zh": "同学们都没听见。", "pinyin": "Tóngxuémen dōu méi tīngjiàn.", "vi": "Các bạn học đều không nghe thấy."}], "commonMistake": "Đặt 都 trước chủ ngữ (SAI).", "comparison": "都不 (đều không) khác với 不都 (không phải tất cả đều)."}], "patterns": [{"zh": "我看了一个电影。", "pinyin": "Wǒ kànle yí gè diànyǐng.", "vi": "Mình đã xem một bộ phim."}, {"zh": "请大家不要说话！", "pinyin": "Qǐng dàjiā búyào shuōhuà!", "vi": "Mọi người đừng nói chuyện!"}, {"zh": "我们都会写这些汉字了。", "pinyin": "Wǒmen dōu huì xiě zhèxiē Hànzì le.", "vi": "Chúng em đều biết viết những chữ Hán này rồi."}, {"zh": "明年女儿上中学，儿子上小学。", "pinyin": "Míngnián nǚ'ér shàng zhōngxué, érzi shàng xiǎoxué.", "vi": "Sang năm con gái lên trung học, con trai lên tiểu học."}, {"zh": "太晚了，睡觉吧。", "pinyin": "Tài wǎn le, shuìjiào ba.", "vi": "Muộn quá rồi, đi ngủ thôi."}], "exercises": [{"id": "q30-14-p2h", "section": "vocab", "type": "pinyin_to_hanzi_write", "points": 1, "prompt": "Nhìn pinyin, viết chữ Hán vào ô trống (gõ bằng bàn phím tiếng Trung).", "items": [{"pinyin": "shàng", "answer": "上", "meaning": "Lên (xe, tàu) / Học (cấp học)"}, {"pinyin": "huǒchē", "answer": "火车", "meaning": "Tàu hỏa, xe lửa"}, {"pinyin": "zhōngwǔ", "answer": "中午", "meaning": "Buổi trưa"}, {"pinyin": "kāi", "answer": "开", "meaning": "Lái, chạy, khởi hành"}, {"pinyin": "yǒuxiē", "answer": "有些", "meaning": "Có một số (cũng nói 有的)"}, {"pinyin": "xiě", "answer": "写", "meaning": "Viết"}], "explanation": "Luyện ghi nhớ mặt chữ Hán của 6 từ vựng cốt lõi trong Bài 14.", "relatedKnowledge": "Nhớ mặt chữ Hán Bài 14"}, {"id": "q30-14-mbs", "section": "vocab", "type": "meaning_bank_select", "points": 1, "prompt": "Chọn nghĩa tiếng Việt đúng cho từ (mỗi nghĩa dùng một lần).", "bank": [{"key": "A", "label": "Những... nào"}, {"key": "B", "label": "Nghe"}, {"key": "C", "label": "Đều"}, {"key": "D", "label": "Đừng, không được"}, {"key": "E", "label": "Nói chuyện"}, {"key": "F", "label": "Nghe thấy"}], "items": [{"hanzi": "都", "pinyin": "dōu", "answerKey": "C"}, {"hanzi": "听见", "pinyin": "tīngjiàn", "answerKey": "F"}, {"hanzi": "不要", "pinyin": "búyào", "answerKey": "D"}, {"hanzi": "说话", "pinyin": "shuōhuà", "answerKey": "E"}, {"hanzi": "听", "pinyin": "tīng", "answerKey": "B"}, {"hanzi": "哪些", "pinyin": "nǎxiē", "answerKey": "A"}], "explanation": "Khớp đúng mặt chữ Hán với nghĩa tiếng Việt theo bảng từ mới Bài 14.", "relatedKnowledge": "Từ mới Bài 14"}, {"id": "q30-14-01", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.110] 我写 ___ 很多汉字。(上学 / 了 / 都 / 听见 / 有的)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["了"], "explanation": "Trợ từ động thái 「了」 sau động từ 「写」.", "relatedKnowledge": "Trợ từ động thái 了 (2)", "section": "writing"}, {"id": "q30-14-02", "type": "fill_blank", "points": 1, "prompt": "[SGK tr.110] 他没 ___ 老师说什么。(上学 / 了 / 都 / 听见 / 有的)", "placeholder": "Nhập 2 chữ Hán...", "acceptedAnswers": ["听见"], "explanation": "没听见 = không nghe thấy.", "relatedKnowledge": "Từ mới Bài 14", "section": "writing"}, {"id": "q30-14-03", "type": "single_choice", "points": 1, "prompt": "[Sổ tay tr.110] 儿子和女儿都上小学了，他们会写很多字了。★ 说话人的两个孩子是：", "options": ["小学生", "中学生", "大学生"], "answer": "小学生", "explanation": "Cả hai đều lên tiểu học -> 「小学生」.", "relatedKnowledge": "Đọc hiểu HSK 3.0", "section": "reading"}, {"id": "q30-14-04", "type": "single_choice", "points": 1, "prompt": "Theo quy tắc từ li hợp (SGK tr.106), cách tách ĐÚNG của 「睡觉」 khi thêm 「了一觉」 là:", "options": ["睡觉了一觉", "睡了一觉", "了一觉睡觉", "睡一觉了"], "answer": "睡了一觉", "explanation": "「睡觉」 là từ li hợp, phải tách thành 「睡 + 了 + 一 + 觉」.", "relatedKnowledge": "Từ li hợp (1)", "section": "grammar"}, {"id": "q30-14-05", "type": "true_false", "points": 1, "prompt": "Ba đại từ 「他们」, 「她们」, 「它们」 đều đọc là 「tāmen」 nhưng lần lượt chỉ nam/chung, nữ và đồ vật/động vật.", "answer": true, "explanation": "Đúng (mục Tiểu Ngữ giúp sức tr.109).", "relatedKnowledge": "Đại từ số nhiều", "section": "grammar"}, {"id": "q30-14-06", "type": "word_order", "points": 1, "prompt": "Sắp xếp thành câu đúng (Mình đã xem một bộ phim):", "tokens": ["电影", "一个", "看了", "我"], "answer": ["我", "看了", "一个", "电影"], "acceptedSequences": [["我", "看了", "一个", "电影"]], "explanation": "我看了一个电影。", "relatedKnowledge": "Tiêu đề Bài 14", "section": "grammar"}, {"id": "q30-14-07", "type": "matching", "points": 1, "prompt": "[Sổ tay tr.108–109] Nối câu hỏi với câu trả lời đúng:", "pairs": [{"left": "谁去学校了？", "right": "我们都去了。"}, {"left": "你下午没去医院吗？", "right": "是的，我睡了一觉。"}, {"left": "你今天上午都忙了些什么？", "right": "写字、看书、吃饭。"}], "explanation": "Khớp Phần 2 Đọc hiểu Sổ tay Bài 14.", "relatedKnowledge": "Nối câu HSK 3.0", "section": "vocab"}, {"id": "q30-14-08", "type": "pinyin_for_hanzi", "points": 1, "prompt": "Chọn Pinyin đúng của 「说话」:", "options": ["shuōhuà", "suōhuà", "shuóhuà", "shuōhuá"], "answer": "shuōhuà", "explanation": "说 thanh 1 (shuō) + 话 thanh 4 (huà).", "relatedKnowledge": "Phát âm Bài 14", "section": "vocab"}, {"id": "q30-14-09", "type": "listening_choice", "points": 1, "prompt": "Nghe và cho biết Trần Thiên Trung đã làm gì trên tàu:", "audioText": "中午车开后，有些人在看书，有些人睡觉了，我看了一个电影。", "options": ["Đọc sách", "Ngủ", "Xem một bộ phim"], "answer": "Xem một bộ phim", "explanation": "「我看了一个电影」.", "relatedKnowledge": "Nghe hiểu Bài 14", "section": "listening"}, {"id": "q30-14-10", "type": "translate_vi_zh", "points": 1, "prompt": "Dịch sang tiếng Trung: \"Mọi người đừng nói chuyện!\"", "sampleAnswer": "请大家不要说话！", "acceptedAnswers": ["大家不要说话", "大家不要说话！", "请大家不要说话", "请大家不要说话！"], "requiredKeywords": ["大家", "不要", "说话"], "explanation": "请大家不要说话！", "relatedKnowledge": "Bài khóa 2", "section": "writing"}, {"id": "q30-14-11", "section": "vocab", "type": "single_choice", "points": 1, "prompt": "Phân biệt đúng 3 đại từ số nhiều ngôi thứ 3 cùng đọc là 「tāmen」:", "options": ["他们 (nam/nhóm hỗn hợp) – 她们 (toàn nữ) – 它们 (đồ vật/động vật)", "她们 (nam) – 他们 (đồ vật) – 它们 (nữ)", "它们 (người lớn) – 他们 (học sinh) – 她们 (giáo viên)", "Ba chữ viết khác nhau nhưng dùng thế nào cũng được"], "answer": "他们 (nam/nhóm hỗn hợp) – 她们 (toàn nữ) – 它们 (đồ vật/động vật)", "explanation": "Mở rộng từ 「他/她/它」 (Bài 3–5) + hậu tố 「们」 (Bài 1): 「他们 / 她们 / 它们」.", "relatedKnowledge": "Phân biệt 他们 / 她们 / 它们"}, {"id": "q30-14-12", "section": "vocab", "type": "single_choice", "points": 1, "reviewTag": "Ôn Bài 4 & 11", "prompt": "[Ôn Bài 4, 11, 14] Sắp xếp 3 cấp học theo đúng thứ tự từ nhỏ đến lớn:", "options": ["小学 (tiểu học) → 中学 (trung học) → 大学 (đại học)", "中学 → 小学 → 大学", "大学 → 中学 → 小学", "小学 → 大学 → 中学"], "answer": "小学 (tiểu học) → 中学 (trung học) → 大学 (đại học)", "explanation": "「大学/大学生」 học ở Bài 11; Bài 14 hoàn thiện đủ hệ thống 「小学/小学生 → 中学/中学生 → 大学/大学生」.", "relatedKnowledge": "Hệ thống cấp học Bài 11 & 14"}, {"id": "q30-14-13", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Trong câu với phó từ phạm vi 「都 (đều)」, vị trí nào viết ĐÚNG ngữ pháp?", "options": ["都我们会写汉字了。", "我们都会写汉字了。", "我们会写都汉字了。", "我们写汉字都会了。"], "answer": "我们都会写汉字了。", "explanation": "Phó từ 「都」 luôn đứng SAU chủ ngữ số nhiều và TRƯỚC động từ/động từ năng nguyện: 「我们都会写汉字了。」.", "relatedKnowledge": "Vị trí phó từ phạm vi 都"}, {"id": "q30-14-14", "section": "grammar", "type": "single_choice", "points": 1, "prompt": "Khi muốn nhắc nhở lịch sự cả lớp 'Xin mọi người đừng nói chuyện!', ta dùng cấu trúc nào?", "options": ["请大家不要说话！", "请大家没有说话！", "请大家不说话吗！", "请大家说话不要！"], "answer": "请大家不要说话！", "explanation": "「不要 + Động từ」 dùng trong câu cầu khiến biểu thị khuyên ngăn/cấm đoán ('đừng...').", "relatedKnowledge": "Câu cầu khiến với 不要"}, {"id": "q30-14-15", "section": "reading", "type": "reading_comp", "points": 1, "passageZh": "白家月：你们上火车后看见王老师了吗？\n陈天中：没看见。中午车开后，有些人在看书，有些人睡觉了。我看了一个电影。", "passagePinyin": "Bái Jiāyuè: Nǐmen shàng huǒchē hòu kànjiàn Wáng lǎoshī le ma? Chén Tiānzhōng: Méi kànjiàn. Zhōngwǔ chē kāi hòu, yǒuxiē rén zài kànshū, yǒuxiē rén shuìjiào le. Wǒ kàn le yí gè diànyǐng.", "prompt": "Sau khi tàu hỏa khởi hành vào buổi trưa, Trần Thiên Trung đã làm gì?", "options": ["Nói chuyện với cô giáo Vương", "Đọc một quyển sách tiếng Trung", "Ngủ suốt chuyến đi", "Xem một bộ phim"], "answer": "Xem một bộ phim", "explanation": "Trần Thiên Trung nói: 「没看见。…我看了一个电影。」.", "relatedKnowledge": "Bài khóa 1 – Trợ từ động thái 了"}, {"id": "q30-14-16", "section": "reading", "type": "true_false", "points": 1, "reviewTag": "Ôn Bài 12", "prompt": "[Ôn Bài 12 + 14] Trong câu phủ định một hành động đã xảy ra như 「我没看见王老师。」, ta dùng 「没」 và KHÔNG thêm 「了」 sau động từ.", "answer": true, "explanation": "Đúng! Quy tắc quan trọng của HSK 1: Khẳng định có thể dùng 「V + 了」 (「我看了一个电影」), nhưng phủ định quá khứ dùng 「没 + V」 và bỏ 「了」 (「我没看见」).", "relatedKnowledge": "Phủ định của 了 (Bài 12 & 14)"}, {"id": "q30-14-17", "section": "writing", "type": "fill_blank", "points": 1, "prompt": "Điền 1 chữ Hán trợ từ động thái chỉ hoàn thành: 我看___一个电影。(Tôi đã xem một bộ phim.)", "placeholder": "Nhập 1 chữ Hán...", "acceptedAnswers": ["了"], "explanation": "Trợ từ động thái 「了」 đặt ngay sau động từ khi tân ngữ có định ngữ số lượng (「一个电影」).", "relatedKnowledge": "Trợ từ động thái 了 (2)"}, {"id": "q30-14-18", "section": "writing", "type": "word_order", "points": 1, "reviewTag": "Ôn Bài 5", "prompt": "[Ôn Bài 5 + 14] Sắp xếp thành câu nói về khả năng viết chữ Hán của cả lớp:", "tokens": ["会", "写汉字了", "都", "我们"], "answer": ["我们", "都", "会", "写汉字了"], "acceptedSequences": [["我们", "都", "会", "写汉字了"]], "explanation": "Trật tự: Chủ ngữ (我们) + 都 + 会 (Bài 5) + 写汉字了 (Bài 14).", "relatedKnowledge": "Ôn Bài 5 (会) + Bài 14 (都 / 了)"}, {"id": "q30-14-19", "section": "listening", "type": "listening_choice", "points": 1, "audioText": "明年女儿上中学，儿子也上小学了。太晚了，大家睡觉吧。", "prompt": "Nghe đoạn âm thanh và chọn thông tin ĐÚNG về hai người con:", "options": ["Sang năm con gái vào đại học", "Sang năm con gái học trung học, còn con trai học tiểu học rồi", "Cả hai đều đang học tiểu học", "Hai bạn nhỏ đang đi tàu hỏa"], "answer": "Sang năm con gái học trung học, còn con trai học tiểu học rồi", "explanation": "Lời nghe: 「明年女儿上中学，儿子也上小学了。」.", "relatedKnowledge": "Nghe hiểu Bài 14"}, {"id": "q30-14-20", "section": "listening", "type": "listening_choice", "points": 1, "reviewTag": "Ôn Bài 1 & 11", "audioText": "A：同学们，请不要说话！你们都会写哪些汉字了？ B：王老师，我们都会写'汉语'和'学生'了。", "prompt": "[Ôn Bài 1, 11, 14] Nghe hội thoại trong lớp và chọn ý đúng:", "options": ["Cô Vương yêu cầu học sinh đọc báo", "Cô Vương nhắc cả lớp giữ trật tự và hỏi các em đã biết viết những chữ Hán nào", "Học sinh nói chưa biết viết chữ nào", "Lớp học đã tan học"], "answer": "Cô Vương nhắc cả lớp giữ trật tự và hỏi các em đã biết viết những chữ Hán nào", "explanation": "Kết hợp 「同学们 / 王老师 / 学生」 (Bài 1) với 「不要说话 / 都 / 哪些汉字」 (Bài 14).", "relatedKnowledge": "Nghe tổng hợp Bài 1, 11, 14"}, {"id": "q30-14-trb", "section": "writing", "type": "translate_batch_vi_zh", "points": 1, "prompt": "翻译成中文。— Dịch các câu sau sang tiếng Trung (viết bằng chữ Hán).", "items": [{"vi": "Tôi đã xem một bộ phim.", "sampleAnswer": "我看了一个电影。", "pinyin": "Wǒ kàn le yí gè diànyǐng.", "acceptedAnswers": ["我看了一个电影"], "requiredKeywords": ["看了", "电影"]}, {"vi": "Xin mọi người đừng nói chuyện!", "sampleAnswer": "请大家不要说话！", "pinyin": "Qǐng dàjiā búyào shuōhuà!", "acceptedAnswers": ["请大家不要说话"], "requiredKeywords": ["请", "大家", "不要", "说话"]}, {"vi": "Chúng em đều biết viết chữ Hán rồi.", "sampleAnswer": "我们都会写汉字了。", "pinyin": "Wǒmen dōu huì xiě Hànzì le.", "acceptedAnswers": ["我们都会写汉字了"], "requiredKeywords": ["都", "会", "写", "汉字"]}, {"vi": "Sang năm con gái lên trung học, con trai cũng học tiểu học rồi.", "sampleAnswer": "明年女儿上中学，儿子也上小学了。", "pinyin": "Míngnián nǚ'ér shàng zhōngxué, érzi yě shàng xiǎoxué le.", "acceptedAnswers": ["明年女儿上中学儿子也上小学了"], "requiredKeywords": ["明年", "中学", "小学"]}, {"vi": "[Ôn Bài 8 & 11] Sau khi lên tàu hỏa, có người đang đọc sách, có người ngủ rồi.", "sampleAnswer": "上火车后，有些人在看书，有些人睡觉了。", "pinyin": "Shàng huǒchē hòu, yǒuxiē rén zài kànshū, yǒuxiē rén shuìjiào le.", "acceptedAnswers": ["上火车后有些人在看书有些人睡觉了", "上火车后有的人在看书有的人睡觉了"], "requiredKeywords": ["火车", "看书", "睡觉"]}], "explanation": "Luyện dịch câu hoàn chỉnh Việt → Trung vận dụng từ mới và ngữ pháp Bài 14 kết hợp ôn bài cũ.", "relatedKnowledge": "Viết câu & Dịch Việt → Trung Bài 14"}]}, {"id": "hsk1-15", "courseId": "hsk1", "order": 15, "group": "Bài 11–15", "zhTitle": "大兴机场见！", "pinyinTitle": "Dàxīng Jīchǎng jiàn!", "viTitle": "Hẹn gặp ở sân bay Đại Hưng!", "image": "images/hsk1-lesson15.jpg", "estimatedMinutes": 40, "summary": "Bài 15 Giáo trình New HSK 1 (HSK 3.0): Kế hoạch du lịch Tây An – Bắc Kinh, sân bay Đại Hưng và câu ghép đẳng lập ……，还/也…….", "vocabulary": [{"id": "v30-15-01", "hanzi": "爱", "pinyin": "ài", "pos": "Động từ", "meaning": "Thích   function parseSheetExerciseRow(row) {
    const t = String(row.type || 'single_choice').trim();
    const optRaw = String(row.options_or_json || '').trim();
    const ansRaw = String(row.answer_or_json || '').trim();
    if (['matching', 'pinyin_to_hanzi_write', 'meaning_bank_select', 'translate_batch_vi_zh'].includes(t) && optRaw.startsWith('{')) {
      try {
        const parsed = JSON.parse(optRaw);
        return {
          ...parsed,
          id: String(row.id || parsed.id || ('sh-' + Date.now())),
          section: String(row.section || parsed.section || 'grammar'),
          type: t,
          prompt: String(row.prompt || parsed.prompt || ''),
          explanation: String(row.explanation || parsed.explanation || ''),
          relatedKnowledge: String(row.relatedKnowledge || parsed.relatedKnowledge || ''),
          reviewTag: row.reviewTag ? String(row.reviewTag) : parsed.reviewTag
        };
      } catch (e) {}
    }
    const base = {
      id: String(row.id || ('sh-' + Math.random().toString(36).slice(2, 8))),
      section: String(row.section || 'grammar'),
      type: t,
      points: 1,
      prompt: String(row.prompt || ''),
      explanation: String(row.explanation || ''),
      relatedKnowledge: String(row.relatedKnowledge || '')
    };
    if (row.reviewTag) base.reviewTag = String(row.reviewTag);
    if (row.audioText) base.audioText = String(row.audioText);
    if (['single_choice', 'pinyin_for_hanzi', 'hanzi_for_pinyin', 'listening_choice', 'reading_comp', 'multiple_choice'].includes(t)) {
      base.options = optRaw.split('|').map(s => s.trim()).filter(Boolean);
      base.answer = t === 'multiple_choice' ? (ansRaw.startsWith('[') ? JSON.parse(ansRaw) : ansRaw.split('|').map(s => s.trim())) : ansRaw;
    } else if (t === 'true_false') {
      base.answer = ansRaw.toUpperCase() === 'TRUE' || ansRaw === 'Đúng';
    } else if (t === 'fill_blank') {
      base.placeholder = optRaw || 'Nhập đáp án...';
      base.acceptedAnswers = ansRaw.split('|').map(s => s.trim()).filter(Boolean);
    } else if (t === 'word_order') {
      base.tokens = optRaw.split('|').map(s => s.trim()).filter(Boolean);
      base.answer = ansRaw.split('|').map(s => s.trim()).filter(Boolean);
      base.acceptedSequences = [base.answer];
    } else {
      base.sampleAnswer = ansRaw;
      base.requiredKeywords = optRaw ? optRaw.split('|').map(s => s.trim()).filter(Boolean) : [];
    }
    return base;
  }

  function applySheetsOverrides(baseLessons) {
    const ov = state.sheetsOverrides;
    if (!ov || !ov.ok) return baseLessons;
    const byId = new Map(baseLessons.map(l => [l.id, JSON.parse(JSON.stringify(l))]));
    (ov.baiHoc || []).forEach(r => {
      const id = String(r.id || '').trim();
      if (!id) return;
      const ex = byId.get(id) || {
        id, courseId: String(r.courseId || 'hsk1'), order: Number(r.order || byId.size + 1),
        group: String(r.group || 'Bài mở rộng'), zhTitle: '', viTitle: '', description: '',
        estimatedMinutes: 35, image: 'images/hsk1-lesson01.jpg',
        vocabulary: [], dialogues: [], grammar: [], sentencePatterns: [], exercises: []
      };
      if (r.order) ex.order = Number(r.order);
      if (r.zhTitle) ex.zhTitle = String(r.zhTitle);
      if (r.viTitle) ex.viTitle = String(r.viTitle);
      if (r.description) ex.description = String(r.description);
      if (r.estimatedMinutes) ex.estimatedMinutes = Number(r.estimatedMinutes);
      if (r.image) ex.image = String(r.image);
      byId.set(id, ex);
    });
    if (Array.isArray(ov.tuVung) && ov.tuVung.length) {
      const tvByLesson = {};
      ov.tuVung.forEach(r => {
        const lid = String(r.lessonId || '').trim();
        if (!lid) return;
        if (!tvByLesson[lid]) tvByLesson[lid] = [];
        tvByLesson[lid].push({
          id: String(r.id || ('v-' + tvByLesson[lid].length)),
          hanzi: String(r.hanzi || ''), pinyin: String(r.pinyin || ''), meaning: String(r.meaning || ''),
          pos: String(r.pos || ''), exampleZh: String(r.exampleZh || ''),
          examplePinyin: String(r.examplePinyin || ''), exampleVi: String(r.exampleVi || ''),
          usage: String(r.usage || '')
        });
      });
      Object.keys(tvByLesson).forEach(lid => {
        if (byId.has(lid)) byId.get(lid).vocabulary = tvByLesson[lid];
      });
    }
    if (Array.isArray(ov.baiTap) && ov.baiTap.length) {
      const btByLesson = {};
      ov.baiTap.forEach(r => {
        const lid = String(r.lessonId || '').trim();
        if (!lid) return;
        if (!btByLesson[lid]) btByLesson[lid] = [];
        btByLesson[lid].push(parseSheetExerciseRow(r));
      });
      Object.keys(btByLesson).forEach(lid => {
        if (byId.has(lid)) byId.get(lid).exercises = btByLesson[lid];
      });
    }
    return Array.from(byId.values()).sort((a, b) => a.order - b.order);
  }

  async function syncFromGoogleSheets(silent) {
    const url = (state.gasUrl || '').trim();
    if (!url) {
      if (!silent) showToast('Vui lòng dán link Web App Google Apps Script trước.');
      return;
    }
    state.sheetsSyncStatus = 'syncing';
    if (!silent) render();
    try {
      const sep = url.includes('?') ? '&' : '?';
      const resp = await fetch(url + sep + 'action=getCurriculum', { method: 'GET' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      if (!data || !data.ok) throw new Error((data && data.error) || 'Dữ liệu không hợp lệ');
      state.sheetsOverrides = data;
      state.sheetsSyncStatus = 'ok';
      state.sheetsLastSynced = new Date().toLocaleTimeString('vi-VN');
      safeSave(STORE_KEYS.sheetsCache, data);
      if (!silent) showToast('Đã đồng bộ dữ liệu bài học từ Google Sheets!');
      render();
    } catch (err) {
      state.sheetsSyncStatus = 'error';
      if (!silent) showToast('Không kết nối được Google Sheets: ' + (err && err.message ? err.message : 'Lỗi mạng'));
      render();
    }
  }

  // ==================== AUDIO & SPEECH SYNTHESIS ====================
  function stopAudio() {
    if (activeAudioEl) {
      activeAudioEl.pause();
      activeAudioEl.currentTime = 0;
      activeAudioEl = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  function speakZh(text, audioFile, rate) {
    stopAudio();
    const speed = rate || 0.95;
    if (audioFile) {
      try {
        const a = new Audio(audioFile);
        a.playbackRate = speed;
        activeAudioEl = a;
        a.play().catch(() => fallbackTTS(text, speed));
        return;
      } catch (e) {}
    }
    fallbackTTS(text, speed);
  }

  let cachedVoices = [];
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    const loadV = () => { cachedVoices = window.speechSynthesis.getVoices() || []; };
    loadV();
    if ('onvoiceschanged' in window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadV;
    }
  }

  function pickZhVoice() {
    const list = (window.speechSynthesis.getVoices && window.speechSynthesis.getVoices().length)
      ? window.speechSynthesis.getVoices()
      : cachedVoices;
    return list.find(v => v.lang && v.lang.toLowerCase() === 'zh-cn')
      || list.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
      || null;
  }

  function fallbackTTS(text, rate) {
    if (!('speechSynthesis' in window)) {
      showToast('Trình duyệt hiện tại không hỗ trợ phát âm tự động.');
      return;
    }
    const cleanText = String(text || '').replace(/(^|\s)[A-Za-z][：:]/g, ' ').replace(/\s+/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'zh-CN';
    u.rate = rate || 0.92;
    const zh = pickZhVoice();
    if (zh) u.voice = zh;
    u.onerror = () => showToast('Không phát được giọng đọc tiếng Trung trên trình duyệt này.');
    window.speechSynthesis.speak(u);
  }

  function playDialogueAll(dialogueId) {

    showToast('Đang phát toàn bộ hội thoại (giọng đọc trình duyệt dự phòng)...');
  }

  // ==================== GRADING ENGINE (ALL 12 TYPES) ====================
  function normText(s) {
    return String(s || '').trim().toLowerCase().replace(/[.,!?;:，。！？；："'“”‘’]/g, '').replace(/\s+/g, ' ');
  }

  function isAnswered(ex, val) {
    if (val === undefined || val === null || val === '') return false;
    if (ex.type === 'pinyin_to_hanzi_write' || ex.type === 'meaning_bank_select' || ex.type === 'translate_batch_vi_zh') {
      const total = (ex.items || []).length;
      return Array.isArray(val) && total > 0 && (ex.items || []).every((_, i) => String(val[i] || '').trim().length > 0);
    }
    if (Array.isArray(val)) return val.length > 0;
    if (typeof val === 'object') return Object.keys(val).length >= (ex.pairs ? ex.pairs.length : 1);
    return true;
  }

  function gradeOne(ex, val) {
    const maxPts = ex.points || 1;
    if (!isAnswered(ex, val)) {
      return { status: 'unanswered', earned: 0, max: maxPts, note: 'Câu hỏi chưa được trả lời.' };
    }
    switch (ex.type) {
      case 'single_choice':
      case 'pinyin_for_hanzi':
      case 'hanzi_for_pinyin':
      case 'listening_choice':
      case 'reading_comp':
      case 'true_false':
        return val === ex.answer
          ? { status: 'correct', earned: maxPts, max: maxPts }
          : { status: 'incorrect', earned: 0, max: maxPts };
      case 'multiple_choice': {
        const exp = [...(ex.answer || [])].sort();
        const act = [...(val || [])].sort();
        const ok = exp.length === act.length && exp.every((v, i) => v === act[i]);
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts };
      }
      case 'fill_blank': {
        const clean = normText(val);
        const ok = (ex.acceptedAnswers || []).map(normText).includes(clean);
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts };
      }
      case 'word_order': {
        const joined = (val || []).join('');
        const seqs = ex.acceptedSequences || [ex.answer || []];
        const ok = seqs.some(s => s.join('') === joined);
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts };
      }
      case 'matching': {
        const ok = (ex.pairs || []).every(p => val[p.left] === p.right);
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts };
      }
      case 'pinyin_to_hanzi_write': {
        const items = ex.items || [];
        const right = items.filter((it, i) => normText((val || [])[i] || '') === normText(it.answer)).length;
        const ok = items.length > 0 && right === items.length;
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts, note: 'Đúng ' + right + '/' + items.length + ' từ.' };
      }
      case 'meaning_bank_select': {
        const items = ex.items || [];
        const right = items.filter((it, i) => ((val || [])[i] || '') === it.answerKey).length;
        const ok = items.length > 0 && right === items.length;
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts, note: 'Đúng ' + right + '/' + items.length + ' từ.' };
      }
      case 'translate_batch_vi_zh': {
        const items = ex.items || [];
        const right = items.filter((it, i) => {
          const clean = normText((val || [])[i] || '');
          if (!clean) return false;
          const acc = (it.acceptedAnswers || [it.sampleAnswer]).map(normText);
          if (acc.includes(clean)) return true;
          const kws = (it.requiredKeywords || []).map(normText);
          return kws.length > 0 && kws.every(k => clean.includes(k));
        }).length;
        const ok = items.length > 0 && right === items.length;
        return { status: ok ? 'correct' : 'incorrect', earned: ok ? maxPts : 0, max: maxPts, note: 'Đúng ' + right + '/' + items.length + ' câu.' };
      }
      case 'translate_vi_zh':
      case 'translate_zh_vi': {
        const clean = normText(val);
        const accepted = (ex.acceptedAnswers || []).map(normText);
        if (accepted.includes(clean)) {
          return { status: 'correct', earned: maxPts, max: maxPts, note: 'Khớp chính xác với đáp án chuẩn.' };
        }
        const kws = (ex.requiredKeywords || []).map(normText);
        if (kws.length > 0 && kws.every(k => clean.includes(k))) {
          return { status: 'correct', earned: maxPts, max: maxPts, note: 'Đủ từ khóa cốt lõi theo quy tắc chấm của giáo viên.' };
        }
        if (clean.length >= 2) {
          return { status: 'needs_teacher_review', earned: 0, max: maxPts, note: 'Chưa đủ cơ sở kết luận tự động — đánh dấu Cần giáo viên chấm (không chấm sai).' };
        }
        return { status: 'incorrect', earned: 0, max: maxPts };
      }
      default:
        return { status: 'unanswered', earned: 0, max: maxPts };
    }
  }

  function getLessonBestScore(lessonId) {
    const list = state.attempts.filter(a => a.lessonId === lessonId);
    if (!list.length) return null;
    return Math.max(...list.map(a => a.scorePercent));
  }

  function getLessonStatus(lessonId) {
    const best = getLessonBestScore(lessonId);
    if (best !== null) return 'completed';
    if (state.activeLessonId === lessonId && Object.keys(state.answers).length > 0) return 'in_progress';
    return 'not_started';
  }

        <div class="card-warm rounded-2xl p-4 flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
          <div class="relative flex-1">
            <input id="course-search-input" type="text" value="${escHtml(state.searchQuery)}" oninput="updateCourseSearch(this.value)" placeholder="Tìm bài học theo tên tiếng Trung, tiếng Việt hoặc chủ đề..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#F3F7FB] border border-[#D6E2EE] text-sm focus:outline-none focus:border-[#1D5B9B]" />
            <i data-lucide="search" class="w-4 h-4 text-[#6E8499] absolute left-3.5 top-3"></i>
          </div>
          <div class="flex flex-wrap gap-2">
            <select onchange="updateCourseFilter('groupFilter', this.value)" class="px-3 py-2 rounded-xl bg-[#F3F7FB] border border-[#D6E2EE] text-xs font-semibold">
              <option value="all" ${state.groupFilter === 'all' ? 'selected' : ''}>Tất cả nhóm bài</option>
              ${groups.map(g => `<option value="${escHtml(g)}" ${state.groupFilter === g ? 'selected' : ''}>${escHtml(g)}</option>`).join('')}
            </select>
            <select onchange="updateCourseFilter('statusFilter', this.value)" class="px-3 py-2 rounded-xl bg-[#F3F7FB] border border-[#D6E2EE] text-xs font-semibold">
              <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Mọi trạng thái</option>
              <option value="not_started" ${state.statusFilter === 'not_started' ? 'selected' : ''}>Chưa học</option>
              <option value="in_progress" ${state.statusFilter === 'in_progress' ? 'selected' : ''}>Đang học</option>
              <option value="completed" ${state.statusFilter === 'completed' ? 'selected' : ''}>Đã hoàn thành</option>
            </select>
            <select onchange="updateCourseFilter('sortOrder', this.value)" class="px-3 py-2 rounded-xl bg-[#F3F7FB] border border-[#D6E2EE] text-xs font-semibold">
              <option value="asc" ${state.sortOrder === 'asc' ? 'selected' : ''}>Thứ tự: Bài 1 → cuối</option>
              <option value="desc" ${state.sortOrder === 'desc' ? 'selected' : ''}>Thứ tự: Mới nhất trước</option>
            </select>
          </div>
        </div>

        <!-- Lessons Grid -->
        ${filtered.length ? `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${filtered.map(renderLessonCard).join('')}
          </div>
        ` : `
          <div class="card-warm rounded-2xl p-10 text-center space-y-3">
            <div class="zh text-3xl text-[#B9CCE0]">暂无课程</div>
            <div class="font-bold text-[#0F2537]">Chưa có bài học nào khớp bộ lọc hoặc cấp độ ${escHtml(activeCourse.code)}</div>
            <p class="text-sm text-[#475F75] max-w-md mx-auto">Giáo viên có thể thêm trực tiếp bài học mới cho ${escHtml(activeCourse.code)} bằng biểu mẫu hoặc nhập file JSON trong Khu vực Giáo viên mà không cần sửa mã nguồn.</p>
            <button type="button" onclick="navigate('teacher')" class="btn-brand px-5 py-2.5 rounded-xl text-sm font-bold">Thêm bài học ngay</button>
          </div>
        `}
      </div>
    `;
  }

  function selectCourseTab(courseId) {
    state.selectedCourseId = courseId;
    state.groupFilter = 'all';
    render();
  }
  function updateCourseSearch(val) { state.searchQuery = val; render(); }
  function updateCourseFilter(field, val) { state[field] = val; render(); }

  // ==================== VOCABULARY BANK VIEW ====================
  function renderVocabBank() {
    const allLessons = getLessons();
    const allVocab = allLessons.flatMap(l => l.vocabulary.map(v => ({ ...v, lessonTitle: 'Bài ' + l.order + ': ' + l.viTitle, lessonId: l.id })));
    const reviewCount = allVocab.filter(v => state.vocabStatus[v.id] === 'review').length;
    const masteredCount = allVocab.filter(v => state.vocabStatus[v.id] === 'mastered').length;

    return `
      <div class="space-y-6 fade-in">
        <div class="card-warm rounded-2xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl font-extrabold text-[#0F2537]">Kho Từ vựng New HSK 1 (3.0) (生词库)</h1>
            <p class="text-sm text-[#475F75]">Tổng ${allVocab.length} từ vựng chuẩn · Đã thuộc: <strong class="text-[#1F7A53]">${masteredCount}</strong> · Cần ôn tập: <strong class="text-[#A16207]">${reviewCount}</strong></p>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="setDisplayMode('hanzi')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${state.displayMode==='hanzi'?'bg-[#1D5B9B] text-white border-[#1D5B9B]':'bg-[#EAF1F8] border-[#B9CCE0]'}">Ẩn</button>
            <button type="button" onclick="setDisplayMode('pinyin')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${state.displayMode==='pinyin'?'bg-[#1D5B9B] text-white border-[#1D5B9B]':'bg-[#EAF1F8] border-[#B9CCE0]'}">Pinyin</button>
            <button type="button" onclick="setDisplayMode('all')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${state.displayMode==='all'?'bg-[#1D5B9B] text-white border-[#1D5B9B]':'bg-[#EAF1F8] border-[#B9CCE0]'}">Tất cả</button>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 mode-${state.displayMode}">
          ${allVocab.map(v => {
            const st = state.vocabStatus[v.id] || 'new';
            return `
              <div class="card-warm rounded-2xl p-4 space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="text-[11px] font-semibold text-[#6E8499]">${escHtml(v.lessonTitle)} · ${escHtml(v.pos)}</div>
                    <div class="zh text-2xl font-bold text-[#0F2537] mt-0.5">${escHtml(v.hanzi)}</div>
                    <div class="toggle-pinyin text-sm font-semibold text-[#1D5B9B]">${escHtml(v.pinyin)}</div>
                  </div>
                  <button type="button" onclick="speakZh('${escHtml(v.hanzi)}')" class="p-2 rounded-xl bg-[#F3F7FB] hover:bg-[#E0EEFA] text-[#1D5B9B] border border-[#D6E2EE]" title="Nghe phát âm">
                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                  </button>
                </div>
                <div class="toggle-vi text-sm font-semibold text-[#0F2537]">${escHtml(v.meaning)}</div>
                <div class="p-2.5 rounded-xl bg-[#F3F7FB] text-xs space-y-0.5">
                  <div class="zh font-medium text-[#0F2537]">${escHtml(v.exampleZh)}</div>
                  <div class="toggle-pinyin text-[#1D5B9B]">${escHtml(v.examplePinyin)}</div>
                  <div class="toggle-vi text-[#475F75]">${escHtml(v.exampleVi)}</div>
                </div>
                <div class="flex gap-2 pt-1">
                  <button type="button" onclick="toggleVocabStatus('${v.id}','mastered')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border ${st==='mastered'?'bg-[#EAF6EF] text-[#1F7A53] border-[#1F7A53]':'bg-white border-[#D6E2EE] text-[#475F75]'}">✓ Đã thuộc</button>
                  <button type="button" onclick="toggleVocabStatus('${v.id}','review')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border ${st==='review'?'bg-[#FEF5E5] text-[#A16207] border-[#A16207]':'bg-white border-[#D6E2EE] text-[#475F75]'}">★ Cần ôn</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  // ==================== LESSON DETAIL VIEW (2-COLUMN WORKSPACE) ====================
  
  const EX_SECTIONS = [
    { id: 'vocab', badge: '词', title: 'Phần 1: Từ vựng (词语)', desc: 'Luyện mặt chữ Hán, thanh điệu Pinyin và nối nghĩa tiếng Việt.' },
    { id: 'grammar', badge: '法', title: 'Phần 2: Ngữ pháp & Mẫu câu (语法)', desc: 'Trắc nghiệm A/B/C, Đúng/Sai và sắp xếp từ thành câu hoàn chỉnh.' },
    { id: 'reading', badge: '文', title: 'Phần 3: Bài khóa & Hội thoại (课文)', desc: 'Đọc hiểu tình huống giao tiếp trong các bài khóa chuẩn HSK 3.0.' },
    { id: 'writing', badge: '写', title: 'Phần 4: Viết & Dịch câu (写)', desc: 'Điền từ tổng hợp và dịch câu (tự động nhận diện từ khóa hoặc đánh dấu Cần giáo viên chấm).' },
    { id: 'listening', badge: '听', title: 'Phần 5: Nghe hiểu (听)', desc: 'Nghe phát âm và chọn đáp án đúng; mở lời nghe (Transcript) sau khi nộp bài.' }
  ];

  function toggleExSection(secId) {
    if (!state.collapsedSections) state.collapsedSections = {};
    state.collapsedSections[secId] = !state.collapsedSections[secId];
    render();
  }

  function renderLesson() {
    const lessons = getLessons();
    const lesson = lessons.find(l => l.id === state.activeLessonId) || lessons[0];
    const totalQ = lesson.exercises.length;
    const answeredCount = lesson.exercises.filter(ex => isAnswered(ex, state.answers[ex.id])).length;
    const progressPct = totalQ ? Math.round((answeredCount / totalQ) * 100) : 0;

    return `
      <div class="space-y-5 fade-in mode-${state.displayMode} font-scale-${state.fontScale}">
        <!-- Sticky Lesson Learning Toolbar (Inspired by bthsk13.0) -->
        <div class="sticky top-16 z-30 card-warm rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2.5 flex-wrap">
            <button type="button" onclick="navigate('courses')" class="px-3 py-1.5 rounded-xl bg-[#EAF1F8] hover:bg-[#DCE8F4] text-xs font-bold text-[#0F2537] inline-flex items-center gap-1">
              <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Danh sách
            </button>
            <select onchange="openLesson(this.value)" class="px-3 py-1.5 rounded-xl bg-[#F3F7FB] border border-[#B9CCE0] text-xs font-bold text-[#0F2537]">
              ${lessons.map(l => `<option value="${l.id}" ${l.id === lesson.id ? 'selected' : ''}>Bài ${l.order}: ${escHtml(l.zhTitle)} – ${escHtml(l.viTitle)}</option>`).join('')}
            </select>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Display Mode Segmented Control -->
            <div class="inline-flex rounded-xl bg-[#EAF1F8] p-0.5 border border-[#D6E2EE]">
              ${[['hanzi', 'Ẩn'], ['pinyin', 'Pinyin'], ['all', 'Tất cả']].map(([m, lbl]) => `
                <button type="button" onclick="setDisplayMode('${m}')" class="px-3 py-1 rounded-lg text-xs font-bold transition ${state.displayMode === m ? 'bg-[#1D5B9B] text-white shadow-sm' : 'text-[#475F75] hover:text-[#0F2537]'}">${lbl}</button>
              `).join('')}
            </div>
            <!-- Font Size Controls -->
            <div class="inline-flex rounded-xl bg-[#EAF1F8] p-0.5 border border-[#D6E2EE]">
              ${[['sm', 'A-'], ['md', 'A'], ['lg', 'A+']].map(([sz, lbl]) => `
                <button type="button" onclick="setFontScale('${sz}')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${state.fontScale === sz ? 'bg-[#0F2537] text-white' : 'text-[#475F75]'}">${lbl}</button>
              `).join('')}
            </div>
            <span class="px-3 py-1 rounded-xl bg-[#E0EEFA] text-[#1D5B9B] text-xs font-extrabold">
              ${answeredCount} / ${totalQ} câu (${progressPct}%)
            </span>
          </div>
        </div>

        <!-- 2-Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Left Sticky TOC & Progress Panel -->
          <aside class="lg:col-span-3 lg:sticky lg:top-36 space-y-4">
            <div class="card-warm rounded-2xl p-4 space-y-3">
              <div class="text-xs font-bold uppercase tracking-wider text-[#1D5B9B]">${escHtml(lesson.courseId.toUpperCase())} · Mục lục bài học</div>
              <nav class="space-y-1 text-sm">
                <a href="#sec-vocab" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-[#EAF1F8] font-semibold text-[#0F2537]">
                  <span>1. Từ vựng (生词)</span><span class="text-xs text-[#6E8499]">${lesson.vocabulary.length}</span>
                </a>
                <a href="#sec-dialogue" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-[#EAF1F8] font-semibold text-[#0F2537]">
                  <span>2. Hội thoại (对话)</span><span class="text-xs text-[#6E8499]">${lesson.dialogues.length}</span>
                </a>
                <a href="#sec-grammar" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-[#EAF1F8] font-semibold text-[#0F2537]">
                  <span>3. Ngữ pháp (语法)</span><span class="text-xs text-[#6E8499]">${lesson.grammar.length}</span>
                </a>
                <a href="#sec-patterns" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-[#EAF1F8] font-semibold text-[#0F2537]">
                  <span>4. Mẫu câu ứng dụng</span><span class="text-xs text-[#6E8499]">${lesson.patterns.length}</span>
                </a>
                <a href="#sec-exercises" class="flex items-center justify-between px-3 py-2 rounded-xl bg-[#E0EEFA]/70 hover:bg-[#E0EEFA] font-bold text-[#1D5B9B]">
                  <span>5. Bài tập 5 kỹ năng</span><span class="text-xs font-extrabold">${answeredCount}/${totalQ}</span>
                </a>
                <div class="pl-2 space-y-1 pt-1">
                  ${EX_SECTIONS.map(sec => {
                    const secQs = lesson.exercises.filter(e => (e.section || 'grammar') === sec.id);
                    if (!secQs.length) return '';
                    const secAns = secQs.filter(e => isAnswered(e, state.answers[e.id])).length;
                    return `<a href="#ex-sec-${sec.id}" class="flex items-center justify-between px-2.5 py-1.5 rounded-lg hover:bg-[#EAF1F8] text-xs text-[#475F75]">
                      <span class="flex items-center gap-1.5"><span class="w-5 h-5 rounded bg-[#EAF1F8] text-[#1D5B9B] font-bold zh inline-flex items-center justify-center text-[11px]">${sec.badge}</span>${sec.title.split(':')[1].split('(')[0].trim()}</span>
                      <span class="font-bold ${secAns === secQs.length ? 'text-[#157347]' : 'text-[#6E8499]'}">${secAns}/${secQs.length}</span>
                    </a>`;
                  }).join('')}
                </div>

              <!-- Progress Bar -->
              <div class="pt-3 border-t border-[#D6E2EE] space-y-2">
                <div class="flex justify-between text-xs font-semibold">
                  <span class="text-[#475F75]">Tiến độ bài tập</span>
                  <span class="text-[#0F2537]">${progressPct}%</span>
                </div>
                <div class="w-full h-2 rounded-full bg-[#DCE7F2] overflow-hidden">
                  <div class="h-full bg-[#1D5B9B] transition-all duration-300" style="width:${progressPct}%"></div>
                </div>
              </div>

              <div class="pt-2">
                <div class="text-[11px] font-bold text-[#475F75] mb-2">Chuyển nhanh câu hỏi:</div>
                <div class="grid grid-cols-5 gap-1.5">
                  ${lesson.exercises.map((ex, i) => {
                    const ans = isAnswered(ex, state.answers[ex.id]);
                    const flagged = state.flaggedQuestions[ex.id];
                    const gr = state.gradeResults ? state.gradeResults[ex.id] : null;
                    let cls = 'bg-[#F3F7FB] text-[#475F75] border-[#D6E2EE]';
                    if (gr) {
                      cls = gr.status === 'correct' ? 'bg-[#1F7A53] text-white border-[#1F7A53]'
                        : gr.status === 'incorrect' ? 'bg-[#C43D4B] text-white border-[#C43D4B]'
                        : gr.status === 'needs_teacher_review' ? 'bg-[#D97706] text-white border-[#D97706]'
                        : 'bg-[#CEDCEB] text-[#475F75] border-[#B9CCE0]';
                    } else if (flagged) {
                      cls = 'bg-[#FEF5E5] text-[#A16207] border-[#D97706]';
                    } else if (ans) {
                      cls = 'bg-[#1D5B9B] text-white border-[#1D5B9B]';
                    }
                    return `<a href="#q-card-${ex.id}" class="h-8 rounded-lg border text-xs font-bold flex items-center justify-center ${cls}">${i + 1}</a>`;
                  }).join('')}
                </div>
              </div>

              <!-- Instant Feedback Mode Toggle -->
              <label class="flex items-center gap-2 pt-2 border-t border-[#D6E2EE] text-xs text-[#475F75] cursor-pointer">
                <input type="checkbox" ${state.instantFeedbackMode ? 'checked' : ''} onchange="toggleInstantMode(this.checked)" class="rounded accent-[#1D5B9B]" />
                <span>Chế độ luyện tập hiện giải đáp tức thì</span>
              </label>

              ${!state.submitted ? `
                <button type="button" onclick="handleLessonSubmit()" class="w-full btn-brand py-2.5 rounded-xl font-bold text-sm">
                  ${state.pendingConfirmSubmit ? 'Nhấn lại để Xác nhận nộp bài' : 'Nộp bài & Chấm điểm'}
                </button>
              ` : `
                <button type="button" onclick="retryLesson()" class="w-full py-2.5 rounded-xl bg-[#0E7490] hover:bg-[#0B5C73] text-white font-bold text-sm inline-flex items-center justify-center gap-1.5">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Làm lại bài này
                </button>
              `}
            </div>
          </aside>

          <!-- Right Main Content Area -->
          <div class="lg:col-span-9 space-y-6">
            <!-- Lesson Hero Banner -->
            <div class="card-warm rounded-2xl p-6 flex flex-col sm:flex-row gap-5 items-center">
              <img src="${getImgSrc(lesson.image)}" alt="${escHtml(lesson.viTitle)}" class="w-full sm:w-44 h-32 object-cover rounded-xl border border-[#D6E2EE]" />
              <div class="flex-1 space-y-1.5">
                <div class="text-xs font-bold text-[#1D5B9B]">${escHtml(lesson.courseId.toUpperCase())} · BÀI ${lesson.order}</div>
                <h1 class="zh zh-lg font-extrabold text-[#0F2537]">${escHtml(lesson.zhTitle)}</h1>
                <div class="toggle-pinyin text-sm font-semibold text-[#1D5B9B]">${escHtml(lesson.pinyinTitle)}</div>
                <div class="toggle-vi text-base font-bold text-[#475F75]">${escHtml(lesson.viTitle)}</div>
                <p class="text-xs text-[#475F75] pt-1">${escHtml(lesson.summary)}</p>
              </div>
            </div>

            <!-- PHẦN 1: TỪ VỰNG -->
            <section id="sec-vocab" class="card-warm rounded-2xl p-5 sm:p-6 space-y-4 scroll-mt-36">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="text-lg font-extrabold text-[#0F2537]">PHẦN 1: TỪ VỰNG <span class="zh text-[#1D5B9B]">(生词)</span></h2>
                  <p class="text-xs text-[#475F75]">Nhấn vào chữ Hán để xem giải thích chi tiết & cụm từ đi kèm; nhấn biểu tượng loa để nghe phát âm.</p>
                </div>
                <div class="inline-flex rounded-xl bg-[#EAF1F8] p-0.5 border border-[#D6E2EE]">
                  <button type="button" onclick="setVocabViewMode('table')" class="px-3 py-1 rounded-lg text-xs font-bold ${state.vocabViewMode==='table'?'bg-white text-[#0F2537] shadow-sm':'text-[#475F75]'}">Bảng</button>
                  <button type="button" onclick="setVocabViewMode('cards')" class="px-3 py-1 rounded-lg text-xs font-bold ${state.vocabViewMode==='cards'?'bg-white text-[#0F2537] shadow-sm':'text-[#475F75]'}">Thẻ từ</button>
                </div>
              </div>

              ${state.vocabViewMode === 'table' ? `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr class="border-b border-[#D6E2EE] text-xs uppercase text-[#475F75] bg-[#F3F7FB]">
                        <th class="py-2.5 px-2">STT</th>
                        <th class="py-2.5 px-3">Chữ Hán</th>
                        <th class="py-2.5 px-3 toggle-pinyin">Pinyin</th>

                        <th class="py-2.5 px-3 hidden md:table-cell">Câu ví dụ</th>
                        <th class="py-2.5 px-2 text-right">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-[#E3ECF5]">
                      ${lesson.vocabulary.map((v, i) => {
                        const st = state.vocabStatus[v.id] || 'new';

                        return `
                          <tr class="hover:bg-[#F3F7FB]/80 transition">
                            <td class="py-3 px-2 text-xs font-bold text-[#6E8499]">${i + 1}</td>
                            <td class="py-3 px-3">
                              <button type="button" onclick="toggleExpandVocab('${v.id}')" class="zh text-xl font-bold text-[#0F2537] hover:text-[#1D5B9B] underline decoration-dotted underline-offset-4">
                                ${escHtml(v.hanzi)}

                            </td>
                            <td class="py-3 px-3 toggle-pinyin font-semibold text-[#1D5B9B]">${escHtml(v.pinyin)}</td>

    let bodyHtml = '';

    }
    if (ex.audioText) {
      bodyHtml += `

              </button>
            </div>
          </div>
          ${state.submitted ? `
            <details class="rounded-lg bg-white/90 border border-[#D6E2EE] px-3 py-2 text-xs">
              <summary class="font-bold text-[#0E7490] cursor-pointer">▶ Xem lời nghe (Transcript)...</summary>
              <div class="mt-1.5 zh font-bold text-sm text-[#0F2537]">${escHtml(ex.audioText)}</div>
            </details>
          ` : ''}
        </div>
      `;
    }

    if (['single_choice', 'pinyin_for_hanzi', 'hanzi_for_pinyin', 'listening_choice', 'reading_comp'].includes(ex.type)) {
      bodyHtml += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">` + (ex.options || []).map((opt, oi) => {
        const chosen = val === opt;
        const letter = String.fromCharCode(65 + oi);
        return `<button type="button" ${state.submitted ? 'disabled' : ''} onclick="setSingleAnswer('${ex.id}', ${'`' + opt.replace(/`/g, '') + '`'})" class="text-left px-3.5 py-2.5 rounded-xl border text-sm font-medium flex items-center gap-2.5 transition ${chosen ? 'bg-[#1D5B9B] text-white border-[#1D5B9B]' : 'bg-white text-[#0F2537] border-[#D6E2EE] hover:border-[#1D5B9B]'}">
